<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4: Hàng Phím Dưới - Lớp 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Baloo 2', cursive, sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #0f172a;
        }

        /* --- SLIDE MỞ ĐẦU (CANH GIỮA THỨ NGÀY, MÔN, TÊN BÀI) --- */
        .intro-slide {
            position: fixed;
            inset: 0;
            background: #e0f7fa;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .intro-content {
            text-align: center;
            background: white;
            padding: 55px 80px;
            border-radius: 28px;
            border: 6px solid #4dd0e1;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .intro-date {
            font-size: 28px;
            color: #555;
            font-style: italic;
            margin-bottom: 16px;
            font-weight: 700;
            text-align: center;
        }

        .intro-subject {
            font-size: 40px;
            color: #00838f;
            font-weight: 800;
            margin-bottom: 8px;
            text-align: center;
        }

        .intro-title {
            font-size: 56px;
            color: #d84315;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 36px;
            text-shadow: 2px 2px 0px #ffe0b2;
            text-align: center;
        }

        .btn-enter {
            font-size: 28px;
            padding: 14px 50px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 800;
            box-shadow: 0 6px 0 #f57c00;
        }

        .btn-enter:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        /* --- KHUNG CHÍNH --- */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 12px 16px;
            gap: 10px;
        }

        .header-bar {
            background: white;
            border-radius: 16px;
            padding: 8px 18px;
            border: 4px solid #4dd0e1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            color: #00838f;
            font-size: 25px;
            margin: 0;
            text-transform: uppercase;
        }

        select,
        button {
            font-family: 'Baloo 2', cursive;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            border: none;
        }

        select {
            font-size: 18px;
            padding: 5px 12px;
            border: 2px solid #00acc1;
            color: #006064;
            outline: none;
        }

        .btn-ctrl {
            font-size: 16px;
            padding: 6px 14px;
            color: white;
        }

        .btn-green {
            background: #4caf50;
            box-shadow: 0 3px 0 #388e3c;
        }

        .btn-orange {
            background: #ff9800;
            box-shadow: 0 3px 0 #e65100;
        }

        .btn-red {
            background: #ef5350;
            box-shadow: 0 3px 0 #c62828;
        }

        .main-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 420px;
            gap: 14px;
            flex: 1;
            min-height: 0;
        }

        /* --- MÀN HÌNH CHƠI CHÍNH (SIÊU TỐI GIẢN CHO LỚP 2) --- */
        .game-area {
            background: white;
            border-radius: 20px;
            padding: 18px 28px;
            border: 4px solid #4dd0e1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        /* 1. TÊN EM ĐANG GÕ & EM CHUẨN BỊ LÊN */
        .turn-banner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        #student-name {
            font-size: 62px;
            color: #d84315;
            font-weight: 800;
            line-height: 1.05;
            text-shadow: 2px 2px 0px #ffe0b2;
        }

        .next-student-pill {
            background: #e0f2f1;
            border: 2px dashed #26a69a;
            color: #00695c;
            padding: 4px 20px;
            border-radius: 99px;
            font-size: 22px;
            font-weight: 800;
        }

        /* 2. CÂU TIẾNG ANH ĐẦY ĐỦ */
        .sentence-bar {
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            padding: 10px 30px;
            border-radius: 18px;
        }

        .sentence-word {
            font-size: 38px;
            font-weight: 800;
            color: #94a3b8;
            padding: 2px 14px;
            border-radius: 12px;
            letter-spacing: 2px;
        }

        .sentence-word.done {
            color: #16a34a;
            background: #dcfce7;
        }

        .sentence-word.active {
            color: #b91c1c;
            background: #fef08a;
            border: 3px solid #f59e0b;
            transform: scale(1.08);
        }

        /* 3. BA CHỮ CÁI CẦN GÕ (SIÊU TO) & ĐIỂM TỐC ĐỘ */
        .typing-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .key-container {
            display: flex;
            gap: 24px;
            justify-content: center;
        }

        .key-box {
            font-size: 115px;
            color: #2e7d32;
            font-weight: 800;
            background-color: #f1f8e9;
            border: 6px solid #aed581;
            border-radius: 26px;
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 0 #81c784;
            transition: all 0.15s ease;
        }

        .key-box.active {
            border-color: #ff9800;
            box-shadow: 0 10px 0 #f57c00;
            background-color: #fff3e0;
            transform: scale(1.1);
            color: #ef6c00;
        }

        .key-box.done {
            border-color: #4caf50;
            box-shadow: 0 2px 0 #388e3c;
            background-color: #c8e6c9;
            color: #1b5e20;
            transform: translateY(8px);
        }

        .key-box.error {
            border-color: #f44336;
            background-color: #ffcdd2;
            color: #b71c1c;
            animation: shake 0.3s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .speed-score-pill {
            font-size: 24px;
            font-weight: 800;
            color: #0369a1;
            background: #e0f2fe;
            border: 3px solid #7dd3fc;
            padding: 4px 24px;
            border-radius: 99px;
            transition: all 0.2s;
        }

        .speed-score-pill.counting {
            color: #d97706;
            background: #fffbeb;
            border-color: #fde68a;
        }

        /* HIỆU ỨNG KHI GÕ XONG 1 BẠN */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 16px;
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 58px;
            font-weight: 800;
            color: #e91e63;
        }

        /* --- CỘT PHẢI CHIA 2 TẦNG: 60% XẾP HẠNG THỜI GIAN THỰC + 40% HÀNG ĐỢI --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
            height: 100%;
        }

        .panel-box {
            background: white;
            border-radius: 18px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        }

        /* Tầng trên: Bảng Xếp Hạng Thời Gian Thực (Chiếm ~60% chiều cao) */
        .rank-panel {
            flex: 1.55;
            border: 4px solid #ffb300;
            background: #fffdf7;
        }

        /* Tầng dưới: Hàng Đợi Chưa Gõ (Chiếm ~40% chiều cao) */
        .queue-panel {
            flex: 1;
            border: 4px solid #9ccc65;
        }

        .panel-title {
            font-size: 19px;
            font-weight: 800;
            margin: 0 0 6px 0;
            padding-bottom: 4px;
            border-bottom: 2px dashed #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scroll-list {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }

        .scroll-list::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .list-item {
            padding: 6px 9px;
            margin-bottom: 5px;
            border-radius: 10px;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            font-size: 16.5px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .list-item.rank-1 {
            background: #fef9c3;
            border-color: #eab308;
            color: #854d0e;
        }

        .list-item.rank-2 {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #1e293b;
        }

        .list-item.rank-3 {
            background: #ffedd5;
            border-color: #f97316;
            color: #9a3412;
        }

        .list-item.current {
            background-color: #fef08a;
            color: #b91c1c;
            border-color: #f59e0b;
            border-left-width: 6px;
        }

        .list-item.pushed {
            background-color: #fff3e0;
            border-left: 5px solid #ff9800;
        }

        .list-item.banned {
            background-color: #ffcdd2;
            color: #b71c1c;
            text-decoration: line-through;
        }

        /* --- THẺ XẾP HẠNG TOP 3 THỜI GIAN THỰC --- */
        .rank-card-tier {
            padding: 9px 12px;
            margin-bottom: 7px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 3px solid #cbd5e1;
            font-size: 16.5px;
            font-weight: 800;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.04);
            animation: fadeInRank 0.25s ease-out;
        }

        @keyframes fadeInRank {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rank-card-tier.tier-1 {
            background: #fef9c3;
            border-color: #eab308;
            color: #854d0e;
            box-shadow: 0 4px 0 #ca8a04;
        }

        .rank-card-tier.tier-2 {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #1e293b;
            box-shadow: 0 4px 0 #64748b;
        }

        .rank-card-tier.tier-3 {
            background: #ffedd5;
            border-color: #f97316;
            color: #9a3412;
            box-shadow: 0 4px 0 #ea580c;
        }

        .tier-badge {
            font-size: 15px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .tie-badge {
            font-size: 11.5px;
            font-weight: 800;
            background: #dbeafe;
            color: #1d4ed8;
            border: 1.5px solid #93c5fd;
            border-radius: 6px;
            padding: 1px 6px;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }

        .rank-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 175px;
        }

        /* --- THANH TÌM KIẾM TRONG HÀNG ĐỢI --- */
        .queue-search-wrap {
            display: flex;
            align-items: center;
            background: #f1f8e9;
            border: 2px solid #aed581;
            border-radius: 10px;
            padding: 3px 8px;
            margin-bottom: 7px;
            gap: 6px;
        }

        .queue-search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 700;
            color: #2e7d32;
        }

        .queue-search-input::placeholder {
            color: #81c784;
            font-weight: 600;
        }

        .queue-search-clear {
            background: #c8e6c9;
            color: #1b5e20;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 11px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-weight: 800;
        }

        .queue-search-clear:hover {
            background: #a5d6a7;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .score-tag {
            background: #fef9c3;
            border: 1px solid #facc15;
            color: #854d0e;
            padding: 1px 7px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 800;
        }

        .action-btn {
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            padding: 1px 6px;
            font-size: 13.5px;
            font-weight: 800;
        }

        .action-btn:hover {
            transform: scale(1.08);
        }

        .btn-noise-pen {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        /* --- MODAL TỔNG KẾT XẾP HẠNG CUỐI GIỜ --- */
        .endgame-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            z-index: 1500;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .endgame-box {
            background: white;
            border: 6px solid #ff9800;
            border-radius: 28px;
            max-width: 980px;
            width: 100%;
            max-height: 90vh;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .endgame-list {
            overflow-y: auto;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px 4px;
            text-align: left;
        }

        .rank-card {
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: 800;
        }

        .rank-card.top-1 {
            background: #fef9c3;
            border-color: #eab308;
            color: #854d0e;
        }

        .rank-card.top-2 {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #334155;
        }

        .rank-card.top-3 {
            background: #ffedd5;
            border-color: #f97316;
            color: #9a3412;
        }
    </style>
</head>

<body>

    <!-- SLIDE MỞ ĐẦU -->
    <div id="intro-slide" class="intro-slide">
        <div class="intro-content">
            <div id="intro-date" class="intro-date"></div>
            <div class="intro-subject">Môn: Tin học</div>
            <div class="intro-title">BÀI 4: HÀNG PHÍM DƯỚI</div>
            <button class="btn-enter" onclick="enterGame()">Bắt đầu bài học 🐸</button>
        </div>
    </div>

    <!-- GIAO DIỆN CHÍNH -->
    <div id="app-container" style="display: none;">
        <div class="header-bar">
            <div class="header-left">
                <h1>🐸 BÀI 4: HÀNG PHÍM DƯỚI</h1>
                <select id="class-select" onchange="switchClass(this.value)">
                    <option value="2_2">Lớp 2/2</option>
                    <option value="2_4">Lớp 2/4</option>
                    <option value="2_5">Lớp 2/5</option>
                </select>
            </div>

            <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn-ctrl btn-green" onclick="skipStudent()"
                    title="Đẩy bạn hiện tại xuống cuối và gọi bạn kế tiếp">⏭ Qua bạn kế</button>
                <button class="btn-ctrl btn-orange" onclick="showEndGameModal()">🏆 Bảng Vinh Danh</button>
                <button class="btn-ctrl btn-red" onclick="clearSavedData()"
                    title="Xóa dữ liệu đã lưu của lớp này để chơi lại từ đầu">🗑️ Xóa Data</button>
            </div>
        </div>

        <div class="main-container">
            <!-- KHU VỰC HIỂN THỊ CHO HỌC SINH -->
            <div class="game-area">
                <div id="overlay-msg" class="overlay"></div>

                <!-- 1. TÊN EM ĐANG GÕ & EM CHUẨN BỊ LÊN -->
                <div class="turn-banner">
                    <div id="student-name">...</div>
                    <div class="next-student-pill" id="next-student-name">👟 Chuẩn bị lên: ...</div>
                </div>

                <!-- 2. CÂU TIẾNG ANH ĐẦY ĐỦ (28 CÂU - MỖI TỪ ĐỀU ĐÚNG 3 CHỮ CÁI) -->
                <div class="sentence-bar" id="sentence-bar"></div>

                <!-- 3. BA CHỮ CÁI EM ĐÓ CẦN GÕ & ĐIỂM TỐC ĐỘ (CHỈ ĐẾM KHI GÕ CHỮ ĐẦU TIÊN) -->
                <div class="typing-zone">
                    <div id="key-container" class="key-container"></div>
                    <div class="speed-score-pill" id="speed-pill">
                        ⚡ Điểm tốc độ: <span id="live-speed-score">1000</span> điểm <span id="speed-state-note">(Chờ gõ
                            chữ đầu tiên...)</span>
                    </div>
                </div>
            </div>

            <!-- CỘT PHẢI CHIA 2 KHUNG CỐ ĐỊNH: TRÊN (60% XẾP HẠNG THỰC) - DƯỚI (40% HÀNG ĐỢI) -->
            <div class="sidebar">
                <!-- TẦNG TRÊN (~60%): XẾP HẠNG THỜI GIAN THỰC (TẬP TRUNG RANK, TỐI ĐA GIẢI BA) -->
                <div class="panel-box rank-panel">
                    <div class="panel-title" style="color:#b45309;">
                        <span>🏆 XẾP HẠNG TOP 3</span>
                        <span style="font-size:14px; color:#78350f;" id="played-count-label">Đã gõ: 0</span>
                    </div>
                    <div class="scroll-list" id="realtime-rank-list"></div>
                </div>

                <!-- TẦNG DƯỚI (~40%): HÀNG ĐỢI CHƯA LÊN (CÓ TÌM KIẾM TÊN) -->
                <div class="panel-box queue-panel">
                    <div class="panel-title" style="color:#33691e;">
                        <span>📋 HÀNG ĐỢI CHỜ LÊN</span>
                        <span style="font-size:14px; color:#558b2f;">Còn: <span id="counter">0</span> bạn</span>
                    </div>
                    <div class="queue-search-wrap">
                        <input type="text" id="queue-search-input" class="queue-search-input"
                            placeholder="🔍 Tìm tên trong hàng đợi..." oninput="onQueueSearch(this.value)" autocomplete="off">
                        <button id="queue-search-clear" class="queue-search-clear" onclick="clearQueueSearch()"
                            title="Xóa tìm kiếm">✕</button>
                    </div>
                    <div class="scroll-list" id="queue-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL TỔNG KẾT XẾP HẠNG CUỐI GIỜ -->
    <div class="endgame-modal" id="endgame-modal">
        <div class="endgame-box">
            <h2 style="font-size:38px; color:#d84315; margin:0 0 10px;">🏆 BẢNG XẾP HẠNG CHUNG CUỘC 🏆</h2>
            <div class="endgame-list" id="endgame-list"></div>
            <div style="margin-top:14px; display:flex; justify-content:center; gap:12px;">
                <button class="btn-ctrl btn-green" style="font-size:20px; padding:10px 30px;"
                    onclick="closeEndGameModal()">Đóng bảng</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================================
           1. NGÂN HÀNG 28 CÂU TIẾNG ANH CÔNG BẰNG TUYỆT ĐỐI (84 TỪ)
           Tất cả các từ đều dài ĐÚNG 3 CHỮ CÁI và giàu phím Hàng dưới (Z, X, C, V, B, N, M)
           ========================================================================= */
        const SENTENCES = [
            ["CAT", "CAN", "RUN"],
            ["BIG", "RED", "VAN"],
            ["MOM", "HAS", "BOX"],
            ["SIX", "FAT", "PIG"],
            ["DOG", "SEE", "ZOO"],
            ["NEW", "BUS", "MAN"],
            ["FOX", "CAN", "MIX"],
            ["SUN", "AND", "SKY"],
            ["TEN", "RED", "PEN"],
            ["BOY", "CAN", "JAM"],
            ["COW", "EAT", "HAY"],
            ["BEE", "GET", "WAX"],
            ["ANT", "DIG", "MUD"],
            ["HEN", "LAY", "EGG"],
            ["DAD", "FIX", "CAR"],
            ["KID", "HUG", "MOM"],
            ["OWL", "FLY", "LOW"],
            ["BUG", "SIT", "LOG"],
            ["RAT", "HID", "BOX"],
            ["CUB", "RUN", "NOW"],
            ["PUG", "WAG", "LEG"],
            ["CAT", "NAP", "MAT"],
            ["JIM", "WIN", "CUP"],
            ["MAX", "GOT", "TOY"],
            ["ZAC", "ZIP", "BAG"],
            ["SAM", "MIX", "JAM"],
            ["BEN", "BUY", "BUN"],
            ["TOM", "MOP", "RUG"]
        ];

        const FALLBACK_CLASSES = {
            "2_2": [
                "Nguyễn Minh An", "Trần Bảo Anh", "Lê Hoàng Bách", "Phạm Ngọc Châu", "Võ Minh Chiến",
                "Đặng Quốc Cường", "Bùi Khánh Duy", "Hồ Minh Đức", "Ngô Gia Hân", "Dương Phúc Hậu",
                "Lý Minh Hiếu", "Trương Bảo Hoàng", "Phan Tuấn Kiệt", "Vũ Ngọc Lan", "Đỗ Hoàng Long",
                "Huỳnh Bảo Minh", "Nguyễn Thảo My", "Trần Khánh Nam", "Lê Kim Ngân", "Phạm Bảo Ngọc",
                "Võ Hoàng Nhân", "Đặng Yến Nhi", "Bùi Gia Phúc", "Hồ Minh Quân", "Ngô Phương Quỳnh",
                "Dương Thanh Tâm", "Lý Minh Tân", "Trương Anh Thư", "Phan Thủy Tiên", "Vũ Mộc Trà"
            ],
            "2_4": [
                "Lê Gia Bảo", "Nguyễn Ngọc Bích", "Trần Minh Cảnh", "Phạm Hoàng Danh", "Võ Tiến Đạt",
                "Đặng Hải Đăng", "Bùi Khánh Hà", "Hồ Ngọc Hân", "Ngô Minh Khang", "Dương Tuấn Khôi",
                "Lý Thiên Kim", "Trương Hoàng Lâm", "Phan Nhật Linh", "Vũ Bảo Lộc", "Đỗ Minh Mẫn",
                "Huỳnh Ái My", "Nguyễn Thành Nam", "Trần Bảo Nghi", "Lê Phương Nguyên", "Phạm Hồng Nhung"
            ],
            "2_5": [
                "Trần Quốc An", "Lê Kiều Anh", "Nguyễn Tuấn Bằng", "Phạm Minh Châu", "Võ Hoàng Chương",
                "Đặng Thành Đạt", "Bùi Minh Đông", "Hồ Khánh Giang", "Ngô Gia Huy", "Dương Ngọc Huyền",
                "Lý Quốc Khánh", "Trương Minh Khoa", "Phan Hoàng Khôi", "Vũ Ngọc Kỳ", "Đỗ Thiên Ân"
            ]
        };

        const MAX_WORD_SCORE = 1000;
        const DECAY_PER_SEC = 25; // Giảm 25 điểm / 1s (0.025 điểm/ms) tính sát sao theo từng mili giây

        let classLists = FALLBACK_CLASSES;
        let selectedClass = "2_2";
        let currentClassList = [];
        let remainingStudents = [];
        let playedStudentIds = [];
        let bannedStudentIds = [];
        let pushedStudentIds = [];
        let studentScores = {};

        let curSentenceIdx = 0;
        let curWordIdx = 0;
        let targetKeys = [];
        let currentKeyIndex = 0;
        let currentStudent = null;
        let isWaitingForKey = false;

        let liveSpeedScore = MAX_WORD_SCORE;
        let speedStartTime = null;
        let speedAnimFrame = null;
        let queueSearchKeyword = "";

        /* =========================================================================
           2. KHỞI TẠO & LƯU TRỮ LOCALSTORAGE (CHỐNG F5 MẤT DỮ LIỆU)
           ========================================================================= */
        window.onload = async function () {
            const today = new Date();
            const days = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
            document.getElementById("intro-date").innerText =
                `${days[today.getDay()]}, ngày ${today.getDate()} tháng ${today.getMonth() + 1} năm ${today.getFullYear()}`;

            try {
                const res = await fetch('../../assets/data/students_2_2026_2027.json');
                if (res.ok) {
                    const data = await res.json();
                    if (data && Object.keys(data).length) classLists = data;
                }
            } catch (e) {
                console.log("Dùng danh sách dự phòng tích hợp sẵn.");
            }

            const lastClass = localStorage.getItem("ech_b4_active_class");
            if (lastClass) {
                selectedClass = lastClass;
                document.getElementById("class-select").value = selectedClass;
            }
        };

        function getStorageKey(cls) {
            return `ech_b4_state_${cls}`;
        }

        function saveStateToLocal() {
            const payload = {
                selectedClass,
                currentClassList,
                remainingStudents,
                playedStudentIds,
                bannedStudentIds,
                pushedStudentIds,
                studentScores,
                curSentenceIdx,
                curWordIdx,
                currentStudent
            };
            localStorage.setItem("ech_b4_active_class", selectedClass);
            localStorage.setItem(getStorageKey(selectedClass), JSON.stringify(payload));
        }

        function loadStateFromLocal(cls) {
            const raw = localStorage.getItem(getStorageKey(cls));
            if (!raw) return false;
            try {
                const st = JSON.parse(raw);
                if (!st || !Array.isArray(st.currentClassList) || st.currentClassList.length === 0) return false;

                // Tương thích ngược: nếu dữ liệu cũ lưu mảng chuỗi tên, chuyển sang mảng object có ID duy nhất
                if (typeof st.currentClassList[0] === 'string') {
                    currentClassList = buildStudentList(st.currentClassList);
                    remainingStudents = shuffleArray([...currentClassList]);
                    playedStudentIds = [];
                    bannedStudentIds = [];
                    pushedStudentIds = [];
                    studentScores = {};
                    currentStudent = null;
                } else {
                    currentClassList = st.currentClassList;
                    remainingStudents = st.remainingStudents || [];
                    playedStudentIds = st.playedStudentIds || st.playedStudents || [];
                    bannedStudentIds = st.bannedStudentIds || st.bannedStudents || [];
                    pushedStudentIds = st.pushedStudentIds || st.pushedStudents || [];
                    studentScores = st.studentScores || {};
                    currentStudent = st.currentStudent || null;
                }
                curSentenceIdx = st.curSentenceIdx || 0;
                curWordIdx = st.curWordIdx || 0;
                return true;
            } catch (e) {
                return false;
            }
        }

        function clearSavedData() {
            if (!confirm(`Bạn có chắc muốn XÓA SẠCH điểm và lượt chơi của lớp ${selectedClass.replace('_', '/')} để bắt đầu lại từ đầu không?`)) return;
            localStorage.removeItem(getStorageKey(selectedClass));
            initFreshClass(selectedClass);
        }

        function enterGame() {
            document.getElementById("intro-slide").style.display = "none";
            document.getElementById("app-container").style.display = "flex";
            switchClass(document.getElementById("class-select").value);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function switchClass(cls) {
            selectedClass = cls;
            if (loadStateFromLocal(cls)) {
                if (!currentStudent && remainingStudents.length > 0) {
                    nextTurn();
                } else {
                    setupGameUI();
                }
            } else {
                initFreshClass(cls);
            }
        }

        function normalizeVN(str) {
            if (!str) return '';
            return str
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[đĐ]/g, 'd')
                .toLowerCase()
                .trim();
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        /* Khởi tạo danh sách học sinh với ID duy nhất & nhận diện trùng cả họ và tên */
        function buildStudentList(rawNames) {
            const nameCounts = {};
            rawNames.forEach(name => {
                const trimmed = (name || '').trim();
                nameCounts[trimmed] = (nameCounts[trimmed] || 0) + 1;
            });

            return rawNames.map((name, i) => {
                const trimmed = (name || '').trim();
                const isDup = (nameCounts[trimmed] || 0) > 1;
                return {
                    id: `hs_${i + 1}`,
                    stt: i + 1,
                    name: trimmed,
                    isDup: isDup,
                    displayName: isDup ? `${trimmed} [STT ${i + 1}]` : trimmed
                };
            });
        }

        function initFreshClass(cls) {
            const rawList = classLists[cls] || FALLBACK_CLASSES["2_2"];
            currentClassList = buildStudentList(rawList);
            remainingStudents = shuffleArray([...currentClassList]);
            playedStudentIds = [];
            bannedStudentIds = [];
            pushedStudentIds = [];
            studentScores = {};
            // Không áp dụng điểm sàn, điểm tính chính xác khi học sinh hoàn thành bài gõ
            curSentenceIdx = 0;
            curWordIdx = 0;
            currentStudent = null;
            clearQueueSearch();
            nextTurn();
        }

        /* =========================================================================
           3. ĐỒNG HỒ TỐC ĐỘ: TÍNH ĐIỂM CHÍNH XÁC THEO TỪNG MILI GIÂY (SAU PHÍM ĐẦU)
           ========================================================================= */
        function resetSpeedDisplayBeforeFirstKey() {
            if (speedAnimFrame) {
                cancelAnimationFrame(speedAnimFrame);
                speedAnimFrame = null;
            }
            speedStartTime = null;
            liveSpeedScore = MAX_WORD_SCORE;
            document.getElementById("live-speed-score").innerText = liveSpeedScore;
            document.getElementById("speed-state-note").innerText = "(Chờ gõ chữ đầu tiên...)";
            document.getElementById("speed-pill").classList.remove("counting");
        }

        function startSpeedCountdownAfterFirstKey() {
            if (speedAnimFrame) {
                cancelAnimationFrame(speedAnimFrame);
            }
            speedStartTime = performance.now();
            document.getElementById("speed-pill").classList.add("counting");

            function tickSpeed() {
                if (!isWaitingForKey || !speedStartTime) return;
                const elapsedMs = performance.now() - speedStartTime;
                liveSpeedScore = Math.max(0, Math.round(MAX_WORD_SCORE - (elapsedMs * (DECAY_PER_SEC / 1000))));
                document.getElementById("live-speed-score").innerText = liveSpeedScore;
                const elapsedSec = (elapsedMs / 1000).toFixed(2);
                document.getElementById("speed-state-note").innerText = `(${elapsedSec}s)`;

                if (liveSpeedScore > 0) {
                    speedAnimFrame = requestAnimationFrame(tickSpeed);
                }
            }
            speedAnimFrame = requestAnimationFrame(tickSpeed);
        }

        function renderSentenceWords() {
            const bar = document.getElementById("sentence-bar");
            bar.innerHTML = "";
            const words = SENTENCES[curSentenceIdx % SENTENCES.length];
            words.forEach((w, idx) => {
                const span = document.createElement("div");
                span.className = "sentence-word" + (idx < curWordIdx ? " done" : (idx === curWordIdx ? " active" : ""));
                span.innerText = w;
                bar.appendChild(span);
            });
        }

        function setupGameUI() {
            saveStateToLocal();
            renderSidebar();

            if (!currentStudent) {
                document.getElementById("student-name").innerText = "🎉 Đã xong hết lớp!";
                document.getElementById("next-student-name").innerText = "Bấm xem Bảng Vinh Danh";
                document.getElementById("key-container").innerHTML = "";
                resetSpeedDisplayBeforeFirstKey();
                showEndGameModal();
                return;
            }

            const nameEl = document.getElementById("student-name");
            if (currentStudent.isDup) {
                nameEl.innerHTML = `${escapeHTML(currentStudent.name)} <span style="font-size:32px; color:#f59e0b; font-weight:800; background:#fef3c7; border:2px solid #fde68a; padding:2px 14px; border-radius:99px; vertical-align:middle;">STT ${currentStudent.stt}</span>`;
            } else {
                nameEl.innerText = currentStudent.name;
            }

            const nextStu = remainingStudents.length > 0 ? remainingStudents[0].displayName : "Hết lượt";
            document.getElementById("next-student-name").innerText = `👟 Chuẩn bị lên tiếp theo: ${nextStu}`;

            renderSentenceWords();
            const currentWord = SENTENCES[curSentenceIdx % SENTENCES.length][curWordIdx];
            targetKeys = currentWord.split("");
            currentKeyIndex = 0;

            const keyContainer = document.getElementById("key-container");
            keyContainer.innerHTML = "";
            targetKeys.forEach((k, idx) => {
                const box = document.createElement("div");
                box.id = `key-${idx}`;
                box.className = idx === 0 ? "key-box active" : "key-box";
                box.innerText = k;
                keyContainer.appendChild(box);
            });

            isWaitingForKey = true;
            resetSpeedDisplayBeforeFirstKey();
        }

        function nextTurn() {
            if (speedAnimFrame) {
                cancelAnimationFrame(speedAnimFrame);
                speedAnimFrame = null;
            }
            if (remainingStudents.length === 0) {
                currentStudent = null;
                isWaitingForKey = false;
                setupGameUI();
                return;
            }
            currentStudent = remainingStudents.shift();
            pushedStudentIds = pushedStudentIds.filter(id => id !== currentStudent.id);
            setupGameUI();
        }

        function skipStudent() {
            if (!currentStudent) return;
            pushDownStudent(currentStudent.id);
        }

        /* =========================================================================
           4. RENDER SIDEBAR: BẢNG XẾP HẠNG TOP 3 ĐỒNG HẠNG & HÀNG ĐỢI TÌM KIẾM
           ========================================================================= */
        function onQueueSearch(val) {
            queueSearchKeyword = val;
            const clearBtn = document.getElementById("queue-search-clear");
            if (clearBtn) clearBtn.style.display = val.trim() ? "flex" : "none";
            renderQueue();
        }

        function clearQueueSearch() {
            queueSearchKeyword = "";
            const input = document.getElementById("queue-search-input");
            if (input) input.value = "";
            const clearBtn = document.getElementById("queue-search-clear");
            if (clearBtn) clearBtn.style.display = "none";
            renderQueue();
        }

        function renderSidebar() {
            renderRealtimeRank();
            renderQueue();
        }

        function renderRealtimeRank() {
            document.getElementById("played-count-label").innerText = `Đã gõ: ${playedStudentIds.length}/${currentClassList.length}`;
            const rankContainer = document.getElementById("realtime-rank-list");
            rankContainer.innerHTML = "";

            // Lọc danh sách học sinh đã hoàn thành theo ID duy nhất
            const eligible = playedStudentIds
                .map(id => currentClassList.find(s => s.id === id))
                .filter(stu => stu && studentScores[stu.id] !== undefined)
                .map(stu => ({
                    id: stu.id,
                    name: stu.displayName,
                    score: studentScores[stu.id] || 0
                }));

            if (eligible.length === 0) {
                rankContainer.innerHTML = `
                    <div style="text-align:center; padding:32px 12px; color:#94a3b8; font-size:16px;">
                        <div style="font-size:32px; margin-bottom:8px;">🏆</div>
                        <div style="font-weight:700;">Chưa có bạn nào hoàn thành lượt gõ</div>
                        <div style="font-size:13.5px; color:#cbd5e1; margin-top:4px;">Top 3 giải thưởng sẽ xuất hiện tại đây!</div>
                    </div>
                `;
                return;
            }

            // Lấy danh sách điểm riêng biệt xếp từ cao xuống thấp
            const distinctScores = [...new Set(eligible.map(e => e.score))].sort((a, b) => b - a);
            // Chỉ hiển thị tới Giải Ba (3 mức điểm cao nhất), còn lại khỏi hiện
            const top3Scores = distinctScores.slice(0, 3);

            const tierTitles = ["Giải Nhất", "Giải Nhì", "Giải Ba"];
            const tierIcons = ["🥇", "🥈", "🥉"];
            const tierCls = ["tier-1", "tier-2", "tier-3"];

            top3Scores.forEach((score, tierIdx) => {
                const studentsInTier = eligible.filter(e => e.score === score);
                const isTie = studentsInTier.length > 1;

                studentsInTier.forEach(stuObj => {
                    const div = document.createElement("div");
                    div.className = `rank-card-tier ${tierCls[tierIdx]}`;
                    div.innerHTML = `
                        <div style="display:flex; align-items:center; gap:6px; min-width:0;">
                            <span class="tier-badge">${tierIcons[tierIdx]} ${tierTitles[tierIdx]}</span>
                            ${isTie ? '<span class="tie-badge">Đồng hạng</span>' : ''}
                            <span class="rank-name" title="${escapeHTML(stuObj.name)}">${escapeHTML(stuObj.name)}</span>
                        </div>
                        <div class="score-tag">${stuObj.score}đ</div>
                    `;
                    rankContainer.appendChild(div);
                });
            });
        }

        function renderQueue() {
            const totalRemaining = remainingStudents.length + (currentStudent ? 1 : 0);
            document.getElementById("counter").innerText = totalRemaining;

            const queueContainer = document.getElementById("queue-list");
            queueContainer.innerHTML = "";

            let queueOrder = [
                ...(currentStudent ? [currentStudent] : []),
                ...remainingStudents,
                ...bannedStudentIds.map(id => currentClassList.find(s => s.id === id)).filter(Boolean)
            ];

            const qNorm = normalizeVN(queueSearchKeyword);
            const isSearching = qNorm.length > 0;
            if (isSearching) {
                queueOrder = queueOrder.filter(stu =>
                    normalizeVN(stu.name).includes(qNorm) ||
                    normalizeVN(stu.displayName).includes(qNorm) ||
                    String(stu.stt) === qNorm
                );
            }

            if (queueOrder.length === 0) {
                queueContainer.innerHTML = `
                    <div style="text-align:center; padding:22px 10px; color:#7cb342; font-size:15px; font-weight:700;">
                        ${isSearching ? `Không tìm thấy "${escapeHTML(queueSearchKeyword)}" trong hàng đợi` : 'Hàng đợi đang trống'}
                    </div>
                `;
                return;
            }

            queueOrder.forEach(stu => {
                const div = document.createElement("div");
                const isBanned = bannedStudentIds.includes(stu.id);
                const isCurrent = currentStudent && currentStudent.id === stu.id;
                const isPushed = pushedStudentIds.includes(stu.id);

                let statusCls = "";
                if (isBanned) statusCls = "banned";
                else if (isCurrent) statusCls = "current";
                else if (isPushed) statusCls = "pushed";

                div.className = `list-item ${statusCls}`;

                const leftSpan = document.createElement("span");
                leftSpan.style.overflow = "hidden";
                leftSpan.style.textOverflow = "ellipsis";
                leftSpan.style.whiteSpace = "nowrap";
                leftSpan.innerText = isCurrent ? `👉 ${stu.displayName}` : stu.displayName;

                const actions = document.createElement("div");
                actions.className = "item-actions";

                if (isBanned) {
                    const btnUnban = document.createElement("button");
                    btnUnban.className = "action-btn";
                    btnUnban.innerText = "💚";
                    btnUnban.title = "Tha lỗi cho bạn";
                    btnUnban.onclick = () => unbanStudent(stu.id);
                    actions.appendChild(btnUnban);
                } else {
                    if (!isCurrent) {
                        const btnCall = document.createElement("button");
                        btnCall.className = "action-btn";
                        btnCall.innerText = "⭐";
                        btnCall.title = "Gọi bạn này lên ngay";
                        btnCall.onclick = () => favorStudent(stu.id);
                        actions.appendChild(btnCall);
                    }
                    const btnPush = document.createElement("button");
                    btnPush.className = "action-btn";
                    btnPush.innerText = "⬇️";
                    btnPush.title = "Đẩy bạn này xuống cuối hàng";
                    btnPush.onclick = () => pushDownStudent(stu.id);
                    actions.appendChild(btnPush);

                    const btnBan = document.createElement("button");
                    btnBan.className = "action-btn";
                    btnBan.innerText = "🚫";
                    btnBan.title = "Khóa lượt tạm thời";
                    btnBan.onclick = () => banStudent(stu.id);
                    actions.appendChild(btnBan);
                }

                div.appendChild(leftSpan);
                div.appendChild(actions);
                queueContainer.appendChild(div);
            });
        }

        function favorStudent(studentId) {
            if (currentStudent && currentStudent.id === studentId) return;
            if (currentStudent) remainingStudents.unshift(currentStudent);
            const idx = remainingStudents.findIndex(s => s.id === studentId);
            if (idx > -1) {
                const [stu] = remainingStudents.splice(idx, 1);
                currentStudent = stu;
            }
            setupGameUI();
        }

        function pushDownStudent(studentId) {
            if (!pushedStudentIds.includes(studentId)) pushedStudentIds.push(studentId);
            const idx = remainingStudents.findIndex(s => s.id === studentId);
            if (idx > -1) {
                const [stu] = remainingStudents.splice(idx, 1);
                remainingStudents.push(stu);
            }
            if (currentStudent && currentStudent.id === studentId) {
                remainingStudents.push(currentStudent);
                currentStudent = null;
                nextTurn();
            } else {
                saveStateToLocal();
                renderSidebar();
            }
        }

        function banStudent(studentId) {
            if (!bannedStudentIds.includes(studentId)) bannedStudentIds.push(studentId);
            const idx = remainingStudents.findIndex(s => s.id === studentId);
            if (idx > -1) {
                remainingStudents.splice(idx, 1);
            }
            if (currentStudent && currentStudent.id === studentId) {
                currentStudent = null;
                nextTurn();
            } else {
                saveStateToLocal();
                renderSidebar();
            }
        }

        function unbanStudent(studentId) {
            bannedStudentIds = bannedStudentIds.filter(id => id !== studentId);
            const stu = currentClassList.find(s => s.id === studentId);
            if (stu && !playedStudentIds.includes(studentId) && !remainingStudents.some(s => s.id === studentId)) {
                remainingStudents.push(stu);
            }
            saveStateToLocal();
            renderSidebar();
        }

        /* =========================================================================
           5. BẢNG VINH DANH XẾP HẠNG CUỐI GIỜ (TRAO GIẢI TOP 3 ĐỒNG HẠNG)
           ========================================================================= */
        function showEndGameModal() {
            const listEl = document.getElementById("endgame-list");
            listEl.innerHTML = "";

            const eligible = playedStudentIds
                .map(id => currentClassList.find(s => s.id === id))
                .filter(stu => stu && studentScores[stu.id] !== undefined)
                .map(stu => ({
                    id: stu.id,
                    name: stu.displayName,
                    score: studentScores[stu.id] || 0
                }));

            if (eligible.length === 0) {
                listEl.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; padding:30px; font-size:20px; color:#64748b; font-weight:700;">Chưa có bạn nào hoàn thành lượt chơi!</div>`;
                document.getElementById("endgame-modal").style.display = "flex";
                return;
            }

            const distinctScores = [...new Set(eligible.map(e => e.score))].sort((a, b) => b - a);
            const top3Scores = distinctScores.slice(0, 3);
            const tierTitles = ["🥇 Giải Nhất", "🥈 Giải Nhì", "🥉 Giải Ba"];
            const topCls = ["top-1", "top-2", "top-3"];

            top3Scores.forEach((score, tierIdx) => {
                const studentsInTier = eligible.filter(e => e.score === score);
                const isTie = studentsInTier.length > 1;

                studentsInTier.forEach(item => {
                    const card = document.createElement("div");
                    card.className = `rank-card ${topCls[tierIdx]}`;
                    card.innerHTML = `
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span>${tierTitles[tierIdx]}</span>
                            ${isTie ? '<span style="font-size:12px; background:#e0f2fe; color:#0284c7; padding:2px 8px; border-radius:6px;">Đồng hạng</span>' : ''}
                            <span>: ${escapeHTML(item.name)}</span>
                        </div>
                        <span>${item.score} điểm</span>
                    `;
                    listEl.appendChild(card);
                });
            });

            document.getElementById("endgame-modal").style.display = "flex";
        }

        function closeEndGameModal() {
            document.getElementById("endgame-modal").style.display = "none";
        }

        /* =========================================================================
           6. BẮT PHÍM GÕ & ĐẾM ĐIỂM SÁT SAO THEO TỪNG MILI GIÂY
           ========================================================================= */
        window.addEventListener("keydown", function (event) {
            // Khi đang gõ trong ô tìm kiếm hoặc chọn lớp, không bắt phím gõ của bài học
            if (event.target && (event.target.tagName === "INPUT" || event.target.tagName === "SELECT" || event.target.tagName === "TEXTAREA")) {
                return;
            }

            if (event.key === "F5" || (event.ctrlKey && event.key.toLowerCase() === "r") || event.key === "Backspace") {
                event.preventDefault();
                return;
            }

            if (!isWaitingForKey || !currentStudent) return;

            const keyPressed = event.key.toUpperCase();
            if (!/^[A-Z]$/.test(keyPressed)) return;

            const currentBoxEl = document.getElementById(`key-${currentKeyIndex}`);
            const expectedKey = targetKeys[currentKeyIndex];

            if (keyPressed === expectedKey) {
                currentBoxEl.className = "key-box done";
                currentKeyIndex++;

                // BẮT ĐẦU ĐẾM ĐIỂM THEO MILI GIÂY NGAY SAU KHI GÕ ĐÚNG CHỮ CÁI ĐẦU TIÊN
                if (currentKeyIndex === 1) {
                    startSpeedCountdownAfterFirstKey();
                }

                if (currentKeyIndex === targetKeys.length) {
                    isWaitingForKey = false;
                    if (speedAnimFrame) {
                        cancelAnimationFrame(speedAnimFrame);
                        speedAnimFrame = null;
                    }

                    // Tính điểm tốc độ chính xác đến từng mili giây
                    const finalElapsedMs = speedStartTime ? (performance.now() - speedStartTime) : 0;
                    liveSpeedScore = Math.max(0, Math.round(MAX_WORD_SCORE - (finalElapsedMs * (DECAY_PER_SEC / 1000))));
                    const finalSecStr = (finalElapsedMs / 1000).toFixed(2);

                    studentScores[currentStudent.id] = liveSpeedScore;
                    if (!playedStudentIds.includes(currentStudent.id)) {
                        playedStudentIds.push(currentStudent.id);
                    }

                    const words = SENTENCES[curSentenceIdx % SENTENCES.length];
                    curWordIdx++;
                    if (curWordIdx >= words.length) {
                        curWordIdx = 0;
                        curSentenceIdx = (curSentenceIdx + 1) % SENTENCES.length;
                    }

                    const overlay = document.getElementById("overlay-msg");
                    overlay.innerHTML = `<div>Xuất sắc!</div><div style="font-size:36px; margin-top:8px;">+${liveSpeedScore} điểm (${finalSecStr}s) ✨</div>`;
                    overlay.style.display = "flex";

                    saveStateToLocal();
                    renderSidebar();

                    setTimeout(() => {
                        overlay.style.display = "none";
                        currentStudent = null;
                        nextTurn();
                    }, 950);
                } else {
                    document.getElementById(`key-${currentKeyIndex}`).className = "key-box active";
                }
            } else {
                currentBoxEl.classList.remove("error");
                void currentBoxEl.offsetWidth;
                currentBoxEl.classList.add("error");
            }
        });
    </script>
