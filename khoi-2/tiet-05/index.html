<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game: Ếch Xanh Bắt Phím - Bài 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Baloo 2', cursive, sans-serif;
            background-color: #e0f7fa;
            margin: 0; padding: 0; overflow: hidden; 
            box-sizing: border-box; height: 100vh; 
            display: flex; flex-direction: column;
        }

        /* --- SLIDE MỞ ĐẦU CHÉP BÀI --- */
        .intro-slide {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #e0f7fa; z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .intro-content {
            text-align: center; background: white; padding: 60px 80px; 
            border-radius: 25px; border: 6px solid #4dd0e1; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }
        .intro-date { font-size: 26px; color: #555; font-style: italic; margin-bottom: 25px; font-weight: 600;}
        .intro-subject { font-size: 38px; color: #00838f; font-weight: 700; margin-bottom: 10px; }
        .intro-title { font-size: 52px; color: #d84315; font-weight: 800; text-transform: uppercase; margin-bottom: 40px; text-shadow: 2px 2px 0px #ffe0b2; }
        .btn-enter {
            font-size: 26px; padding: 15px 50px; background: #ff9800; color: white; 
            border: none; border-radius: 50px; cursor: pointer; 
            font-family: 'Baloo 2', cursive; font-weight: 800; box-shadow: 0 6px 0 #f57c00; transition: 0.2s;
        }
        .btn-enter:active { transform: translateY(6px); box-shadow: none; }

        /* --- GIAO DIỆN GAME CHÍNH --- */
        #app-container {
            display: flex; flex-direction: column; height: 100%; padding: 20px; box-sizing: border-box;
        }

        .header-bar {
            background: white; border-radius: 15px; padding: 15px 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 4px solid #4dd0e1;
            margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
        }

        h1 { color: #00838f; font-size: 28px; margin: 0; text-transform: uppercase; }
        .controls { display: flex; align-items: center; gap: 10px; }
        
        select, button {
            font-size: 18px; padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-family: 'Baloo 2', cursive; font-weight: 700; border: none;
        }
        select { border: 2px solid #00acc1; color: #006064; outline: none; }
        .btn-start { background-color: #4caf50; color: white; box-shadow: 0 4px 0 #388e3c; }
        .btn-start:active { transform: translateY(4px); box-shadow: none; }

        .stats-board { display: flex; gap: 15px; }
        .stat-badge {
            background: #fff3e0; border: 2px dashed #ffb74d; padding: 5px 15px; 
            border-radius: 20px; font-size: 20px; color: #e65100; font-weight: 700;
        }

        .main-container { display: flex; gap: 20px; flex: 1; min-height: 0; }

        .game-area {
            flex: 2; background: white; border-radius: 15px; padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 4px solid #4dd0e1;
            position: relative; display: none; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        #student-name { font-size: 60px; color: #d84315; font-weight: 800; margin-bottom: 10px; text-shadow: 2px 2px 0px #ffe0b2; }
        #instruction { font-size: 28px; color: #555; margin-bottom: 30px;}
        
        .key-container { display: flex; gap: 25px; margin-bottom: 30px; justify-content: center; flex-wrap: wrap; }

        .key-box {
            font-size: 110px; color: #2e7d32; font-weight: 800; background-color: #f1f8e9; 
            border: 5px solid #aed581; border-radius: 25px; width: 140px; height: 140px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 0 #81c784; transition: all 0.2s ease;
        }

        .key-box.active { border-color: #ff9800; box-shadow: 0 10px 0 #f57c00; background-color: #fff3e0; transform: scale(1.1); color: #ef6c00; }
        .key-box.done { border-color: #4caf50; box-shadow: 0 2px 0 #388e3c; background-color: #c8e6c9; color: #1b5e20; transform: translateY(8px); }
        .key-box.error { border-color: #f44336; background-color: #ffcdd2; color: #b71c1c; animation: shake 0.3s; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        .sidebar {
            flex: 1.2; background: white; border-radius: 15px; padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 4px solid #9ccc65; display: none; flex-direction: column;
        }
        .sidebar h2 { text-align: center; color: #558b2f; margin-top: 0; margin-bottom: 15px; font-size: 26px; }

        .student-list-container { overflow-y: auto; flex: 1; padding-right: 10px; }
        .student-list-container::-webkit-scrollbar { width: 8px; }
        .student-list-container::-webkit-scrollbar-thumb { background: #c5e1a5; border-radius: 4px; }

        /* --- TÙY CHỈNH DANH SÁCH & NÚT HÀNH ĐỘNG --- */
        .list-item {
            padding: 10px 15px; margin-bottom: 8px; border-radius: 10px; background-color: #f5f5f5; 
            font-size: 20px; color: #424242; transition: all 0.3s ease; font-weight: 600;
            display: flex; justify-content: space-between; align-items: center;
        }

        .student-name-display { display: flex; align-items: center; gap: 8px; }
        .pushed-label { font-size: 14px; color: #e65100; font-weight: 700; display: none; }

        .item-actions { display: flex; gap: 5px; }
        .action-btn { 
            background: white; border: 2px solid #ddd; border-radius: 6px; padding: 4px 8px; 
            font-size: 16px; cursor: pointer; transition: 0.2s; 
        }
        .action-btn:hover { background: #eee; transform: scale(1.1); }
        
        .btn-call { border-color: #4caf50; }
        .btn-push { border-color: #ff9800; }
        .btn-ban { border-color: #e53935; }
        .btn-unban { border-color: #8bc34a; display: none; } /* Mặc định ẩn nút tha lỗi */

        /* CÁC TRẠNG THÁI CỦA LIST-ITEM */
        .list-item.played { background-color: #eeeeee; color: #bdbdbd; text-decoration: line-through; }
        .list-item.current { background-color: #ffeb3b; color: #d84315; font-weight: 800; border-left: 6px solid #f57c00; transform: scale(1.02); }
        .list-item.banned { background-color: #ffcdd2; color: #b71c1c; text-decoration: line-through; }
        .list-item.pushed { background-color: #fff3e0; border-left: 6px solid #ff9800; }
        .list-item.pushed .pushed-label { display: inline-block; }

        /* HIỂN THỊ NÚT BẤM DỰA TRÊN TRẠNG THÁI (UX Logic) */
        
        /* 1. Đang chơi: Ẩn gọi ưu tiên, giữ phạt nhẹ và cấm */
        .list-item.current .btn-call { display: none; }
        
        /* 2. Đã chơi: Ẩn gọi ưu tiên và phạt nhẹ, GIỮ CẤM để phạt nguội */
        .list-item.played .btn-call { display: none; }
        .list-item.played .btn-push { display: none; }
        
        /* 3. Bị đẩy xuống cuối: Ẩn nút phạt nhẹ (vì đã đẩy rồi) */
        .list-item.pushed .btn-push { display: none; }
        
        /* 4. Bị cấm chơi: Ẩn tất cả nút phạt, CHỈ HIỆN nút Tha Lỗi */
        .list-item.banned .btn-call { display: none; }
        .list-item.banned .btn-push { display: none; }
        .list-item.banned .btn-ban { display: none; }
        .list-item.banned .btn-unban { display: inline-block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; 
            align-items: center; justify-content: center; border-radius: 10px; z-index: 10; display: none; flex-direction: column;
        }
        .overlay-success { background: rgba(255,255,255,0.9); font-size: 60px; font-weight: 800; color: #e91e63; text-transform: uppercase; }

    </style>
</head>
<body>

    <!-- SLIDE MỞ ĐẦU -->
    <div id="intro-slide" class="intro-slide">
        <div class="intro-content">
            <div id="intro-date" class="intro-date"></div>
            <div class="intro-subject">Môn: Tin học</div>
            <div class="intro-title">BÀI 3: HÀNG PHÍM TRÊN</div>
            <button class="btn-enter" onclick="enterGame()">Bắt đầu bài học 🐸</button>
        </div>
    </div>

    <!-- GIAO DIỆN GAME CHÍNH -->
    <div id="app-container" style="display: none;">
        <div class="header-bar">
            <h1>🐸 Ếch Bắt Chữ - Hàng Phím Trên</h1>
            
            <div class="controls">
                <select id="class-select">
                    <option value="">-- Chọn Lớp --</option>
                    <option value="2_2">Lớp 2/2</option>
                    <option value="2_4">Lớp 2/4</option>
                    <option value="2_5">Lớp 2/5</option>
                </select>
                <button class="btn-start" onclick="startGame()">Bắt Đầu Chơi!</button>
            </div>

            <div class="stats-board" style="display: none;" id="stats-board">
                <span class="stat-badge">🏆 Điểm: <span id="score">0</span></span>
                <span class="stat-badge">👦👧 Còn: <span id="counter">0</span> bạn</span>
            </div>
        </div>

        <div class="main-container">
            <div id="game-area" class="game-area">
                <div id="overlay-msg" class="overlay overlay-success">Xuất sắc! ✨</div>
                <div id="student-name">...</div>
                <div id="instruction">Vươn tay gõ phím:</div>
                <div id="key-container" class="key-container"></div>
            </div>

            <div id="sidebar" class="sidebar">
                <h2>Lượt Chơi</h2>
                <div class="student-list-container" id="student-list"></div>
            </div>
        </div>
    </div>

    <script>
        // --- XỬ LÝ NGÀY THÁNG LÚC MỞ LÊN ---
        window.onload = function() {
            const today = new Date();
            const days = ["Chủ nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
            const dateStr = `${days[today.getDay()]}, ngày ${today.getDate()} tháng ${today.getMonth() + 1} năm ${today.getFullYear()}`;
            document.getElementById("intro-date").innerText = dateStr;
        };

        function enterGame() {
            document.getElementById("intro-slide").style.display = "none";
            document.getElementById("app-container").style.display = "flex";
        }

        // --- BIẾN GAME VÀ PHÍM ---
        const topRowKeys = ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'];
        const homeRowKeys = ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'];
        const allKeys = [...topRowKeys, ...homeRowKeys];

        let classLists = {};
        let currentClassList = [];
        let remainingStudents = []; // Hàng đợi chờ tới lượt
        let playedStudents = [];    // Mảng lưu vết ai đã chơi xong
        let bannedStudents = [];    // Mảng lưu vết ai bị cấm
        let pushedStudents = [];    
        
        let targetKeys = []; 
        let currentKeyIndex = 0; 
        let score = 0;
        let isWaitingForKey = false;
        let currentStudentName = "";

        // Tải danh sách
        fetch('../../assets/data/students_2_2026_2027.json')
            .then(response => response.json())
            .then(data => { classLists = data; })
            .catch(error => { console.error("Lỗi tải JSON:", error); });

        // Trộn mảng ngẫu nhiên (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startGame() {
            const selectedClass = document.getElementById("class-select").value;
            if (!selectedClass) { alert("Cô/Thầy ơi, chọn lớp đã nhé!"); return; }
            if (Object.keys(classLists).length === 0) { alert("Chưa tải được danh sách lớp!"); return; }

            currentClassList = [...classLists[selectedClass]];
            remainingStudents = shuffleArray([...currentClassList]); 
            playedStudents = [];
            bannedStudents = [];
            pushedStudents = [];
            score = 0;
            currentStudentName = "";
            
            document.getElementById("stats-board").style.display = "flex";
            document.getElementById("game-area").style.display = "flex";
            document.getElementById("sidebar").style.display = "flex";
            document.getElementById("score").innerText = score;
            
            renderStudentList();
            nextTurn();
        }

        // --- RENDER DANH SÁCH BÊN PHẢI ---
        function renderStudentList() {
            const listContainer = document.getElementById("student-list");
            listContainer.innerHTML = "";
            currentClassList.forEach(student => {
                const div = document.createElement("div");
                div.className = "list-item";
                div.id = "list-" + student.replace(/\s+/g, '-');

                const nameDiv = document.createElement("div");
                nameDiv.className = "student-name-display";
                
                const nameSpan = document.createElement("span");
                nameSpan.innerText = student;
                
                const pushedLabel = document.createElement("span");
                pushedLabel.className = "pushed-label";
                pushedLabel.innerText = "(👇 Cuối hàng)";

                nameDiv.appendChild(nameSpan);
                nameDiv.appendChild(pushedLabel);
                div.appendChild(nameDiv);

                // Khu vực các nút hành động
                const actionsDiv = document.createElement("div");
                actionsDiv.className = "item-actions";

                const btnCall = document.createElement("button");
                btnCall.className = "action-btn btn-call";
                btnCall.title = "Gọi ưu tiên";
                btnCall.innerText = "⭐";
                btnCall.onclick = (e) => { e.stopPropagation(); favorStudent(student); };

                const btnPush = document.createElement("button");
                btnPush.className = "action-btn btn-push";
                btnPush.title = "Phạt nhẹ: Đẩy xuống cuối";
                btnPush.innerText = "⬇️";
                btnPush.onclick = (e) => { e.stopPropagation(); pushDownStudent(student); };

                const btnBan = document.createElement("button");
                btnBan.className = "action-btn btn-ban";
                btnBan.title = "Phạt nặng: Cấm lượt";
                btnBan.innerText = "🚫";
                btnBan.onclick = (e) => { e.stopPropagation(); banStudent(student); };

                const btnUnban = document.createElement("button");
                btnUnban.className = "action-btn btn-unban";
                btnUnban.title = "Gỡ phạt (Tha lỗi)";
                btnUnban.innerText = "💚";
                btnUnban.onclick = (e) => { e.stopPropagation(); unbanStudent(student); };

                actionsDiv.appendChild(btnCall);
                actionsDiv.appendChild(btnPush);
                actionsDiv.appendChild(btnBan);
                actionsDiv.appendChild(btnUnban);
                div.appendChild(actionsDiv);

                listContainer.appendChild(div);
            });
            updateSidebarUI();
        }

        // --- CẬP NHẬT TRẠNG THÁI HIỂN THỊ DỰA VÀO CÁC MẢNG ---
        function updateSidebarUI() {
            currentClassList.forEach(student => {
                const el = document.getElementById("list-" + student.replace(/\s+/g, '-'));
                if (!el) return;
                
                // Mức độ ưu tiên hiển thị class: Bị cấm -> Đang chơi -> Đã chơi xong -> Bị đẩy -> Bình thường
                if (bannedStudents.includes(student)) {
                    el.className = "list-item banned";
                } else if (student === currentStudentName) {
                    el.className = "list-item current";
                } else if (playedStudents.includes(student)) {
                    el.className = "list-item played";
                } else if (pushedStudents.includes(student)) {
                    el.className = "list-item pushed";
                } else {
                    el.className = "list-item";
                }
            });
            // Tính số bạn còn lại bao gồm cả bạn đang đứng trên bục
            document.getElementById("counter").innerText = remainingStudents.length + (currentStudentName ? 1 : 0);
        }

        function setupGameUI() {
            updateSidebarUI();
            
            const currentEl = document.getElementById("list-" + currentStudentName.replace(/\s+/g, '-'));
            if(currentEl) currentEl.scrollIntoView({ behavior: "smooth", block: "center" });

            // Rút gọn thời gian: Chỉ random 2 hoặc 3 phím
            const numKeys = Math.floor(Math.random() * 2) + 2; 
            targetKeys = [];
            for (let i = 0; i < numKeys; i++) {
                targetKeys.push(allKeys[Math.floor(Math.random() * allKeys.length)]);
            }
            currentKeyIndex = 0; 

            document.getElementById("student-name").innerText = currentStudentName;
            document.getElementById("instruction").innerText = `Vươn tay gõ ${numKeys} phím sau:`;
            
            const keyContainer = document.getElementById("key-container");
            keyContainer.innerHTML = ''; 
            
            targetKeys.forEach((key, index) => {
                const keyDiv = document.createElement("div");
                keyDiv.id = `key-${index}`;
                keyDiv.className = index === 0 ? "key-box active" : "key-box";
                keyDiv.innerText = key;
                keyContainer.appendChild(keyDiv);
            });

            isWaitingForKey = true; 
        }

        function nextTurn() {
            if (remainingStudents.length === 0) {
                alert(`Hoan hô! Lớp đã hoàn thành (Trừ các bạn bị cấm chơi). Tổng điểm: ${score}`);
                return;
            }

            currentStudentName = remainingStudents.shift(); 
            
            if (pushedStudents.includes(currentStudentName)) {
                pushedStudents = pushedStudents.filter(name => name !== currentStudentName);
            }

            setupGameUI();
        }

        // --- NÚT ⭐: HÀNH ĐỘNG GỌI ƯU TIÊN ---
        function favorStudent(studentName) {
            if (studentName === currentStudentName) return;

            if (isWaitingForKey && currentStudentName) {
                remainingStudents.unshift(currentStudentName); 
            }
            
            const idx = remainingStudents.indexOf(studentName);
            if (idx > -1) remainingStudents.splice(idx, 1);

            currentStudentName = studentName;
            setupGameUI();
        }

        // --- NÚT ⬇️: HÀNH ĐỘNG PHẠT NHẸ (ĐẨY XUỐNG CUỐI) ---
        function pushDownStudent(studentName) {
            if (!pushedStudents.includes(studentName)) {
                pushedStudents.push(studentName);
            }

            const idx = remainingStudents.indexOf(studentName);
            if (idx > -1) {
                remainingStudents.splice(idx, 1);
                remainingStudents.push(studentName); 
            }

            if (currentStudentName === studentName) {
                isWaitingForKey = false;
                remainingStudents.push(studentName);
                
                document.body.style.backgroundColor = "#fff9c4"; 
                setTimeout(() => { document.body.style.backgroundColor = "#e0f7fa"; }, 500);
                
                alert(`Cảnh cáo! Bạn ${studentName} bị đẩy xuống chờ chơi sau cùng!`);
                currentStudentName = "";
                nextTurn(); 
            } else {
                updateSidebarUI(); 
            }
        }

        // --- NÚT 🚫: HÀNH ĐỘNG CẤM LƯỢT ---
        function banStudent(studentName) {
            if (!bannedStudents.includes(studentName)) {
                bannedStudents.push(studentName);
            }
            
            const idx = remainingStudents.indexOf(studentName);
            if (idx > -1) remainingStudents.splice(idx, 1);

            if (currentStudentName === studentName) {
                isWaitingForKey = false;
                document.body.style.backgroundColor = "#ffcdd2"; 
                setTimeout(() => { document.body.style.backgroundColor = "#e0f7fa"; }, 500);
                
                alert(`Lớp ồn ào! Bạn ${studentName} đã bị tước lượt chơi!`);
                currentStudentName = "";
                nextTurn();
            } else {
                updateSidebarUI(); 
            }
        }

        // --- NÚT 💚: HÀNH ĐỘNG GỠ PHẠT ---
        function unbanStudent(studentName) {
            // Xóa tên khỏi mảng cấm
            bannedStudents = bannedStudents.filter(name => name !== studentName);

            // Nếu học sinh chưa từng chơi xong vòng của mình, thì trả về cuối hàng đợi
            if (!playedStudents.includes(studentName)) {
                if (!remainingStudents.includes(studentName)) {
                    remainingStudents.push(studentName);
                }
            }
            
            updateSidebarUI();
        }

        // LẮNG NGHE BÀN PHÍM
        window.addEventListener("keydown", function(event) {
            if (!isWaitingForKey) return;

            const keyPressed = event.key.toUpperCase();
            if (!allKeys.includes(keyPressed)) return; 

            const currentBoxEl = document.getElementById(`key-${currentKeyIndex}`);
            const expectedKey = targetKeys[currentKeyIndex];

            if (keyPressed === expectedKey) {
                currentBoxEl.className = "key-box done"; 
                currentKeyIndex++; 

                if (currentKeyIndex === targetKeys.length) {
                    isWaitingForKey = false;
                    
                    const overlay = document.getElementById("overlay-msg");
                    overlay.style.display = "flex";
                    score += (targetKeys.length * 10); 
                    document.getElementById("score").innerText = score;

                    setTimeout(() => {
                        overlay.style.display = "none";
                        // Lưu dấu học sinh này đã hoàn thành lượt xuất sắc
                        if (currentStudentName) {
                            playedStudents.push(currentStudentName);
                        }
                        currentStudentName = "";
                        nextTurn(); 
                    }, 1500);

                } else {
                    document.getElementById(`key-${currentKeyIndex}`).className = "key-box active";
                }
            } else {
                currentBoxEl.classList.remove("error"); 
                void currentBoxEl.offsetWidth; 
                currentBoxEl.classList.add("error");
            }
        });
    </script>
</body>
</html>
