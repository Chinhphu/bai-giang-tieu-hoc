<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điệp vụ tìm kiếm và nhận diện trang web - Tin học 5</title>
    <!-- CSS CHUẨN DÙNG CHUNG KHỐI 5 -->
    <link rel="stylesheet" href="../shared/style.css">
    <!-- THƯ VIỆN ĐỌC FILE EXCEL & PHÁO HOA -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="../shared/components.js"></script>
    <style>
        .hidden {
            display: none !important;
        }
        /* Tinh chỉnh bổ sung cho Ải 1 và Ải 2 Tiết 06 */
        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 4px solid var(--ink);
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap
        }

        .tab {
            background: #eef2f7;
            color: var(--ink);
            padding: 9px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px
        }

        .tab.on {
            background: var(--yellow);
            box-shadow: 0 4px 0 #dca631
        }

        .tb-gap {
            flex: 1
        }

        .tb-label {
            font-weight: 800;
            opacity: .6
        }

        .rounds {
            display: flex;
            gap: 6px
        }

        .rd {
            background: #eef2f7;
            color: var(--ink);
            font-weight: 900;
            width: 40px;
            padding: 9px 0;
            border-radius: 10px;
            font-size: 15px
        }

        .rd.on {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 3px 0 #1f50b5
        }

        .rd.done:not(.on) {
            background: var(--mint);
            color: #fff
        }

        .stage {
            flex: 1;
            padding: 8px 12px
        }

        .panel {
            background: #fff;
            border: 6px solid var(--ink);
            border-radius: 28px;
            padding: 12px 16px;
            box-shadow: var(--shadow)
        }

        .phead {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px
        }

        .phead h2 {
            margin: 0 auto 0 0;
            color: var(--blue);
            font-size: 26px
        }

        .chip {
            background: var(--ink);
            color: var(--yellow);
            font-weight: 900;
            padding: 6px 16px;
            border-radius: 30px
        }

        .btn-grade,
        .btn-next {
            color: #fff;
            padding: 10px 22px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 12px
        }

        .btn-grade {
            background: var(--coral);
            box-shadow: 0 4px 0 #cc4640
        }

        .btn-next {
            background: var(--mint);
            box-shadow: 0 4px 0 #087d69
        }

        /* Ải 1 */
        .a1-layout {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .pool {
            background: #eaf5f2;
            border: 4px dashed var(--mint);
            border-radius: 20px;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            align-items: stretch;
            gap: 7px;
            margin-bottom: 0;
            transition: .15s
        }

        .pool.drag-over,
        .tray.drag-over {
            background: rgba(255, 200, 87, .25)
        }

        .word {
            position: relative;
            background: var(--yellow);
            color: var(--ink);
            font-size: 20px !important;
            font-weight: 900 !important;
            line-height: 1.3;
            padding: 10px 14px !important;
            border-radius: 14px;
            border: 3px solid var(--ink);
            box-shadow: 0 4px 0 var(--ink);
            cursor: grab;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word.drag {
            opacity: .35
        }

        .word.selected {
            outline: 5px solid var(--blue);
            outline-offset: 2px
        }

        .word em {
            position: absolute;
            top: -12px;
            right: -8px;
            background: var(--mint);
            color: #fff;
            font-style: normal;
            font-size: 14px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 2px solid var(--ink)
        }

        .graded .word {
            position: relative;
            background: var(--yellow);
            color: var(--ink);
            font-size: 20px !important;
            font-weight: 900 !important;
            line-height: 1.3;
            padding: 10px 14px !important;
            border-radius: 14px;
            border: 3px solid var(--ink);
            box-shadow: 0 4px 0 var(--ink);
            cursor: grab;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .graded .word.answer {
            background: #4ade80;
            box-shadow: 0 0 0 4px rgba(74, 222, 128, .4), 0 4px 0 var(--ink)
        }

        .graded .word.dim {
            opacity: .4
        }

        .graded .clone.good {
            background: #4ade80
        }

        .graded .clone.mid {
            background: #fde68a
        }

        .graded .clone.bad {
            background: #fca5a5
        }

        @keyframes reveal {
            0% {
                transform: scale(.6);
                opacity: 0
            }

            70% {
                transform: scale(1.12)
            }

            100% {
                transform: scale(1)
            }
        }

        .trays {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(185px, 1fr))
        }

        .tray {
            border: 4px solid;
            border-radius: 16px;
            background: #fff;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 130px;
            transition: .15s
        }

        .tray-head {
            color: #fff;
            font-weight: 900;
            padding: 9px 12px;
            display: flex;
            justify-content: space-between;
            border-radius: 9px 9px 0 0
        }

        .gain {
            background: var(--ink);
            color: var(--yellow);
            padding: 0 10px;
            border-radius: 20px
        }

        .tray-body {
            flex: 1;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .team-task {
            min-height: 3em;
            font-size: 22px !important;
            font-weight: 800 !important;
            line-height: 1.4 !important;
            color: var(--ink) !important;
            overflow-wrap: anywhere;
        }

        .word.clone {
            background: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px !important;
            font-weight: 800 !important;
            padding: 8px 12px !important;
            z-index: 1;
        }

        .word.clone b {
            color: var(--blue)
        }

        /* Ải 2: trang web giả */
        .site {
            --ac: #2563eb;
            --bn: linear-gradient(45deg, #ff00cc, #3333ff);
            border: 4px solid var(--ink);
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            max-width: 1000px;
            margin: 0 auto
        }

        .th0 {
            --ac: #d97706;
            --bn: linear-gradient(45deg, #ff00cc, #3333ff)
        }

        .th1 {
            --ac: #0ea5e9;
            --bn: linear-gradient(45deg, #b91c1c, #111)
        }

        .th2 {
            --ac: #db2777;
            --bn: linear-gradient(45deg, #f97316, #facc15)
        }

        .th3 {
            --ac: #1d4ed8;
            --bn: linear-gradient(45deg, #1d4ed8, #7f1d1d)
        }

        .th4 {
            --ac: #16a34a;
            --bn: linear-gradient(45deg, #16a34a, #0f172a)
        }

        .fake-bar {
            background: #e9eef5;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--line)
        }

        .fake-dots {
            display: flex;
            gap: 6px
        }

        .fake-dots i {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #c3ccd9
        }

        .nv {
            color: #64748b;
            font-weight: 900;
            letter-spacing: 4px
        }

        .urlwrap {
            flex: 1;
            display: flex
        }

        .s-head {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 12px 20px;
            border-bottom: 2px solid var(--line)
        }

        .logo {
            font-weight: 900;
            font-size: 20px;
            color: var(--ac);
            margin-right: auto
        }

        .s-head nav {
            display: flex;
            gap: 16px;
            font-weight: 700;
            color: #475569;
            font-size: 15px
        }

        .s-search {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 7px 16px;
            color: #64748b;
            font-weight: 600;
            font-size: 14px
        }

        .s-hero {
            padding: 16px 20px;
            text-align: center;
            background: #f8fafc
        }

        .signal-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin: 6px 0
        }

        .s-main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            padding: 16px 20px
        }

        .s-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px
        }

        .s-card {
            background: #f4f7fb;
            border: 2px solid var(--line);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center
        }

        .s-card div {
            font-size: 30px
        }

        .s-card b {
            display: block;
            font-size: 15px
        }

        .s-card span {
            font-size: 12px;
            color: #64748b;
            font-weight: 600
        }

        .s-form {
            border: 2px solid var(--line);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px
        }

        .widget {
            background: #f4f7fb;
            border: 2px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 14px;
            color: #475569;
            text-align: left
        }

        .s-foot {
            background: #f1f5f9;
            padding: 12px 20px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            font-weight: 600
        }

        .trap {
            cursor: crosshair;
            transition: .2s;
            position: relative;
            border: 3px dashed transparent
        }

        .trap:hover {
            border-color: var(--coral);
            background-color: rgba(255, 108, 101, .15);
            border-radius: 8px
        }

        .trap.broken {
            pointer-events: none;
            opacity: .6;
            filter: grayscale(.8);
            border-color: var(--coral)
        }

        .trap.broken::after {
            content: '❌ ' attr(data-by);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-8deg);
            background: var(--coral);
            color: #fff;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 16px;
            border: 2px solid var(--ink);
            white-space: nowrap;
            z-index: 10
        }

        .trap.missed {
            pointer-events: none;
            opacity: .6;
            filter: grayscale(.8);
            border-color: #64748b
        }

        .trap.missed::after {
            content: '❌ Sai — mất lượt';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-8deg);
            background: #475569;
            color: #fff;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 16px;
            border: 2px solid var(--ink);
            white-space: nowrap;
            z-index: 10
        }

        .trap-url {
            flex: 1;
            background: #fff;
            padding: 7px 10px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            min-width: 0;
            overflow-wrap: anywhere
        }

        .trap-link {
            display: inline-block;
            color: #2563eb;
            font-weight: 800;
            text-decoration: underline;
            padding: 8px 10px;
            overflow-wrap: anywhere
        }

        .trap-banner {
            background: var(--bn);
            color: #fff;
            padding: 12px;
            font-size: 17px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 12px;
            min-width: 0
        }

        .trap-timer {
            display: inline-block;
            background: #ef4444;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 900;
            animation: blink 1s infinite;
            margin-top: 10px
        }

        .trap-btn {
            background: linear-gradient(#22c55e, #15803d);
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 6px 0 #166534;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0
        }

        .trap-input {
            border: 2px solid #ccc;
            padding: 9px;
            font-size: 14px;
            border-radius: 8px;
            width: 100%;
            margin: 0;
            background: #f9f9f9;
            display: block;
            font-weight: bold
        }

        .trap-text {
            font-size: 14px;
            color: #555;
            font-weight: bold;
            margin: 0;
            overflow-wrap: anywhere
        }

        .safe.trap-banner {
            background: linear-gradient(135deg, #0ea5a4, #2563eb)
        }

        .safe.trap-timer {
            background: #e2e8f0;
            color: var(--ink);
            animation: none
        }

        .safe.trap-btn {
            background: var(--blue);
            box-shadow: 0 6px 0 #1f50b5
        }

        @keyframes blink {
            50% {
                opacity: .6
            }
        }

        .floatred {
            position: absolute;
            left: 50%;
            top: 20%;
            color: #ef4444;
            font-size: 30px;
            font-weight: 900;
            pointer-events: none;
            text-shadow: 0 2px 0 #fff, 0 0 8px #fff;
            animation: fup 1.3s ease-out forwards;
            white-space: nowrap;
            z-index: 5
        }

        @keyframes fup {
            0% {
                opacity: 0;
                transform: translate(-50%, 20px) scale(.6)
            }

            20% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1.2)
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -90px) scale(1)
            }
        }

        .shake {
            animation: shake .5s
        }

        @keyframes shake {

            20%,
            60% {
                transform: translateX(-6px)
            }

            40%,
            80% {
                transform: translateX(6px)
            }
        }

        /* Modal & toast */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000
        }

        .modal-box {
            background: #fff;
            padding: 26px;
            border-radius: 20px;
            border: 6px solid var(--ink);
            text-align: center;
            width: 90%;
            max-width: 480px;
            animation: popIn .3s
        }

        .modal-box h3 {
            font-size: 24px;
            color: var(--blue);
            margin: 0 0 6px
        }

        .modal-box textarea {
            width: 100%;
            height: 130px;
            border: 3px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            resize: vertical
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0
        }

        .modal-btn {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .2)
        }

        .modal-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            box-shadow: none
        }

        .btn-cancel {
            background: var(--line);
            color: var(--ink);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700
        }

        .btn-ok {
            background: var(--mint);
            color: #fff;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            margin-right: 8px
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -20px);
            background: var(--mint);
            color: #fff;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 3000;
            border: 3px solid var(--ink)
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        @keyframes popIn {
            0% {
                transform: scale(.9);
                opacity: 0
            }

            100% {
                transform: scale(1);
                opacity: 1
            }
        }

        /* Kanban */

        /* Tinh chỉnh Stage & Tabs cho Tiết 06 */
        #stage {
            padding: 0 !important;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            height: 100vh;
        }

        .topbar {
            background: #fff;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 4px solid var(--ink);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        }

        .tab {
            background: #eef2f7;
            color: var(--ink);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 17px;
            border: 2px solid var(--line);
            cursor: pointer;
            transition: .15s ease;
        }

        .tab:hover {
            background: #e2e8f0;
        }

        .tab.on {
            background: var(--yellow);
            border-color: var(--ink);
            color: var(--ink);
            box-shadow: 0 4px 0 var(--ink);
        }

        .tab.gold {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #b45309;
        }

        .tab.gold.on {
            background: #f59e0b;
            border-color: var(--ink);
            color: #fff;
            box-shadow: 0 4px 0 var(--ink);
        }

        .panel {
            padding: 24px;
            flex: 1;
        }

        /* Nút popup chọn đội ở Ải 2 */
        .modal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 18px 0;
        }

        .modal-btn {
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            padding: 14px 10px;
            border-radius: 14px;
            border: 3px solid var(--ink);
            box-shadow: 0 4px 0 var(--ink);
            cursor: pointer;
            transition: .1s;
        }

        .modal-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .modal-btn small {
            font-size: 13px;
            font-weight: 700;
            display: block;
            margin-top: 3px;
        }

        /* Tooltip dấu hiệu */
        .trap.broken::after {
            content: "✓ " attr(data-by);
            position: absolute;
            top: -12px;
            right: -10px;
            background: var(--mint);
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 8px;
            border: 2px solid var(--ink);
            box-shadow: 0 2px 0 var(--ink);
            z-index: 10;
        }

        .trap.missed::after {
            content: "✗ " attr(data-by);
            position: absolute;
            top: -12px;
            right: -10px;
            background: var(--coral);
            color: #fff;
            font-size: 12px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 8px;
            border: 2px solid var(--ink);
            box-shadow: 0 2px 0 var(--ink);
            z-index: 10;
        }
    </style>
</head>

<body>
    <!-- ================= MÀN HÌNH SETUP ĐẦU GIỜ ================= -->
    <khoi5-setup
        heading="🕵️ ĐIỆP VỤ TÌM KIẾM"
        description="BÀI 3: TÌM KIẾM THÔNG TIN &amp; NHẬN DIỆN TRANG WEB"
        team-label="Số lượng đội thi (Tối đa 6):"
        team-unit="Đội"
        starting-score-label="Điểm sàn mỗi đội:"
        default-class="5_2"
        default-teams="4">
    </khoi5-setup>

    <!-- ================= GIAO DIỆN CHÍNH ================= -->
    <div id="app">
        <!-- SIDEBAR CHUẨN TIẾT 07 -->
        <khoi5-sidebar title="🕵️ ĐIỆP VỤ TÌM KIẾM" navigation="false" gold-board></khoi5-sidebar>

        <!-- SÂN KHẤU CHÍNH -->
        <main class="stage" id="stage">
            <div class="topbar">
                <button class="tab on" id="tab1" onclick="switchAi(1)">🔎 Ải 1 · Tìm kiếm thông tin</button>
                <button class="tab" id="tab2" onclick="switchAi(2)">🕵️ Ải 2 · Nhận diện trang web</button>
                <button class="tab gold" id="tab3" onclick="switchAi(3)">🏆 Bảng Vàng Vinh Danh</button>
                <span class="tb-gap" style="flex: 1;"></span>
                <div class="rounds" id="rounds"></div>
            </div>

            <!-- PANEL ẢI 1 -->
            <section class="panel" id="ai1">
                <div class="phead">

        let A1_DATA = DEFAULT_QUESTS.a1, A2_DATA = DEFAULT_QUESTS.a2;

        /* ---------- Dòng thời gian ghi nhận sự kiện ---------- */

        /* Tải danh sách học sinh mặc định theo lớp từ file JSON */
        async function loadStudents(c) {
            try {
                const r = await fetch('../../assets/data/students_5_2026_2027.json');
                if (!r.ok) throw 0;
                const data = await r.json();
                const norm = s => String(s).replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const arr = Array.isArray(data) ? data : (data[c] || data[norm(c)] || data.students || Object.values(data).flat());
                return arr.filter(s => { const cl = typeof s === 'object' ? (s.class || s.lop || s.className || '') : ''; return !cl || norm(cl).endsWith(norm(c)) })
                    .map(s => typeof s === 'string' ? s : (s.name || s.hoTen || s.fullName || s.ten || '')).filter(Boolean);
            } catch { return [] }
        }

        /* Xử lý nạp file Excel (.xlsx) */

                    trays: teams.map(() => []),

            a2State = A2_DATA.map(round => {
                const chosen = shuffle(round.signals.map((_, i) => i)).slice(0, n * 2);

        /* Lấy tên học sinh đang chọn */

        function playPenaltySound() {
            const AudioContextType = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextType) return;
            const audio = new AudioContextType(), now = audio.currentTime;
            const oscillator = audio.createOscillator(), volume = audio.createGain();
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(260, now);
            oscillator.frequency.exponentialRampToValueAtTime(70, now + .65);
            volume.gain.setValueAtTime(.0001, now);
            volume.gain.exponentialRampToValueAtTime(.28, now + .04);
            volume.gain.setValueAtTime(.28, now + .32);
            volume.gain.exponentialRampToValueAtTime(.0001, now + .72);
            oscillator.connect(volume);
            volume.connect(audio.destination);
            oscillator.start(now);
            oscillator.stop(now + .74);
            oscillator.onended = () => audio.close();

        /* ==================== ẢI 1 ==================== */

                st.words.push(w);

        function gradeR1() {
            const r = rd[1], st = a1State[r];
            if (st.graded) return;

            // Kiểm tra xem các đội đã chọn học sinh đại diện chưa
            if (needStudent(teams.map((_, i) => i))) return;

            teams.forEach((t, i) => {
                const tray = st.trays[i];
                const tCase = st.cases[i];
                let ok = 0, wrong = 0;
                tray.forEach(w => {
                    if (tCase.ans.includes(w)) ok++;
                    else wrong++;
                });

                const pts = Math.max(0, ok * PTS - wrong * 50);
                st.gain[i] = pts;
                if (pts > 0) addScore(i, pts);

                recordAnswer(i, `Ải 1 - Vòng ${r + 1}: ${tCase.ctx} (Đúng ${ok} - Sai ${wrong}) [${tray.join(' · ')}] → +${pts}đ`);
            });

            st.graded = true;
            renderAi1();
            toast('Đã chấm điểm xong Vòng ' + (r + 1) + '!', 2000, 'var(--mint)');
        }

        /* ==================== ẢI 2 ==================== */
        function renderAi2() {
            const r = rd[2], R = A2_DATA[r].signals, T = A2_DATA[r].theme, st = a2State[r];
            const left = [...st.correct].filter(k => st.broken[k] === undefined).length;
            $('a2-left').textContent = left ? `Còn ${left}/${st.correct.size} dấu hiệu giả mạo / lừa đảo` : 'Đã nhận diện hết! 🎉';
            $('a2-next').classList.toggle('hidden', !(left === 0 && r < 4));

            const item = k => {
                const it = R[k], c = it.type === 'url' ? 'trap-url' : 'trap-' + it.type;
                if (!st.chosen.includes(k)) return `<div class="${c} safe">${esc(it.real)}</div>`;
                const result = st.broken[k];
                if (result) {
                    return `<div class="${c} safe trap ${result.correct ? 'broken' : 'missed'}" data-by="${teams[result.team].name}">${esc(result.correct ? it.fake : it.real)}</div>`;
                }
                return `<div class="${c} trap" onclick="triggerTrap(${r},${k})">${esc(st.correct.has(k) ? it.fake : it.real)}</div>`;
            };

            const group = type => R.map((signal, k) => signal.type === type ? item(k) : '').filter(Boolean).join('');
            const urlKeys = R.map((signal, k) => signal.type === 'url' ? k : -1).filter(k => k >= 0);
            const urlBar = item(urlKeys[0]);
            const linkKey = urlKeys[1], linkSignal = R[linkKey], linkResult = st.broken[linkKey];
            const urlLink = !st.chosen.includes(linkKey)
                ? `<div class="trap-link safe">${esc(linkSignal.real)}</div>`
                : linkResult
                    ? `<div class="trap-link safe trap ${linkResult.correct ? 'broken' : 'missed'}" data-by="${teams[linkResult.team].name}">${esc(linkResult.correct ? linkSignal.fake : linkSignal.real)}</div>`
                    : `<div class="trap-link trap" onclick="triggerTrap(${r},${linkKey})">${esc(st.correct.has(linkKey) ? linkSignal.fake : linkSignal.real)}</div>`;

            $('a2-site').className = 'site th' + r;
            $('a2-site').innerHTML = `
                <div class="fake-bar"><div class="fake-dots"><i></i><i></i><i></i></div><span class="nv">‹ › ⟳</span><div class="urlwrap">${urlBar}</div><span class="nv">⋮</span></div>
                <div class="s-head"><div class="logo">${T.brand}</div><nav>${T.nav.map(n => `<span>${n}</span>`).join('')}</nav><div class="s-search">🔍 Tìm kiếm...</div></div>
                <div class="s-hero"><div class="signal-row">${group('banner')}</div><div class="signal-row">${group('timer')}</div><div class="signal-row">${urlLink}</div></div>
                <div class="s-main">
                    <div>
                        <div class="s-cards">${T.cards.map(c => `<div class="s-card"><div>${c[0]}</div><b>${c[1]}</b><span>${c[2]}</span></div>`).join('')}</div>
                        <div class="s-form">${group('text')}${group('input')}${group('btn')}</div>
                    </div>
                    <aside>${T.side.map(s => `<div class="widget">${s}</div>`).join('')}</aside>
                </div>
                <div class="s-foot">© 2026 ${T.brand.replace(/^\S+\s/, '')} · Điều khoản bảo mật · Chính sách an toàn · Liên hệ</div>
            `;
            renderRounds();
        }

        function triggerTrap(r, k) {
            openModal('Đội nào phát hiện dấu hiệu này?', i => {
                if (needStudent([i])) return;
                const correct = a2State[r].correct.has(k);
                a2State[r].broken[k] = { team: i, correct };
                const shownText = correct ? A2_DATA[r].signals[k].fake : A2_DATA[r].signals[k].real;
                if (correct) {
                    addScore(i, PTS);
                    recordAnswer(i, `Ải 2 - Vòng ${r + 1}: nhận diện đúng dấu hiệu giả mạo “${shownText}” → +${PTS}đ`);
                } else {
                    recordAnswer(i, `Ải 2 - Vòng ${r + 1}: chọn nhầm dấu hiệu an toàn “${shownText}” → mất lượt`);
                    toast(`${teams[i].name} chọn nhầm dấu hiệu an toàn — mất lượt!`, 2000, 'var(--coral)');
                }
                renderAi2();
            }, 3);
        }

        /* ==================== BẢNG VÀNG VINH DANH ==================== */
        function renderRankings() {
            const sortedTeams = [...teams].map((t, idx) => ({ ...t, originalIndex: idx }))
                .sort((a, b) => b.score - a.score);

            const titles = ['QUÁN QUÂN', 'Á QUÂN', 'HẠNG BA', 'KHUYẾN KHÍCH', 'CỐ GẮNG', 'GẮN KẾT'];

            let html = '';
            let currentRank = 0;

            sortedTeams.forEach((team, index) => {
                if (index > 0 && team.score < sortedTeams[index - 1].score) {
                    currentRank = index;
                }

                const rankClass = `rank-${Math.min(currentRank + 1, 6)}`;
                const isShared = (index > 0 && team.score === sortedTeams[index - 1].score) ||
                    (index < sortedTeams.length - 1 && team.score === sortedTeams[index + 1].score);

                let badgeTitle = titles[currentRank] || 'KHUYẾN KHÍCH';
                if (isShared && currentRank < 3) {
                    badgeTitle = `ĐỒNG ${badgeTitle}`;
                }

                html += `
                    <div class="rank-card ${rankClass}">
                        <div class="rank-left">
                            <span class="rank-num">${currentRank + 1}</span>
                            <span class="rank-badge-pill">${badgeTitle}</span>
                        </div>
                        <div class="rank-mid">
                            <div class="rank-team-name" style="color:${team.color}">${team.name}</div>
                            <div class="rank-team-sub">ĐIỆP VỤ TÌM KIẾM THÔNG TIN & NHẬN DIỆN WEBSITE</div>
                        </div>
                        <div class="rank-right">
                            <span class="rank-score-val">${team.score}</span>
                            <span class="rank-score-unit">ĐIỂM TỔNG</span>
                        </div>
                    </div>
                `;
            });

            $('rankings-box').innerHTML = html;
            fireCelebration();
        }

        function fireCelebration() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                setTimeout(() => confetti({ particleCount: 60, angle: 60, spread: 55, origin: { x: 0 } }), 250);
                setTimeout(() => confetti({ particleCount: 60, angle: 120, spread: 55, origin: { x: 1 } }), 400);
            }
        }

        /* ==================== KANBAN TỔNG KẾT ==================== */
        let dragKan = null;
        function openEnd() {
            $('app').style.display = 'none';
            $('end-screen').style.display = 'flex';
            renderKanban();
        }
        function closeEnd() {
            $('end-screen').style.display = 'none';
            $('app').style.display = 'flex';
            refreshSelects();
        }
        function renderKanban() {
            const cols = [...teams.map((t, i) => ({ key: i, name: t.name, color: t.color })), { key: null, name: 'Tự do', color: '#64748b' }];
            const k = $('kanban');
            k.style.setProperty('--n', cols.length);
            k.innerHTML = cols.map(c => {
                const list = students.map((s, idx) => ({ s, idx })).filter(x => x.s.team === c.key);
                return `
                    <div class="col" style="--tc:${c.color}">
                        <h4><span>${c.name}</span><span>${list.length} HS</span></h4>
                        <div class="drop" data-key="${c.key === null ? '' : c.key}">
                            ${list.map(x => `<div class="card" draggable="true" data-idx="${x.idx}">${esc(studentDisplayName(x.s))}</div>`).join('')}
                        </div>
                    </div>`;
            }).join('');

            k.querySelectorAll('.card').forEach(c => {
                c.addEventListener('dragstart', e => {
                    dragKan = +c.dataset.idx;
                    c.classList.add('drag');
                    e.dataTransfer.setData('text/plain', dragKan);
                });
                c.addEventListener('dragend', () => c.classList.remove('drag'));
            });

            k.querySelectorAll('.drop').forEach(d => {
                d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over') });
                d.addEventListener('dragleave', () => d.classList.remove('over'));
                d.addEventListener('drop', e => {
                    e.preventDefault();
                    if (dragKan === null) return;
                    students[dragKan].team = d.dataset.key === '' ? null : +d.dataset.key;
                    dragKan = null;
                    renderKanban();
                });
            });
        }

        /* ==================== XUẤT FILE EXCEL 3 SHEET CHUẨN ==================== */
        function exportExcel() {
            if (typeof XLSX === 'undefined') {
                toast('Chưa tải xong thư viện Excel, vui lòng thử lại sau 2 giây!', 2500, 'var(--coral)');
                return;
            }

            // Sheet 1: Bảng Xếp Hạng
            const rankRows = [
                ['BẢNG TỔNG KẾT THI ĐUA VÀ XẾP HẠNG TIẾT HỌC'],
                [`Lớp: ${cls} | Thời gian: ${new Date().toLocaleString('vi-VN')} | Môn: Tin học 5 - Tiết 06`],
                [''],
                ['Hạng', 'Danh Hiệu', 'Tên Đội / Dãy', 'Điểm Số', 'Đồng Hạng', 'Ghi Chú Đánh Giá']
            ];

            const sorted = [...teams].sort((a, b) => b.score - a.score);
            let currentR = 0;
            const titles = ['QUÁN QUÂN', 'Á QUÂN', 'HẠNG BA', 'KHUYẾN KHÍCH', 'NỖ LỰC', 'GẮN KẾT'];

            sorted.forEach((t, i) => {
                if (i > 0 && t.score < sorted[i - 1].score) currentR = i;
                const isShared = (i > 0 && t.score === sorted[i - 1].score) || (i < sorted.length - 1 && t.score === sorted[i + 1].score);
                const tName = titles[currentR] || 'KHUYẾN KHÍCH';
                rankRows.push([
                    `Hạng ${currentR + 1}`,
                    isShared && currentR < 3 ? `ĐỒNG ${tName}` : tName,
                    t.name,
                    t.score,
                    isShared ? 'Có (Đồng điểm)' : 'Không',
                    'Hoàn thành xuất sắc nhiệm vụ'
                ]);
            });
            const wsRank = XLSX.utils.aoa_to_sheet(rankRows);
            wsRank['!cols'] = [{ wch: 12 }, { wch: 22 }, { wch: 18 }, { wch: 14 }, { wch: 16 }, { wch: 28 }];

            // Sheet 2: Nhật Ký Chi Tiết (dòng thời gian)
            const logRows = [
                ['NHẬT KÝ CHI TIẾT HOẠT ĐỘNG VÀ BIẾN ĐỘNG ĐIỂM SỐ THEO THỜI GIAN'],
                [`Thời gian xuất: ${new Date().toLocaleString('vi-VN')} | Tổng số sự kiện ghi nhận: ${activityLogs.length}`],
                [''],
                ['STT', 'Thời Gian', 'Đội / Dãy', 'Học Sinh Đại Diện', 'Nội Dung Sự Kiện / Thử Thách', 'Kết Quả', 'Biến Động Điểm', 'Điểm Sau Sự Kiện']
            ];

            if (activityLogs.length === 0) {
                logRows.push(['1', '-', 'Toàn lớp', '-', 'Tiết học diễn ra tích cực', 'Hoàn thành', '0', '-']);
            } else {
                activityLogs.forEach(entry => {
                    logRows.push([
                        entry.stt,
                        entry.time,
                        entry.team,
                        entry.student,
                        entry.action,
                        entry.result,
                        entry.delta,
                        entry.scoreAfter
                    ]);
                });
            }
            const wsLogs = XLSX.utils.aoa_to_sheet(logRows);
            wsLogs['!cols'] = [{ wch: 6 }, { wch: 12 }, { wch: 18 }, { wch: 24 }, { wch: 42 }, { wch: 18 }, { wch: 16 }, { wch: 18 }];

            // Sheet 3: Danh Sách Học Sinh
            const rows = [
                ['DANH SÁCH HỌC SINH VÀ LỊCH SỬ THAM GIA PHÁT BIỂU'],
                [`Lớp: ${cls} | Tổng số học sinh: ${students.length}`],
                [''],
                ['STT', 'Mã Học Sinh', 'Tên Học Sinh', 'Lớp', 'Đội / Dãy', 'Lịch Sử Hoạt Động & Ghi Điểm']
            ];
            let stt = 1;
            [...teams.map((_, i) => i), null].forEach(tid => {
                students.filter(s => s.team === tid).forEach(s => {
                    rows.push([
                        stt++,
                        `HS${String(s.id).padStart(3, '0')}`,
                        studentDisplayName(s),
                        cls,
                        tid === null ? 'Tự do' : teams[tid].name,
                        s.actions.join('; ') || 'Tham gia học tập tích cực'
                    ]);
                });
            });
            const wsStudents = XLSX.utils.aoa_to_sheet(rows);
            wsStudents['!cols'] = [{ wch: 6 }, { wch: 14 }, { wch: 28 }, { wch: 10 }, { wch: 16 }, { wch: 80 }];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, wsRank, 'Bảng Xếp Hạng');
            XLSX.utils.book_append_sheet(wb, wsLogs, 'Nhật Ký Chi Tiết');
            XLSX.utils.book_append_sheet(wb, wsStudents, 'Danh Sách Học Sinh');

            const d = new Date(), pad = n => String(n).padStart(2, '0');
            const timeStr = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
            const cleanClass = cls.replace(/[^a-zA-Z0-9]/g, '_');
            const fileName = `KetQua_TinHoc5_Tiet06_Lop${cleanClass}_${timeStr}.xlsx`;
            if (typeof uploadExcelToDrive === 'function') {
                uploadExcelToDrive(wb, fileName);
                return;
            }
            XLSX.writeFile(wb, fileName);
            toast(`📥 Đã xuất file: ${fileName}`, 2500, 'var(--mint)');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeModal();
                closeHs();
            }
        });
    </script>
</body>
