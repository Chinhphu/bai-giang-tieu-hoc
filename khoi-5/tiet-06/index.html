<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điệp vụ tìm kiếm và nhận diện trang web</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap');

        :root {
            --ink: #17243c;
            --bg: #eaf5f2;
            --mint: #16b89a;
            --blue: #3178f6;
            --yellow: #ffc857;
            --coral: #ff6c65;
            --line: #dce5ef;
            --shadow: 0 8px 0 rgba(23, 36, 60, .15)
        }

        * {
            box-sizing: border-box;
            font-family: 'Be Vietnam Pro', sans-serif;
            user-select: none
        }

        input,
        textarea,
        select {
            user-select: text;
            font: inherit
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--ink)
        }

        button {
            cursor: pointer;
            border: 0;
            transition: .1s ease;
            font-family: inherit
        }

        button:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: none !important
        }

        .hidden {
            display: none !important
        }

        /* Setup */
        #setup-screen {
            position: fixed;
            inset: 0;
            background: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000
        }

        .setup-box {
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 460px;
            width: 90%;
            box-shadow: var(--shadow)
        }

        .setup-box h2 {
            color: var(--blue);
            font-size: 32px;
            margin-top: 0
        }

        .setup-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 10px;
            font-size: 22px;
            font-weight: 800
        }

        .setup-box select {
            font-size: 24px;
            font-weight: 900;
            color: var(--coral);
            padding: 8px 12px;
            border: 4px solid var(--line);
            border-radius: 15px;
            outline: none
        }

        .btn-setup {
            background: var(--mint);
            color: #fff;
            font-size: 24px;
            font-weight: 900;
            padding: 15px 40px;
            border-radius: 15px;
            box-shadow: 0 6px 0 #087d69;
            width: 100%;
            margin-top: 14px
        }

        /* Layout: sidebar + main */
        #game-screen {
            display: none;
            min-height: 100vh
        }

        .sidebar {
            width: 170px;
            flex-shrink: 0;
            background: var(--ink);
            color: #fff;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto
        }

        .teams {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .team {
            background: rgba(255, 255, 255, .08);
            border: 3px solid var(--tc);
            border-radius: 12px;
            padding: 6px 8px;
            position: relative
        }

        .team.penalty-hit {
            animation: penalty-hit .9s ease-out
        }

        @keyframes penalty-hit {
            0%, 100% { transform: translateX(0); box-shadow: 0 0 0 transparent }
            12%, 36%, 60% { transform: translateX(-9px); box-shadow: 0 0 20px #ef4444 }
            24%, 48%, 72% { transform: translateX(9px); box-shadow: 0 0 20px #ef4444 }
            86% { transform: translateX(-3px); box-shadow: 0 0 8px #ef4444 }
        }

        .trow {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px
        }

        .tname {
            font-weight: 900;
            font-size: 14px;
            color: var(--tc);
            filter: brightness(1.35)
        }

        .tscore {
            font-size: 26px;
            font-weight: 900;
            line-height: 1.1;
            color: var(--yellow);
            text-align: center;
            margin: 2px 0 4px
        }

        .team select {
            width: 100%;
            padding: 4px;
            font-size: 12px;
            border: 0;
            border-radius: 6px;
            font-weight: 700;
            background: #fff;
            color: var(--ink)
        }

        .team select.need {
            outline: 4px solid #ef4444;
            background: #fee2e2;
            animation: shake .5s
        }

        .btn-penalty {
            background: rgba(255, 255, 255, .1);
            color: #fff;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 13px
        }

        .btn-penalty:hover {
            background: #ef4444
        }

        .spacer {
            flex: 1
        }

        .tc-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px
        }

        .btn-tiny {
            background: rgba(255, 255, 255, .08);
            color: #fff;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 18px
        }

        .btn-tiny:hover {
            background: rgba(255, 255, 255, .25)
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column
        }

        /* Thanh trên cùng: Ải + Vòng */
        .topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #fff;
            border-bottom: 4px solid var(--ink);
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap
        }

        .tab {
            background: #eef2f7;
            color: var(--ink);
            padding: 9px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px
        }

        .tab.on {
            background: var(--yellow);
            box-shadow: 0 4px 0 #dca631
        }

        .tb-gap {
            flex: 1
        }

        .tb-label {
            font-weight: 800;
            opacity: .6
        }

        .rounds {
            display: flex;
            gap: 6px
        }

        .rd {
            background: #eef2f7;
            color: var(--ink);
            font-weight: 900;
            width: 40px;
            padding: 9px 0;
            border-radius: 10px;
            font-size: 15px
        }

        .rd.on {
            background: var(--blue);
            color: #fff;
            box-shadow: 0 3px 0 #1f50b5
        }

        .rd.done:not(.on) {
            background: var(--mint);
            color: #fff
        }

        .stage {
            flex: 1;
            padding: 8px 12px
        }

        .panel {
            background: #fff;
            border: 6px solid var(--ink);
            border-radius: 28px;
            padding: 12px 16px;
            box-shadow: var(--shadow)
        }

        .phead {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px
        }

        .phead h2 {
            margin: 0 auto 0 0;
            color: var(--blue);
            font-size: 26px
        }

        .chip {
            background: var(--ink);
            color: var(--yellow);
            font-weight: 900;
            padding: 6px 16px;
            border-radius: 30px
        }

        .btn-grade,
        .btn-next {
            color: #fff;
            padding: 10px 22px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 12px
        }

        .btn-grade {
            background: var(--coral);
            box-shadow: 0 4px 0 #cc4640
        }

        .btn-next {
            background: var(--mint);
            box-shadow: 0 4px 0 #087d69
        }

        /* Ải 1 */
        .a1-layout {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .pool {
            background: #eaf5f2;
            border: 4px dashed var(--mint);
            border-radius: 20px;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            align-items: stretch;
            gap: 7px;
            margin-bottom: 0;
            transition: .15s
        }

        .pool.drag-over,
        .tray.drag-over {
            background: rgba(255, 200, 87, .25)
        }

        .word {
            position: relative;
            background: var(--yellow);
            color: var(--ink);
            font-size: 15px;
            font-weight: 900;
            line-height: 1.25;
            padding: 8px 10px;
            border-radius: 12px;
            border: 3px solid var(--ink);
            box-shadow: 0 4px 0 var(--ink);
            cursor: grab;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .word.drag {
            opacity: .35
        }

        .word.selected {
            outline: 5px solid var(--blue);
            outline-offset: 2px
        }

        .word em {
            position: absolute;
            top: -12px;
            right: -8px;
            background: var(--mint);
            color: #fff;
            font-style: normal;
            font-size: 14px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 2px solid var(--ink)
        }

        .graded .word {
            cursor: default;
            animation: reveal .5s both;
            animation-delay: calc(var(--d)*70ms)
        }

        .graded .word.answer {
            background: #4ade80;
            box-shadow: 0 0 0 4px rgba(74, 222, 128, .4), 0 4px 0 var(--ink)
        }

        .graded .word.dim {
            opacity: .4
        }

        .graded .clone.good {
            background: #4ade80
        }

        .graded .clone.mid {
            background: #fde68a
        }

        .graded .clone.bad {
            background: #fca5a5
        }

        @keyframes reveal {
            0% {
                transform: scale(.6);
                opacity: 0
            }

            70% {
                transform: scale(1.12)
            }

            100% {
                transform: scale(1)
            }
        }

        .trays {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(185px, 1fr))
        }

        .tray {
            border: 4px solid;
            border-radius: 16px;
            background: #fff;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 130px;
            transition: .15s
        }

        .tray-head {
            color: #fff;
            font-weight: 900;
            padding: 9px 12px;
            display: flex;
            justify-content: space-between;
            border-radius: 9px 9px 0 0
        }

        .gain {
            background: var(--ink);
            color: var(--yellow);
            padding: 0 10px;
            border-radius: 20px
        }

        .tray-body {
            flex: 1;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .team-task {
            min-height: 3em;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.35;
            color: #475569;
            overflow-wrap: anywhere
        }

        .word.clone {
            background: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            padding: 7px 10px;
            z-index: 1
        }

        .word.clone b {
            color: var(--blue)
        }

        /* Ải 2: trang web giả */
        .site {
            --ac: #2563eb;
            --bn: linear-gradient(45deg, #ff00cc, #3333ff);
            border: 4px solid var(--ink);
            border-radius: 16px;
            overflow: hidden;
            background: #fff;
            max-width: 1000px;
            margin: 0 auto
        }

        .th0 {
            --ac: #d97706;
            --bn: linear-gradient(45deg, #ff00cc, #3333ff)
        }

        .th1 {
            --ac: #0ea5e9;
            --bn: linear-gradient(45deg, #b91c1c, #111)
        }

        .th2 {
            --ac: #db2777;
            --bn: linear-gradient(45deg, #f97316, #facc15)
        }

        .th3 {
            --ac: #1d4ed8;
            --bn: linear-gradient(45deg, #1d4ed8, #7f1d1d)
        }

        .th4 {
            --ac: #16a34a;
            --bn: linear-gradient(45deg, #16a34a, #0f172a)
        }

        .fake-bar {
            background: #e9eef5;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--line)
        }

        .fake-dots {
            display: flex;
            gap: 6px
        }

        .fake-dots i {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #c3ccd9
        }

        .nv {
            color: #64748b;
            font-weight: 900;
            letter-spacing: 4px
        }

        .urlwrap {
            flex: 1;
            display: flex
        }

        .s-head {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 12px 20px;
            border-bottom: 2px solid var(--line)
        }

        .logo {
            font-weight: 900;
            font-size: 20px;
            color: var(--ac);
            margin-right: auto
        }

        .s-head nav {
            display: flex;
            gap: 16px;
            font-weight: 700;
            color: #475569;
            font-size: 15px
        }

        .s-search {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 7px 16px;
            color: #64748b;
            font-weight: 600;
            font-size: 14px
        }

        .s-hero {
            padding: 16px 20px;
            text-align: center;
            background: #f8fafc
        }

        .signal-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin: 6px 0
        }

        .s-main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            padding: 16px 20px
        }

        .s-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px
        }

        .s-card {
            background: #f4f7fb;
            border: 2px solid var(--line);
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center
        }

        .s-card div {
            font-size: 30px
        }

        .s-card b {
            display: block;
            font-size: 15px
        }

        .s-card span {
            font-size: 12px;
            color: #64748b;
            font-weight: 600
        }

        .s-form {
            border: 2px solid var(--line);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px
        }

        .widget {
            background: #f4f7fb;
            border: 2px solid var(--line);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 14px;
            color: #475569;
            text-align: left
        }

        .s-foot {
            background: #f1f5f9;
            padding: 12px 20px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            font-weight: 600
        }

        .trap {
            cursor: crosshair;
            transition: .2s;
            position: relative;
            border: 3px dashed transparent
        }

        .trap:hover {
            border-color: var(--coral);
            background-color: rgba(255, 108, 101, .15);
            border-radius: 8px
        }

        .trap.broken {
            pointer-events: none;
            opacity: .6;
            filter: grayscale(.8);
            border-color: var(--coral)
        }

        .trap.broken::after {
            content: '❌ ' attr(data-by);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-8deg);
            background: var(--coral);
            color: #fff;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 16px;
            border: 2px solid var(--ink);
            white-space: nowrap;
            z-index: 10
        }

        .trap.missed {
            pointer-events: none;
            opacity: .6;
            filter: grayscale(.8);
            border-color: #64748b
        }

        .trap.missed::after {
            content: '❌ Sai — mất lượt';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-8deg);
            background: #475569;
            color: #fff;
            font-weight: 900;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 16px;
            border: 2px solid var(--ink);
            white-space: nowrap;
            z-index: 10
        }

        .trap-url {
            flex: 1;
            background: #fff;
            padding: 7px 10px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            text-align: left;
            min-width: 0;
            overflow-wrap: anywhere
        }

        .trap-link {
            display: inline-block;
            color: #2563eb;
            font-weight: 800;
            text-decoration: underline;
            padding: 8px 10px;
            overflow-wrap: anywhere
        }

        .trap-banner {
            background: var(--bn);
            color: #fff;
            padding: 12px;
            font-size: 17px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 12px;
            min-width: 0
        }

        .trap-timer {
            display: inline-block;
            background: #ef4444;
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 900;
            animation: blink 1s infinite;
            margin-top: 10px
        }

        .trap-btn {
            background: linear-gradient(#22c55e, #15803d);
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 6px 0 #166534;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0
        }

        .trap-input {
            border: 2px solid #ccc;
            padding: 9px;
            font-size: 14px;
            border-radius: 8px;
            width: 100%;
            margin: 0;
            background: #f9f9f9;
            display: block;
            font-weight: bold
        }

        .trap-text {
            font-size: 14px;
            color: #555;
            font-weight: bold;
            margin: 0;
            overflow-wrap: anywhere
        }

        .safe.trap-banner {
            background: linear-gradient(135deg, #0ea5a4, #2563eb)
        }

        .safe.trap-timer {
            background: #e2e8f0;
            color: var(--ink);
            animation: none
        }

        .safe.trap-btn {
            background: var(--blue);
            box-shadow: 0 6px 0 #1f50b5
        }

        @keyframes blink {
            50% {
                opacity: .6
            }
        }

        .floatred {
            position: absolute;
            left: 50%;
            top: 20%;
            color: #ef4444;
            font-size: 30px;
            font-weight: 900;
            pointer-events: none;
            text-shadow: 0 2px 0 #fff, 0 0 8px #fff;
            animation: fup 1.3s ease-out forwards;
            white-space: nowrap;
            z-index: 5
        }

        @keyframes fup {
            0% {
                opacity: 0;
                transform: translate(-50%, 20px) scale(.6)
            }

            20% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1.2)
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -90px) scale(1)
            }
        }

        .shake {
            animation: shake .5s
        }

        @keyframes shake {

            20%,
            60% {
                transform: translateX(-6px)
            }

            40%,
            80% {
                transform: translateX(6px)
            }
        }

        /* Modal & toast */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000
        }

        .modal-box {
            background: #fff;
            padding: 26px;
            border-radius: 20px;
            border: 6px solid var(--ink);
            text-align: center;
            width: 90%;
            max-width: 480px;
            animation: popIn .3s
        }

        .modal-box h3 {
            font-size: 24px;
            color: var(--blue);
            margin: 0 0 6px
        }

        .modal-box textarea {
            width: 100%;
            height: 130px;
            border: 3px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            resize: vertical
        }

        .modal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0
        }

        .modal-btn {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, .2)
        }

        .modal-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            box-shadow: none
        }

        .btn-cancel {
            background: var(--line);
            color: var(--ink);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700
        }

        .btn-ok {
            background: var(--mint);
            color: #fff;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            margin-right: 8px
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translate(-50%, -20px);
            background: var(--mint);
            color: #fff;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 3000;
            border: 3px solid var(--ink)
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0)
        }

        @keyframes popIn {
            0% {
                transform: scale(.9);
                opacity: 0
            }

            100% {
                transform: scale(1);
                opacity: 1
            }
        }

        /* Kanban */
        #end-screen {
            display: none;
            flex-direction: column;
            min-height: 100vh
        }

        .ehead {
            background: var(--ink);
            padding: 14px 22px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap
        }

        .ehead h1 {
            margin: 0 auto 0 0;
            color: var(--yellow);
            font-size: 25px
        }

        .ehead button {
            color: #fff;
            padding: 11px 20px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px
        }

        .kanban {
            flex: 1;
            padding: 18px 22px;
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(var(--n), minmax(170px, 1fr));
            align-items: start;
            overflow-x: auto
        }

        .col {
            background: #f4f7fb;
            border: 4px solid var(--tc);
            border-radius: 20px;
            min-height: 340px;
            display: flex;
            flex-direction: column
        }

        .col h4 {
            margin: 0;
            padding: 12px;
            background: var(--tc);
            color: #fff;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            font-size: 18px
        }

        .drop {
            flex: 1;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .drop.over {
            background: rgba(255, 200, 87, .35)
        }

        .card {
            background: #fff;
            border: 3px solid var(--ink);
            border-radius: 12px;
            padding: 10px 12px;
            font-weight: 800;
            cursor: grab;
            box-shadow: 0 4px 0 var(--line)
        }

        .card.drag {
            opacity: .4
        }

        @media(max-width:900px) {
            #game-screen {
                flex-direction: column
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                flex-direction: column
            }

            .teams {
                flex-direction: row;
                flex-wrap: wrap
            }

            .team {
                flex: 1 1 150px
            }

            .spacer {
                display: none
            }

            .s-main {
                grid-template-columns: 1fr
            }

            .trays {
                grid-template-columns: repeat(auto-fit, minmax(210px, 1fr))
            }

        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important
            }
        }
    </style>
</head>

<body>

    <div id="setup-screen">
        <div class="setup-box">
            <h2>🕵️ Điệp vụ tìm kiếm và nhận diện trang web</h2>
            <div class="setup-row">Lớp
                <select id="s-class">
                    <option>5/1</option>
                    <option selected>5/2</option>
                    <option>5/3</option>
                    <option>5/4</option>
                    <option>5/5</option>
                    <option>5/6</option>
                </select>
            </div>
            <div class="setup-row">Số đội
                <select id="s-teams">
                    <option>2</option>
                    <option>3</option>
                    <option selected>4</option>
                    <option>5</option>
                    <option>6</option>
                </select>
            </div>
            <button class="btn-setup" onclick="startGame()">Bắt đầu Game</button>
        </div>
    </div>

    <div id="game-screen">
        <aside class="sidebar">
            <div class="teams" id="teams"></div>
            <div class="spacer"></div>
            <div class="tc-buttons">
                <button class="btn-tiny" onclick="openAddHs()" title="Thêm học sinh">➕</button>
                <button class="btn-tiny" onclick="openEnd()" title="Tổng kết">📋</button>
            </div>
        </aside>

        <div class="main">
            <div class="topbar">
                <button class="tab on" id="tab1" onclick="switchAi(1)">🔎 Ải 1 · Tìm kiếm thông tin</button>
                <button class="tab" id="tab2" onclick="switchAi(2)">🕵️ Ải 2 · Nhận diện trang web</button>
                <span class="tb-gap"></span>
                <div class="rounds" id="rounds"></div>
            </div>

            <div class="stage">
                <section class="panel" id="ai1">
                    <div class="phead">
                        <button class="btn-grade" id="a1-grade" onclick="gradeR1()">Chấm điểm vòng này</button>
                        <button class="btn-next hidden" id="a1-next" onclick="setRound(rd[1]+1)">Vòng tiếp theo
                            ▶</button>
                    </div>
                    <div class="a1-layout">
                        <div class="trays" id="trays"></div>
                        <div class="pool" id="word-pool"></div>
                    </div>
                </section>

                <section class="panel hidden" id="ai2">
                    <div class="phead">
                        <span class="chip" id="a2-left"></span>
                        <button class="btn-next hidden" id="a2-next" onclick="setRound(rd[2]+1)">Vòng tiếp theo
                            ▶</button>
                    </div>
                    <div class="site" id="a2-site"></div>
                </section>
            </div>
        </div>
    </div>

    <div id="end-screen">
        <div class="ehead">
            <h1>📋 Tổng kết: kéo thả thẻ tên để sửa đội</h1>
            <button style="background:var(--blue)" onclick="closeEnd()">← Quay lại game</button>
            <button style="background:var(--mint)" onclick="exportExcel()">📥 Xuất Excel</button>
        </div>
        <div class="kanban" id="kanban"></div>
    </div>

    <div class="modal-overlay" id="team-modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-box">
            <h3>Đội nào phát hiện?</h3>
            <p style="font-weight:bold;color:var(--coral);margin:0" id="modal-desc"></p>
            <div class="modal-grid" id="modal-btns"></div>
            <button class="btn-cancel" onclick="closeModal()">Hủy</button>
        </div>
    </div>

    <div class="modal-overlay" id="hs-modal" onclick="if(event.target===this)closeHs()">
        <div class="modal-box">
            <h3>Thêm học sinh</h3>
            <div style="font-weight:600;color:#5b6b85">Mỗi tên một dòng (hoặc cách nhau bằng dấu phẩy)</div>
            <textarea id="hs-text" placeholder="Nguyễn Văn A&#10;Trần Thị B"></textarea>
            <button class="btn-ok" onclick="saveHs()">Thêm</button><button class="btn-cancel"
                onclick="closeHs()">Đóng</button>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const COLORS = ['#3178f6', '#16b89a', '#ff6c65', '#e0a100', '#8b5cf6', '#ec4899'];
        const PTS = 100;
        const STARTING_SCORE = 1000;
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[a[i], a[j]] = [a[j], a[i]] } return a };

        let A1_DATA = [], A2_DATA = [];
        let cls = '', teams = [], students = [], nextStudentId = 0, a1State = [], a2State = [], ai = 1, rd = { 1: 0, 2: 0 };
        function studentDisplayName(student) {
            const matches = students.filter(s => s.name === student.name);
            return matches.length > 1 ? `${student.name} (${matches.findIndex(s => s.id === student.id) + 1})` : student.name;
        }
        function exportFileBase(classId) {
            const d = new Date(), pad = n => String(n).padStart(2, '0');
            const timestamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
            return `Tiet06_Lop${classId.replace('_', '-')}_${timestamp}`;
        }

        /* ---------- Dữ liệu học sinh ---------- */
        async function loadStudents(c) {
            try {
                const r = await fetch('../../assets/data/students_5_2026_2027.json');
                if (!r.ok) throw 0;
                const data = await r.json();
                const norm = s => String(s).replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const arr = Array.isArray(data) ? data : (data[c] || data[norm(c)] || data.students || Object.values(data).flat());
                return arr.filter(s => { const cl = typeof s === 'object' ? (s.class || s.lop || s.className || '') : ''; return !cl || norm(cl).endsWith(norm(c)) })
                    .map(s => typeof s === 'string' ? s : (s.name || s.hoTen || s.fullName || s.ten || '')).filter(Boolean);
            } catch { return [] }
        }
        async function loadQuests() {
            const response = await fetch('./quests.json');
            if (!response.ok) throw new Error(`quests.json trả về trạng thái ${response.status}`);
            const data = await response.json();
            const validA1 = Array.isArray(data.a1) && data.a1.length === 5 && data.a1.every(round => {
                if (!Array.isArray(round.cases) || round.cases.length < 6 || !Array.isArray(round.distractors)) return false;
                const answers = round.cases.flatMap(task => task.ans || []);
                const allWords = [...answers, ...round.distractors];
                return round.cases.every(task => typeof task.ctx === 'string' && Array.isArray(task.ans) && task.ans.length >= 1 && task.ans.every(word => typeof word === 'string' && word.trim().length)) &&
                    allWords.every(word => typeof word === 'string' && word.trim().length) && new Set(allWords.map(word => word.trim().toLocaleLowerCase())).size === allWords.length;
            });
            const validA2 = Array.isArray(data.a2) && data.a2.length === 5 && data.a2.every(round => {
                if (!Array.isArray(round.signals) || round.signals.length !== 12 || !round.theme ||
                    typeof round.theme.brand !== 'string' || !Array.isArray(round.theme.nav) ||
                    !Array.isArray(round.theme.cards) || !Array.isArray(round.theme.side)) return false;
                const types = round.signals.map(signal => signal.type);
                return ['url', 'banner', 'timer', 'input', 'btn', 'text'].every(type => types.filter(value => value === type).length === 2) &&
                    round.signals.every(signal => typeof signal.fake === 'string' && typeof signal.real === 'string' && typeof signal.label === 'string');
            });
            if (!validA1 || !validA2) throw new Error('Cấu trúc hoặc nội dung quests.json không hợp lệ');
            A1_DATA = data.a1;
            A2_DATA = data.a2;
        }
        async function startGame() {
            try {
                await loadQuests();
            } catch (error) {
                console.error('Không tải được quests.json', error);
                toast('Không tải được bộ nhiệm vụ. Hãy kiểm tra file quests.json rồi thử lại.', 4000, 'var(--coral)');
                return;
            }
            cls = $('s-class').value; const n = +$('s-teams').value;
            let list = await loadStudents(cls);
            if (!list.length) { toast('Chưa có file JSON, dùng danh sách tạm — bấm ➕ để nhập học sinh', 3500, 'var(--coral)'); list = ['Nguyễn Văn A', 'Trần Thị B', 'Lê Văn C', 'Phạm Thị D', 'Hoàng Văn E'] }
            students = list.map((name, index) => ({ id: index + 1, name, team: null, actions: [] }));
            nextStudentId = students.length;
            teams = Array.from({ length: n }, (_, i) => ({ name: `Đội ${i + 1}`, score: STARTING_SCORE, color: COLORS[i] }));
            a1State = A1_DATA.map(round => {
                const cases = shuffle(round.cases).slice(0, n);
                return {
                    cases,
                    words: shuffle([...cases.flatMap(task => task.ans), ...round.distractors]),
                    trays: teams.map(() => []),
                    graded: false,
                    gain: []
                };
            });
            a2State = A2_DATA.map(round => {
                const chosen = shuffle(round.signals.map((_, i) => i)).slice(0, n * 2);
                const correct = new Set(shuffle(chosen).slice(0, Math.max(1, Math.floor(chosen.length / 2))));
                return { broken: {}, chosen, correct };
            });
            $('setup-screen').classList.add('hidden'); $('game-screen').style.display = 'flex';
            renderTeams(); switchAi(1);
        }

        /* ---------- Điều hướng ---------- */
        function switchAi(n) {
            selectedWord = null;
            ai = n;
            $('tab1').classList.toggle('on', n === 1); $('tab2').classList.toggle('on', n === 2);
            $('ai1').classList.toggle('hidden', n !== 1); $('ai2').classList.toggle('hidden', n !== 2);
            n === 1 ? renderAi1() : renderAi2();
        }
        function setRound(r) { if (r < 0 || r > 4) return; selectedWord = null; rd[ai] = r; ai === 1 ? renderAi1() : renderAi2() }
        function renderRounds() {
            $('rounds').innerHTML = [0, 1, 2, 3, 4].map(i => {
                const done = ai === 1 ? a1State[i].graded : a2State[i].chosen.every(k => a2State[i].broken[k] !== undefined);
                return `<button class="rd ${rd[ai] === i ? 'on' : ''} ${done ? 'done' : ''}" onclick="setRound(${i})">${i + 1}</button>`
            }).join('');
        }

        /* ---------- Điểm, đội, phạt ồn ---------- */
        function renderTeams() {
            $('teams').innerHTML = teams.map((t, i) => `<div class="team" id="team-${i}" style="--tc:${t.color}">
    <div class="trow"><span class="tname">${t.name}</span>
      <button class="btn-penalty" onclick="penalty(${i})" title="Phạt ồn -10%">🔇</button></div>
    <div class="tscore" id="sc-${i}">${t.score}</div>
    <select id="sel-${i}"></select></div>`).join('');
            refreshSelects();
        }
        function refreshSelects() { // khóa học sinh đã trả lời ở MỌI dropdown, giữ nguyên lựa chọn đang chọn dở
            teams.forEach((_, i) => {
                const s = $('sel-' + i); if (!s) return;
                const v = s.value;
                s.innerHTML = '<option value="">-- Chọn học sinh --</option>' + students.map((st, k) => `<option value="${k}" ${st.team !== null ? 'disabled' : ''}>${st.team !== null ? '🔒 ' : ''}${esc(studentDisplayName(st))}</option>`).join('');
                if (v !== '' && students[+v] && students[+v].team === null) s.value = v;
            });
        }
        function addScore(i, pts) {
            teams[i].score += pts;
            $('sc-' + i).textContent = teams[i].score;
            toast(`+${pts} điểm cho ${teams[i].name}!`, 1400, teams[i].color);
        }
        /* Kiểm tra các đội trong danh sách đã chọn học sinh chưa; thiếu thì nhắc + tô đỏ ô chọn */
        function needStudent(list) {
            const miss = list.filter(i => $('sel-' + i).value === '');
            document.querySelectorAll('.team select.need').forEach(s => s.classList.remove('need'));
            if (!miss.length) return false;
            miss.forEach(i => { const s = $('sel-' + i); void s.offsetWidth; s.classList.add('need') });
            toast('⚠️ Hãy chọn học sinh cho: ' + miss.map(i => teams[i].name).join(', '), 3000, 'var(--coral)');
            return true;
        }
        document.addEventListener('change', e => { if (e.target.matches('.team select')) e.target.classList.remove('need') });
        /* Ghi nhận học sinh đang chọn ở đội i vừa trả lời, rồi khóa tên em đó */
        function recordAnswer(i, text) {
            const sel = $('sel-' + i);
            if (sel.value === '') return toast(`${teams[i].name}: chưa chọn học sinh nên không ghi vào Excel`, 2500, 'var(--coral)');
            const s = students[+sel.value];
            s.team = i; s.actions.push(text);
            sel.value = '';
            refreshSelects();
        }
        function penalty(i) {
            const d = Math.round(teams[i].score * 0.1);
            teams[i].score -= d; $('sc-' + i).textContent = teams[i].score;
            const el = $('team-' + i), f = document.createElement('div');
            f.className = 'floatred'; f.textContent = `-${d}`; el.appendChild(f); el.classList.add('penalty-hit');
            playPenaltySound();
            toast(`🔊 ${teams[i].name} bị trừ ${d} điểm!`, 1800, 'var(--coral)');
            setTimeout(() => { f.remove(); el.classList.remove('penalty-hit') }, 1000);
        }

        function playPenaltySound() {
            const AudioContextType = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextType) return;
            const audio = new AudioContextType(), now = audio.currentTime;
            const oscillator = audio.createOscillator(), volume = audio.createGain();
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(260, now);
            oscillator.frequency.exponentialRampToValueAtTime(70, now + .65);
            volume.gain.setValueAtTime(.0001, now);
            volume.gain.exponentialRampToValueAtTime(.28, now + .04);
            volume.gain.setValueAtTime(.28, now + .32);
            volume.gain.exponentialRampToValueAtTime(.0001, now + .72);
            oscillator.connect(volume); volume.connect(audio.destination);
            oscillator.start(now); oscillator.stop(now + .74);
            oscillator.onended = () => audio.close();
        }

        /* ---------- Thêm học sinh ---------- */
        function openAddHs() { $('hs-text').value = ''; $('hs-modal').style.display = 'flex'; setTimeout(() => $('hs-text').focus(), 50) }
        function closeHs() { $('hs-modal').style.display = 'none' }
        function saveHs() {
            const names = $('hs-text').value.split(/[,\n;]/).map(s => s.trim()).filter(Boolean);
            if (!names.length) return closeHs();
            names.forEach(name => students.push({ id: ++nextStudentId, name, team: null, actions: [] }));
            refreshSelects(); closeHs(); toast(`Đã thêm ${names.length} học sinh`, 1500, 'var(--blue)');
        }

        /* ---------- Popup chọn đội (Ải 2) ---------- */
        let modalCb = null;
        function openModal(desc, cb, maxSignsPerTeam = null) {
            $('modal-desc').textContent = desc;
            const counts = maxSignsPerTeam === null ? [] : teams.map((_, teamIndex) =>
                Object.values(a2State[rd[2]].broken).filter(result => result.team === teamIndex).length);
            $('modal-btns').innerHTML = teams.map((t, i) => {
                const full = maxSignsPerTeam !== null && counts[i] >= maxSignsPerTeam;
                return `<button class="modal-btn" style="background:${t.color}" ${full ? 'disabled title="Đội đã hết lượt trong vòng này"' : ''} onclick="resolveModal(${i})">${t.name}${maxSignsPerTeam !== null ? `<br><small>${counts[i]}/${maxSignsPerTeam} lượt</small>` : ''}</button>`;
            }).join('');
            modalCb = cb; $('team-modal').style.display = 'flex';
        }
        function closeModal() { $('team-modal').style.display = 'none'; modalCb = null }
        function resolveModal(i) { const cb = modalCb; closeModal(); if (cb) cb(i) }

        /* ================= ẢI 1 ================= */
        let drag = null, selectedWord = null;
        function renderAi1() {
            const r = rd[1], st = a1State[r];
            $('ai1').classList.toggle('graded', st.graded);
            $('a1-grade').classList.toggle('hidden', st.graded);
            $('a1-next').classList.toggle('hidden', !(st.graded && r < 4));
            $('word-pool').innerHTML = st.words.map((w, k) => {
                const isAnswer = st.cases.some(task => task.ans.includes(w));
                return `<div class="word ${st.graded ? (isAnswer ? 'answer' : 'dim') : ''} ${selectedWord === w ? 'selected' : ''}" style="--d:${k}" draggable="${!st.graded}" data-w="${esc(w)}" data-src="pool">${esc(w)}</div>`
            }).join('');
            $('trays').innerHTML = teams.map((t, i) => `<div class="tray" data-team="${i}" style="border-color:${t.color}">
    <div class="tray-head" style="background:${t.color}"><span>${t.name}</span>${st.graded ? `<span class="gain">+${st.gain[i] || 0}</span>` : ''}</div>
    <div class="tray-body"><div class="team-task">${esc(st.cases[i].ctx)}</div>${st.trays[i].map((w, k) => {
                const c = st.graded ? (st.cases[i].ans.includes(w) ? 'good' : 'bad') : '';
                return `<div class="word clone ${c}" style="--d:${k}"><b>${k + 1}.</b><span>${esc(w)}</span></div>`
            }).join('')}</div></div>`).join('');
            renderRounds();
        }
        const ai1El = $('ai1');
        function assignKeyword(teamIndex, word) {
            const st = a1State[rd[1]];
            if (st.graded) return false;
            if (st.trays[teamIndex].length >= 3) {
                toast('Đội này đã dùng hết lượt chọn từ khóa.', 1500, 'var(--coral)');
                return false;
            }
            const wordIndex = st.words.indexOf(word);
            if (wordIndex < 0) return false;
            st.words.splice(wordIndex, 1);
            st.trays[teamIndex].push(word);
            selectedWord = null;
            renderAi1();
            return true;
        }
        ai1El.addEventListener('click', e => {
            const word = e.target.closest('#word-pool .word[draggable="true"]');
            if (word) {
                selectedWord = selectedWord === word.dataset.w ? null : word.dataset.w;
                renderAi1();
                return;
            }
            const tray = e.target.closest('.tray');
            if (tray && selectedWord !== null) assignKeyword(+tray.dataset.team, selectedWord);
        });
        ai1El.addEventListener('dragstart', e => {
            const c = e.target.closest('.word[draggable="true"]'); if (!c) return;
            drag = { w: c.dataset.w, src: c.dataset.src };
            c.classList.add('drag'); e.dataTransfer.setData('text/plain', drag.w); e.dataTransfer.effectAllowed = 'move';
        });
        ai1El.addEventListener('dragend', () => { drag = null; ai1El.querySelectorAll('.drag,.drag-over').forEach(x => x.classList.remove('drag', 'drag-over')) });
        ai1El.addEventListener('dragover', e => {
            if (!drag) return; const z = e.target.closest('.tray'); if (!z) return;
            e.preventDefault(); ai1El.querySelectorAll('.drag-over').forEach(x => x !== z && x.classList.remove('drag-over')); z.classList.add('drag-over');
        });
        ai1El.addEventListener('drop', e => {
            if (!drag) return; const z = e.target.closest('.tray'); if (!z) return; e.preventDefault();
            const d = drag, tid = +z.dataset.team;
            drag = null;
            if (d.src === 'pool') assignKeyword(tid, d.w);
        });
        function gradeR1() {
            const r = rd[1], st = a1State[r];
            if (st.graded) return;
            if (needStudent(teams.map((_, i) => i))) return;
            teams.forEach((t, i) => {
                const tray = st.trays[i], answers = st.cases[i].ans;
                const ok = tray.filter(w => answers.includes(w)).length;
                const perfect = ok === answers.length;
                const pts = ok * PTS + (perfect ? PTS : 0);
                st.gain[i] = pts;
                if (pts > 0) addScore(i, pts);
                recordAnswer(i, `Ải 1 - Vòng ${r + 1}: ${st.cases[i].ctx} Đúng ${ok}/${answers.length} từ khóa (${tray.join(' · ')}) → +${pts}đ`);
            });
            st.graded = true; renderAi1();
        }

        /* ================= ẢI 2 ================= */
        function renderAi2() {
            const r = rd[2], R = A2_DATA[r].signals, T = A2_DATA[r].theme, st = a2State[r];
            const left = st.chosen.filter(k => st.broken[k] === undefined).length;
            $('a2-left').textContent = left ? `Còn ${left}/${st.chosen.length} dấu hiệu` : 'Đã nhận diện hết! 🎉';
            $('a2-next').classList.toggle('hidden', !(left === 0 && r < 4));
            const item = k => {
                const it = R[k], c = it.type === 'url' ? 'trap-url' : 'trap-' + it.type;
                if (!st.chosen.includes(k)) return `<div class="${c} safe">${esc(it.real)}</div>`;
                const result = st.broken[k];
                if (result) {
                    return `<div class="${c} safe trap ${result.correct ? 'broken' : 'missed'}" data-by="${teams[result.team].name}">${esc(result.correct ? it.fake : it.real)}</div>`;
                }
                return `<div class="${c} trap" onclick="triggerTrap(${r},${k})">${esc(st.correct.has(k) ? it.fake : it.real)}</div>`;
            };
            const group = type => R.map((signal, k) => signal.type === type ? item(k) : '').filter(Boolean).join('');
            const urlKeys = R.map((signal, k) => signal.type === 'url' ? k : -1).filter(k => k >= 0);
            const urlBar = item(urlKeys[0]);
            const linkKey = urlKeys[1], linkSignal = R[linkKey], linkResult = st.broken[linkKey];
            const urlLink = !st.chosen.includes(linkKey)
                ? `<div class="trap-link safe">${esc(linkSignal.real)}</div>`
                : linkResult
                    ? `<div class="trap-link safe trap ${linkResult.correct ? 'broken' : 'missed'}" data-by="${teams[linkResult.team].name}">${esc(linkResult.correct ? linkSignal.fake : linkSignal.real)}</div>`
                    : `<div class="trap-link trap" onclick="triggerTrap(${r},${linkKey})">${esc(st.correct.has(linkKey) ? linkSignal.fake : linkSignal.real)}</div>`;
            $('a2-site').className = 'site th' + r;
            $('a2-site').innerHTML = `
    <div class="fake-bar"><div class="fake-dots"><i></i><i></i><i></i></div><span class="nv">‹ › ⟳</span><div class="urlwrap">${urlBar}</div><span class="nv">⋮</span></div>
    <div class="s-head"><div class="logo">${T.brand}</div><nav>${T.nav.map(n => `<span>${n}</span>`).join('')}</nav><div class="s-search">🔍 Tìm kiếm...</div></div>
    <div class="s-hero"><div class="signal-row">${group('banner')}</div><div class="signal-row">${group('timer')}</div><div class="signal-row">${urlLink}</div></div>
    <div class="s-main">
      <div><div class="s-cards">${T.cards.map(c => `<div class="s-card"><div>${c[0]}</div><b>${c[1]}</b><span>${c[2]}</span></div>`).join('')}</div>
      <div class="s-form">${group('text')}${group('input')}${group('btn')}</div></div>
      <aside>${T.side.map(s => `<div class="widget">${s}</div>`).join('')}</aside>
    </div>
    <div class="s-foot">© 2026 ${T.brand.replace(/^\S+\s/, '')} · Điều khoản · Chính sách · Liên hệ</div>`;
            renderRounds();
        }
        function triggerTrap(r, k) {
            openModal('Đội nào kiểm tra dấu hiệu này?', i => {
                if (needStudent([i])) return; // đội chưa chọn học sinh: chưa ghi điểm, bẫy vẫn còn
                const correct = a2State[r].correct.has(k);
                a2State[r].broken[k] = { team: i, correct };
                const shownText = correct ? A2_DATA[r].signals[k].fake : A2_DATA[r].signals[k].real;
                if (correct) {
                    addScore(i, PTS);
                    recordAnswer(i, `Ải 2 - Vòng ${r + 1}: nhận diện đúng dấu hiệu “${shownText}” → +${PTS}đ`);
                } else {
                    recordAnswer(i, `Ải 2 - Vòng ${r + 1}: chọn nhầm dấu hiệu “${shownText}” → mất lượt`);
                    toast(`${teams[i].name} chọn nhầm dấu hiệu — mất lượt, không được cộng điểm.`, 2500, 'var(--coral)');
                }
                renderAi2();
            }, 2);
        }

        /* ================= KANBAN & EXCEL ================= */
        let dragKan = null;
        function openEnd() { $('game-screen').style.display = 'none'; $('end-screen').style.display = 'flex'; renderKanban() }
        function closeEnd() { $('end-screen').style.display = 'none'; $('game-screen').style.display = 'flex'; refreshSelects() }
        function renderKanban() {
            const cols = [...teams.map((t, i) => ({ key: i, name: t.name, color: t.color })), { key: null, name: 'Tự do', color: '#64748b' }];
            const k = $('kanban'); k.style.setProperty('--n', cols.length);
            k.innerHTML = cols.map(c => {
                const list = students.map((s, idx) => ({ s, idx })).filter(x => x.s.team === c.key);
                return `<div class="col" style="--tc:${c.color}"><h4><span>${c.name}</span><span>${list.length}</span></h4>
    <div class="drop" data-key="${c.key === null ? '' : c.key}">${list.map(x => `<div class="card" draggable="true" data-idx="${x.idx}">${esc(studentDisplayName(x.s))}</div>`).join('')}</div></div>`
            }).join('');
            k.querySelectorAll('.card').forEach(c => {
                c.addEventListener('dragstart', e => { dragKan = +c.dataset.idx; c.classList.add('drag'); e.dataTransfer.setData('text/plain', dragKan) });
                c.addEventListener('dragend', () => c.classList.remove('drag'));
            });
            k.querySelectorAll('.drop').forEach(d => {
                d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('over') });
                d.addEventListener('dragleave', () => d.classList.remove('over'));
                d.addEventListener('drop', e => {
                    e.preventDefault(); if (dragKan === null) return;
                    students[dragKan].team = d.dataset.key === '' ? null : +d.dataset.key; dragKan = null; renderKanban()
                });
            });
        }
        function exportExcel() {
            const rows = [['STT', 'Mã học sinh', 'Tên Học Sinh', 'Lớp', 'Đội', 'Cách trả lời']]; let stt = 1;
            [...teams.map((_, i) => i), null].forEach(tid => students.filter(s => s.team === tid).forEach(s =>
                rows.push([stt++, `HS${String(s.id).padStart(3, '0')}`, studentDisplayName(s), cls, tid === null ? 'Tự do' : teams[tid].name, s.actions.join('; ') || 'Chưa ghi điểm'])));
            const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = [{ wch: 5 }, { wch: 12 }, { wch: 26 }, { wch: 8 }, { wch: 12 }, { wch: 80 }];
            const ws2 = XLSX.utils.aoa_to_sheet([['Đội', 'Tổng điểm'], ...teams.map(t => [t.name, t.score])]); ws2['!cols'] = [{ wch: 14 }, { wch: 12 }];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Chi Tiết HS'); XLSX.utils.book_append_sheet(wb, ws2, 'Điểm các đội');
            XLSX.writeFile(wb, `${exportFileBase(cls)}.xlsx`);
        }

        let tt;
        function toast(msg, ms = 1800, bg = 'var(--mint)') {
            const t = $('toast'); t.textContent = msg; t.style.background = bg; t.classList.add('show');
            clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms);
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeHs() } });
    </script>
</body>

</html>
