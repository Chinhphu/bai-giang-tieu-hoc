<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạng Nhện An Toàn - Chiếm Lõi Máy Chủ (Tin học 4)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap');

        :root {
            --tc: #2fa8ff
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            background: #060c1d;
            color: #e8f1ff;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 16px;
            overflow: hidden;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 18px;
            height: 68px
        }

        header h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 900;
            color: #7dffd4;
            text-shadow: 0 0 12px #19e6a5;
            letter-spacing: 0.5px;
        }

        #turn {
            font-weight: 800;
            font-size: 1.15rem;
            padding: 8px 18px;
            border-radius: 30px;
            border: 3px solid var(--tc);
            background: #0d1a3a;
            box-shadow: 0 0 18px var(--tc)
        }

        .header-btns {
            display: flex;
            gap: 10px;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 310px;
            gap: 14px;
            padding: 0 14px 14px;
            height: calc(100vh - 68px)
        }

        #wrap {
            position: relative;
            border: 2px solid #1d3a7a;
            border-radius: 18px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #10224d, #060c1d 75%);
            background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px), radial-gradient(circle at 50% 50%, #10224d, #060c1d 75%);
            background-size: 40px 40px, 40px 40px, 100% 100%
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

        svg:active {
            cursor: grabbing;
        }

        .edge {
            stroke: #2f56b3;
            stroke-width: 1.5;
            opacity: 0.6;
            transition: all .7s
        }

        .edge.own {
            stroke-width: 4;
            opacity: 1
        }

        .edge-trail {
            fill: none;
            stroke-width: 2.5;
            opacity: .95;
            pointer-events: none;
        }

        .edge.cut {
            opacity: 0;
            stroke: #ff3b5c;
            stroke-width: 6
        }

        .edge.rescue {
            stroke: #19e6a5;
            stroke-dasharray: 6 6;
            stroke-width: 3;
            animation: dash 5s linear infinite;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -100;
            }
        }

        .node .b {
            fill: #0e1b3a;
            stroke: #5b8cff;
            stroke-width: 2;
            filter: url(#gl);
            transition: fill .4s
        }

        .node text {
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            fill: #cfe0ff;
            font-weight: 800;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        .node .r1,
        .node .r2,
        .node .trail-ring {
            fill: none;
            display: none
        }

        .node .trail-ring {
            stroke-width: 2;
            stroke-dasharray: 3 3;
            opacity: .9;
            pointer-events: none;
        }

        .node .r1 {
            stroke: var(--tc);
            stroke-width: 3;
            transform-box: fill-box;
            transform-origin: center
        }

        .node .r2 {
            stroke-width: 2;
            stroke-dasharray: 4 4
        }

        .node.cand {
            cursor: pointer
        }

        .node.cand .r1 {
            display: block;
            animation: pl 1s infinite
        }

        .node.cand:hover .b {
            stroke: #fff
        }

        @keyframes pl {
            50% {
                transform: scale(1.3);
                opacity: .3
            }
        }

        .clabel {
            fill: #7dffd4;
            font-weight: 900;
            font-size: 13px;
            text-anchor: middle;
            letter-spacing: 1px;
        }

        aside {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        #teams {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            flex-shrink: 0;
        }

        .tm {
            border: 2px solid var(--c);
            border-radius: 12px;
            padding: 8px 10px;
            background: #0d1a3a;
            display: flex;
            flex-direction: column;
            opacity: .6;
        }

        .tm.on {
            opacity: 1;
            box-shadow: 0 0 15px var(--c);
            background: #14265a
        }

        .tm b {
            color: var(--c);
            font-size: 1.1rem
        }

        .tm span {
            font-size: .85rem;
            color: #cfe0ff
        }

        #students-panel {
            flex: 1;
            border: 2px solid #5b8cff;
            border-radius: 14px;
            background: #0b1530;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #students-header {
            background: #16295e;
            padding: 10px;
            font-weight: 900;
            text-align: center;
            border-bottom: 2px solid #5b8cff;
            color: #7dffd4;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #search-student {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #5b8cff;
            background: #0d1a3a;
            color: #fff;
            outline: none;
            font-family: inherit;
            font-size: 0.95rem;
        }

        #students-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stu-btn {
            background: #112347;
            border: 1px solid #2f56b3;
            border-radius: 8px;
            color: #fff;
            padding: 8px 12px;
            text-align: left;
            font: inherit;
            cursor: pointer;
            transition: 0.2s;
        }

        .stu-btn:hover:not(:disabled) {
            background: #1b366e;
            border-color: #5b8cff;
        }

        .stu-btn.active {
            background: #2fa8ff;
            color: #000;
            font-weight: 800;
            box-shadow: 0 0 10px #2fa8ff;
            border-color: #fff;
        }

        .stu-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
        }

        .btn {
            border: 0;
            border-radius: 14px;
            padding: 10px 16px;
            font: inherit;
            font-weight: 800;
            color: #fff;
            background: #5b8cff;
            box-shadow: 0 4px 0 #2f56b3;
            cursor: pointer;
            transition: 0.1s;
        }

        .btn:hover:enabled {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active:enabled {
            transform: translateY(4px);
            box-shadow: none !important;
        }

        .btn:disabled {
            opacity: .65;
            cursor: not-allowed;
            filter: grayscale(50%);
        }

        .btn.outline {
            background: #16295ea3;
            border: 1px solid #5b8cff;
            box-shadow: none;
            backdrop-filter: blur(4px);
        }

        .btn.good {
            background: #2fa84a !important;
            box-shadow: 0 4px 0 #1b632b !important;
            border-color: #2fa84a;
        }

        .btn.bad {
            background: #c0392b !important;
            box-shadow: 0 4px 0 #7a2219 !important;
            border-color: #c0392b;
        }

        .btn.yellow {
            background: #ffd84d;
            color: #17233c;
            box-shadow: 0 4px 0 #c5a718;
        }

        .btn.red {
            background: #ff5c6c;
            box-shadow: 0 4px 0 #b83a47;
        }

        #setup,
        #modal {
            position: fixed;
            inset: 0;
            background: #030814e0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 14px
        }

        #setup.show,
        #modal.show {
            display: flex
        }

        /* Mở rộng mbox lúc kết thúc để kéo thả rộng rãi */
        .mbox {
            width: min(1000px, 98vw);
            max-height: 96vh;
            overflow: auto;
            background: #0d1a3a;
            border: 3px solid #5b8cff;
            border-radius: 22px;
            padding: 25px;
            box-shadow: 0 0 40px #2f56b3;
            animation: in .3s
        }

        @keyframes in {
            from {
                transform: scale(.9);
                opacity: 0
            }
        }

        #mHead {
            font-size: 1.5rem;
            font-weight: 900;
            text-align: center;
            line-height: 1.4;
        }

        #mHead small {
            color: #7dffd4;
            font-size: 1.1rem;
            display: block;
            margin-top: 5px;
        }

        #tw {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0
        }

        .tbar {
            flex: 1;
            height: 16px;
            background: #1b2c5c;
            border-radius: 10px;
            overflow: hidden
        }

        #tb {
            display: block;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff5c6c, #ffd84d, #19e6a5);
            transition: width 0.1s linear
        }

        #tl {
            font-weight: 900;
            min-width: 45px;
            font-size: 1.1rem;
        }

        .q {
            text-align: center;
            font-weight: 700;
            margin: 10px 0 20px;
            line-height: 1.5;
        }

        .q.big {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffd84d;
        }

        .chat {
            background: #16295e;
            border-left: 6px solid #ff5c6c;
            border-radius: 12px;
            padding: 18px 24px;
            font-size: 1.25rem;
            font-weight: 700;
            margin: 10px 0 20px;
            color: #fff;
        }

        .ans2,
        .ans4 {
            display: grid;
            gap: 12px
        }

        .ans2 {
            grid-template-columns: 1fr 1fr
        }

        .ans4 {
            grid-template-columns: 1fr 1fr
        }

        .ans2 .btn,
        .ans4 .btn {
            text-align: left;
            font-size: 1.1rem;
            padding: 18px;
        }

        .exp-box {
            margin-top: 20px;
            padding: 20px;
            background: #112347;
            border-radius: 14px;
            font-size: 1.1rem;
            text-align: left;
            animation: in .4s ease;
            line-height: 1.5;
        }

        #mRes {
            text-align: center
        }

        #mRes .btn {
            margin-top: 20px;
            padding: 14px 40px
        }

        #toasts {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            gap: 10px;
            z-index: 99;
            width: min(640px, 94vw);
            pointer-events: none;
        }

        .toast {
            padding: 14px 24px;
            border-radius: 14px;
            font-weight: 900;
            text-align: center;
            background: #16295e;
            border: 3px solid #5b8cff;
            animation: in .3s;
            box-shadow: 0 8px 24px #0008;
            font-size: 1.1rem;
            pointer-events: auto;
        }

        .toast.ok {
            border-color: #2fd16a;
            color: #2fd16a;
        }

        .toast.bad {
            border-color: #ff5c6c;
            background: #3a1220;
            color: #ff5c6c;
        }

        .rank-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 10px;
            margin-top: 10px;
            text-align: left;
        }

        .rank-item {
            padding: 14px 18px;
            background: #112347;
            border-radius: 12px;
            font-size: 1rem;
            border-left: 6px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .zoom-controls:hover {
            opacity: 1;
        }

        .zoom-controls .btn {
            padding: 8px 12px;
            font-size: 1rem;
            border-radius: 8px;
        }

        .confirm-box {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            background: #112347;
            border-radius: 14px;
            border: 2px dashed #5b8cff;
        }

        /* Kéo thả CSS */
        .dd-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-top: 15px;
            padding-bottom: 5px;
        }

        .dd-zone {
            flex: 1;
            min-width: 170px;
            background: #0b1530;
            border: 2px dashed #5b8cff;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 250px;
            overflow-y: auto;
        }

        .dd-zone h4 {
            margin: 0 0 10px 0;
            color: #7dffd4;
            text-align: center;
            position: sticky;
            top: -10px;
            background: #0b1530;
            padding: 5px 0;
            z-index: 2;
            border-bottom: 1px solid #1d3a7a;
        }

        .dd-item {
            background: #16295e;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: grab;
            border: 1px solid #2f56b3;
            font-size: 0.9rem;
            color: #fff;
        }

        .dd-item:active {
            cursor: grabbing;
            background: #2fa8ff;
            color: #000;
            border-color: #fff;
        }

        #modal {
            inset: auto;
            top: 68px;
            left: 14px;
            right: 338px;
            bottom: 14px;
            padding: 0;
            background: #030814f5;
            border-radius: 18px
        }

        #modal .mbox {
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            padding: 2vh 2vw;
            overflow: auto
        }

        #modal #mHead {
            font-size: clamp(1.1rem, 2.2vw, 2rem)
        }

        #modal #mHead small {
            font-size: clamp(1rem, 1.6vw, 1.6rem)
        }

        #modal #mBody {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        #modal .q {
            font-size: clamp(1.2rem, 2vw, 2rem)
        }

        #modal .q.big {
            font-size: clamp(1.6rem, 3.6vw, 3.6rem);
            line-height: 1.3;
            margin: 0 0 3vh
        }

        #modal .chat {
            font-size: clamp(1.5rem, 3vw, 3rem);
            padding: 3vh 2.5vw;
            margin: 0 0 3vh
        }

        #modal .ans2,
        #modal .ans4 {
            flex: 1;
            grid-auto-rows: 1fr;
            gap: 2vh 1.5vw;
            max-height: 55vh
        }

        #modal .ans2 .btn,
        #modal .ans4 .btn {
            font-size: clamp(1.3rem, 2.5vw, 2.6rem);
            padding: 1.5vh 1.5vw;
            display: flex;
            align-items: center
        }

        #modal .tf-grid {
            flex: 1;
            max-height: 50vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2vw
        }

        #modal .tf-grid .btn {
            font-size: clamp(2rem, 5vw, 5rem)
        }

        #modal .exp-box {
            font-size: clamp(1.1rem, 1.8vw, 1.8rem)
        }

        #modal .confirm-box h3 {
            font-size: clamp(1.5rem, 3vw, 3rem)
        }

        #modal .confirm-box .btn {
            font-size: clamp(1.2rem, 2vw, 2rem) !important;
            padding: 2vh 3vw !important
        }

        #modal #mRes .btn {
            font-size: clamp(1.1rem, 1.8vw, 1.8rem)
        }

        #z {
            transition: transform .8s ease;
            transform-origin: 0 0
        }

        #z.drag {
            transition: none
        }

        #modal .mbox {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden
        }

        #modal #mHead,
        #modal #tw,
        #modal #mRes {
            flex: 0 0 auto
        }

        #modal #mBody {
            flex: 1 0 auto;
            min-height: 0;
            justify-content: flex-start
        }

        #modal .ans2,
        #modal .ans4 {
            flex: none;
            max-height: none;
            grid-auto-rows: minmax(14vh, auto)
        }

        #modal .tf-grid {
            flex: none;
            max-height: none;
            grid-auto-rows: minmax(26vh, auto)
        }

        #modal .exp-box {
            flex: none;
            margin-top: 3vh
        }

        #modal #mRes {
            padding-bottom: 2vh
        }
    </style>
</head>

<body>
    <header>
        <h1>MẠNG NHỆN AN TOÀN</h1>
        <div id="turn"></div>
        <div class="header-btns">
            <button class="btn red" onclick="forceEnd()">Kết thúc / Quản lý HS</button>
            <button class="btn yellow" onclick="$('#setup').classList.add('show')">Cài đặt / Đổi lớp</button>
        </div>
    </header>
    <main>
        <div id="wrap">
            <svg id="g" viewBox="0 0 1000 640" draggable="false" ondragstart="return false;">
                <defs>
                    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="2.5" result="b" />
                        <feMerge>
                            <feMergeNode in="b" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                <g id="z"></g>
            </svg>
            <div class="zoom-controls">
                <button class="btn outline" onclick="zoom(0.2)">+</button>
                <button class="btn outline" onclick="zoom(-0.2)">-</button>
                <button class="btn outline" onclick="resetZoom()">Về lượt hiện tại</button>
                <button class="btn outline" onclick="showAll()">Toàn cảnh</button>
            </div>
        </div>
        <aside>
            <div id="teams"></div>
            <div id="students-panel">
                <div id="students-header">
                    <span id="st-head-title">DANH SÁCH LỚP</span>
                    <input type="text" id="search-student" placeholder="Tìm tên học sinh..." onkeyup="filterStudents()">
                </div>
                <div id="students-list"></div>
            </div>
        </aside>
    </main>
    <div id="toasts"></div>

    <!-- Màn hình Setup -->
    <div id="setup" class="show">
        <div class="mbox" style="text-align:center; max-width: 580px;">
            <h2 style="color: #7dffd4; font-size: 2rem; margin-top: 0">CÀI ĐẶT TRÒ CHƠI</h2>
            <div style="text-align: left; margin-bottom: 20px;">
                <label style="font-weight: bold; margin-bottom: 8px; display: block;">1. Chọn lớp:</label>
                <select id="class-select"
                    style="width:100%; padding: 12px; border-radius: 10px; font-size: 1.1rem; background: #16295e; color: #fff; border: 2px solid #5b8cff; outline: none;">
                    <option value="4_1">Lớp 4/1</option>
                    <option value="4_2">Lớp 4/2</option>
                    <option value="4_3">Lớp 4/3</option>
                    <option value="4_4">Lớp 4/4</option>
                    <option value="4_5">Lớp 4/5</option>
                    <option value="4_6">Lớp 4/6</option>
                </select>
            </div>
            <div style="text-align: left; margin-bottom: 30px;">
                <label style="font-weight: bold; margin-bottom: 8px; display: block;">2. Chọn số Tổ (Đội chơi):</label>
                <select id="team-select"
                    style="width:100%; padding: 12px; border-radius: 10px; font-size: 1.1rem; background: #16295e; color: #fff; border: 2px solid #5b8cff; outline: none;">
                    <option value="2">2 Tổ</option>
                    <option value="3">3 Tổ</option>
                    <option value="4" selected>4 Tổ</option>
                    <option value="5">5 Tổ</option>
                    <option value="6">6 Tổ</option>
                </select>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn good" style="font-size: 1.2rem; flex: 1; padding: 15px;"
                    onclick="loadAndStart(false)">▶ TIẾP TỤC VÁN CŨ</button>
                <button class="btn yellow" style="font-size: 1.2rem; flex: 1; padding: 15px;"
                    onclick="loadAndStart(true)">🔄 TẠO VÁN MỚI</button>
            </div>

            <div
                style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1d3a7a; padding-top: 15px;">
                <p style="font-size:0.9rem; color:#888; margin: 0; text-align: left;">*Game sẽ tự động lưu lại toàn bộ
                    bản đồ và điểm số.</p>
                <button class="btn outline"
                    style="font-size: 0.9rem; padding: 8px 12px; border-color: #ff5c6c; color: #ff5c6c;"
                    onclick="clearLocalData()">🗑️ Xóa sạch dữ liệu</button>
            </div>
        </div>
    </div>

    <!-- Màn hình Modal Hỏi Đáp -->
    <div id="modal">
        <div class="mbox">
            <div id="mHead"></div>
            <div id="tw">
                <div class="tbar"><i id="tb"></i></div><span id="tl"></span>
            </div>
            <div id="mBody"></div>
            <div id="mRes"></div>
        </div>
    </div>

    <script>
        const $ = s => document.querySelector(s), sh = a => [...a].sort(() => Math.random() - .5), NS = 'http://www.w3.org/2000/svg';
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const ALL_COLORS = ['#2fa8ff', '#ff4d6a', '#ffd84d', '#b184ff', '#19e6a5', '#ff914d'];

        const FALLBACK_JSON = {

        // Các biến Đồ thị
        let N, E, heads, owned, turn, over, busy, stuck, svgN, svgE, svgTrail, tm, done, curId;

        /* ===== ZOOM/PAN ===== */
        let zScale = 1, zPanX = 0, zPanY = 0, isDragging = false, startX, startY, lastFocusKey = null;
        const svgEl = $('#g'); const zGroup = $('#z');
        function applyTransform() { zGroup.style.transform = `translate(${zPanX}px, ${zPanY}px) scale(${zScale})`; }
        function zoom(d) {

        // CÁC BIẾN CHỨA CÂU HỎI
        let TF = [];

        /* ===== LOAD DỮ LIỆU & BẮT ĐẦU ===== */
        async function loadAndStart(forceNew = false) {

        /* ===== LƯU TRỮ VÀ KHÔI PHỤC TRẠNG THÁI GAME ===== */
        function saveGameState() {
            const state = {
                numT: numT,
                N: N,
                E: E,
                heads: heads,
                owned: owned.map(set => Array.from(set)),
                paths: paths.map(path => path.slice()),
                visitedByTeam: visitedByTeam.map(set => Array.from(set)),

                turn: turn,

            localStorage.setItem('gameLog_' + currentClassID, JSON.stringify(gameLog));
        }

        /* ===== MAP N  BƯỚC ===== */
        const MAP_LEVELS = 13;     // số tầng từ T tới Lõi
        const START_ADVANCE = 3;  // mỗi tổ xuất phát sẵn đã đi 3 node sau T
        const TWIST = 0.8;        // độ xoắn mỗi tầng phía trong (radian)

        function buildMap(num) {
            const D = 5;               // 5 vòng mê cung chính
            const ADVANCE = 3;         // Cho sẵn 3 bước làm "vốn" để phạt
            const n = num;             // Số đội chơi
            const ptsPerRing = 12;     // 12 node trên mỗi vòng (ép đi ngang)

            const RX = 420, RY = 260, TAU = Math.PI * 2;
            const P = [{ x: 500, y: 320, t: 'c', a: 0 }]; // Lõi = node 0
            const id = Array.from({ length: D + 1 }, () => []);

            // 1. TẠO CÁC VÒNG MÊ CUNG CHÍNH
            for (let k = D; k >= 1; k--) {
                const f = Math.pow(k / D, 0.85);
                const offset = (D - k) * 0.2;
                for (let i = 0; i < ptsPerRing; i++) {
                    const a = offset + TAU * i / ptsPerRing;
                    const jit = 1 + (Math.random() * 0.02 - 0.01);
                    P.push({
                        x: 500 + Math.cos(a) * RX * f * jit,
                        y: 320 + Math.sin(a) * RY * f * jit,
                        t: 'n',
                        a
                    });
                    id[k].push(P.length - 1);
                }
            }

            const S = new Set();
            const add = (a, b) => S.add(Math.min(a, b) + '-' + Math.max(a, b));
            const angD = (a, b) => { const d = Math.abs(a - b) % TAU; return d > Math.PI ? TAU - d : d; };
            const nearest = (u, level) => level.slice().sort((p, q) => angD(P[p].a, P[u].a) - angD(P[q].a, P[u].a));
            const doorIndices = doorCount => {
                const sectorSize = ptsPerRing / doorCount;
                if (Number.isInteger(sectorSize)) {
                    const offset = Math.floor(Math.random() * sectorSize);
                    return Array.from({ length: doorCount }, (_, d) => d * sectorSize + offset);
                }
                return Array.from({ length: doorCount }, (_, d) => {
                    const start = Math.floor(d * ptsPerRing / doorCount);
                    const end = Math.floor((d + 1) * ptsPerRing / doorCount);
                    return start + Math.floor(Math.random() * (end - start));
                });
            };

            // 2. NỐI VÒNG LIÊN TỤC ĐỂ MỌI TỔ CÓ THỂ ĐI VÒNG
            for (let k = 1; k <= D; k++) {
                const L = id[k];
                for (let i = 0; i < L.length; i++) add(L[i], L[(i + 1) % L.length]);
            }

            // 3. MỖI TỔ CÓ MỘT CỬA VÀO VÒNG TRONG, ĐẶT ĐỐI XỨNG KHI CÓ THỂ
            for (let k = D; k >= 2; k--) {
                for (const idx of doorIndices(n)) {
                    const u = id[k][idx];
                    const c = nearest(u, id[k - 1]);
                    add(u, c[0]);
                }
            }

            // 4. CỬA VÀO LÕI CŨNG ĐƯỢC CHIA ĐỀU THEO SỐ TỔ
            doorIndices(n).forEach(idx => add(id[1][idx], 0));

            // 5. TẠO ĐƯỜNG XUẤT PHÁT CHO SẴN (VỐN 3 BƯỚC)
            const lanes = [];
            for (let j = 0; j < n; j++) {
                // Chia đều vị trí các đội trên vòng ngoài cùng
                const entryIdx = Math.floor((j * ptsPerRing) / n);
                const entryNodeId = id[D][entryIdx];
                const entryA = P[entryNodeId].a;

                const laneNodes = [];
                // Vẽ thêm 3 node đâm thẳng ra ngoài từ cổng Entry
                // step 3 là Base (ngoài cùng), step 1 là sát vòng ngoài
                for (let step = ADVANCE; step >= 1; step--) {
                    const f = 1 + (step * 0.15); // Kéo dài ra xa lõi
                    P.push({
                        x: 500 + Math.cos(entryA) * RX * f,
                        y: 320 + Math.sin(entryA) * RY * f,
                        t: step === ADVANCE ? 's' : 'n',
                        a: entryA
                    });
                    laneNodes.push(P.length - 1);
                }
                // Nối thẳng vào EntryNode (bước cuối cùng của vốn 3 bước)
                laneNodes.push(entryNodeId);

                // Nối các node thẳng hàng này lại với nhau
                for (let i = 0; i < laneNodes.length - 1; i++) {
                    add(laneNodes[i], laneNodes[i + 1]);
                }
                lanes.push(laneNodes);
            }

            const E = [...S].map(s => s.split('-').map(Number)).filter(e => e[0] !== e[1]);

            return { P, E, lanes };
        }

        function mapDistancesToCore(map) {
            const adjacency = Array.from({ length: map.P.length }, () => []);
            map.E.forEach(([a, b]) => {
                adjacency[a].push(b);
                adjacency[b].push(a);
            });

            return map.lanes.map(lane => {
                const start = lane[lane.length - 1];
                const visitedStartNodes = new Set(lane.slice(0, -1));
                const distances = Array(map.P.length).fill(-1);
                distances[start] = 0;
                const queue = [start];
                for (let i = 0; i < queue.length; i++) {
                    const node = queue[i];
                    for (const next of adjacency[node]) {
                        if (distances[next] !== -1 || visitedStartNodes.has(next)) continue;
                        distances[next] = distances[node] + 1;
                        queue.push(next);
                    }
                }
                return distances[0];
            });
        }

        function buildBalancedMap(num) {
            let bestMap = null;
            let bestScore = Infinity;

            for (let attempt = 0; attempt < 1000; attempt++) {
                const map = buildMap(num);
                const distances = mapDistancesToCore(map);
                if (distances.some(distance => distance < 0)) continue;

                const spread = Math.max(...distances) - Math.min(...distances);
                const mean = distances.reduce((sum, distance) => sum + distance, 0) / distances.length;
                const score = spread * 1000 + distances.reduce((sum, distance) => sum + Math.abs(distance - mean), 0);
                if (score < bestScore) {
                    bestMap = map;
                    bestScore = score;
                }
                if (spread === 0) break;
            }

            if (!bestMap) throw new Error('Không tạo được bản đồ có đường đi tới lõi cho mọi tổ.');
            return { ...bestMap, startDistances: mapDistancesToCore(bestMap) };
        }

        /* ===== INIT & RENDER GAME ===== */
        function mk(t, a, p) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e }
        const nb = i => E.filter(e => e.alive && (e.a == i || e.b == i)).map(e => e.a == i ? e.b : e.a);
        const edgeKey = (a, b) => a < b ? `${a}-${b}` : `${b}-${a}`;
        function cands(t) {
            return nb(heads[t]).filter(node => !visitedByTeam[t].has(node));
        }
        function dist(t) {
            const q = [[heads[t], 0]], seen = new Set([heads[t]]);
            while (q.length) {
                const [i, d] = q.shift(); if (i == 0) return d;
                nb(i).forEach(j => {
                    if (!seen.has(j) && !visitedByTeam[t].has(j)) {
                        seen.add(j);
                        q.push([j, d + 1]);
                    }
                });
            }
            return -1;
        }

        function init(forceNew = false) {
            stopT(); $('#modal').classList.remove('show');
            zScale = 1; zPanX = 0; zPanY = 0; lastFocusKey = null; applyTransform(); selectedStudent = null;
            const savedStateStr = localStorage.getItem('gameState_' + currentClassID);
            let state = null;
            if (savedStateStr && !forceNew) {
                state = JSON.parse(savedStateStr);
            }

            if (state && state.numT === numT) {
                // Khôi phục State
                N = state.N;
                E = state.E;
                heads = state.heads;
                owned = state.owned.map(arr => new Set(arr));
                const isLegacyState = !Array.isArray(state.visitedByTeam);
                if (isLegacyState) {
                    E = E.filter(edge => !edge.rescue);
                    E.forEach(edge => { edge.alive = true; });
                }
                paths = Array.isArray(state.paths) && state.paths.length === numT
                    ? state.paths.map(path => path.slice())
                    : owned.map((nodes, team) => {
                        const path = Array.from(nodes);
                        if (!path.includes(state.heads[team])) path.push(state.heads[team]);
                        return path;
                    });
                visitedByTeam = Array.isArray(state.visitedByTeam) && state.visitedByTeam.length === numT
                    ? state.visitedByTeam.map(nodes => new Set(nodes))
                    : paths.map(path => new Set(path));
                traversedByTeam = Array.isArray(state.traversedByTeam) && state.traversedByTeam.length === numT
                    ? state.traversedByTeam.map(edges => new Set(edges))
                    : paths.map(path => new Set(path.slice(1).map((node, i) => edgeKey(path[i], node))));
                turn = state.turn;
                over = state.over;
                stuck = state.stuck;

                const savedLog = localStorage.getItem('gameLog_' + currentClassID);
                gameLog = savedLog ? JSON.parse(savedLog) : [];
                toast(`Đã khôi phục thành công bản đồ cũ của ${currentClassID.replace('_', '/')}.`, 'ok');
            } else {
                // Tạo mới hoàn toàn
                const g = buildBalancedMap(numT);
                N = g.P.map(p => ({ x: p.x, y: p.y, t: p.t, owner: -1, dead: false }));
                g.lanes.forEach((ln, t) => ln.forEach(nid => N[nid].owner = t));
                E = g.E.map(([a, b]) => ({ a, b, alive: true, rescue: false }));
                heads = g.lanes.map(l => l[l.length - 1]);
                owned = g.lanes.map(l => new Set(l));   // thứ tự: T, n1, n2, n3 (n3 là đầu)
                paths = g.lanes.map(l => l.slice());
                visitedByTeam = paths.map(path => new Set(path));
                traversedByTeam = g.lanes.map(lane => new Set(lane.slice(1).map((node, i) => edgeKey(lane[i], node))));
                over = false; busy = false; stuck = Array(numT).fill(false); turn = numT - 1;
                gameLog = [];
                nextTurn();
                const routeLengths = g.startDistances.map((distance, team) => `Tổ ${team + 1}: ${distance} bước`).join(' · ');
                toast(`Bản đồ mới cho ${currentClassID.replace('_', '/')}. Đường ngắn nhất tới lõi: ${routeLengths}`, 'ok');
            }

            zGroup.innerHTML = '';
            svgE = E.map(e => {
                let cl = 'edge' + (e.rescue ? ' rescue' : '');
                return mk('line', { class: cl, x1: N[e.a].x, y1: N[e.a].y, x2: N[e.b].x, y2: N[e.b].y }, zGroup)
            });
            svgTrail = E.map(() => TEAMS.map(() => mk('line', { class: 'edge-trail', display: 'none' }, zGroup)));

            svgN = N.map((n, i) => {
                const gr = mk('g', { class: 'node' }, zGroup), r = NS_R(n);
                mk('circle', { class: 'r2', cx: n.x, cy: n.y, r: r + 8 }, gr);
                mk('circle', { class: 'r1', cx: n.x, cy: n.y, r: r + 5 }, gr);
                mk('circle', { class: 'b', cx: n.x, cy: n.y, r }, gr);
                mk('text', { x: n.x, y: n.y, 'font-size': n.t == 'c' ? 22 : n.t == 's' ? 14 : 11 }, gr);
                TEAMS.forEach((team, teamId) => mk('circle', {
                    class: 'trail-ring',
                    cx: n.x,
                    cy: n.y,
                    r: r + 12 + teamId * 4,
                    stroke: team.c
                }, gr));
                if (n.t == 'c') mk('text', { class: 'clabel', x: n.x, y: n.y + 60 }, gr).textContent = 'LÕI MÁY CHỦ';
                gr.onclick = () => pick(i);
                return gr;
            });

            render();
            saveGameState();
        }

        function render() {
            const C = over ? [] : cands(turn);
            document.documentElement.style.setProperty('--tc', TEAMS[turn].c);

            E.forEach((e, k) => {
                const a = N[e.a], own = e.alive && a.owner >= 0 && a.owner == N[e.b].owner;
                let isRescue = e.rescue && !own;
                svgE[k].setAttribute('class', 'edge' + (e.alive ? '' : ' cut') + (own ? ' own' : '') + (isRescue ? ' rescue' : ''));
                svgE[k].style.stroke = own ? TEAMS[a.owner].c : '';
                const dx = N[e.b].x - a.x, dy = N[e.b].y - a.y;
                const length = Math.hypot(dx, dy) || 1;
                const edge = edgeKey(e.a, e.b);
                const teamsUsingEdge = traversedByTeam
                    .flatMap((teamEdges, teamId) => e.alive && teamEdges.has(edge) ? [teamId] : []);
                traversedByTeam.forEach((teamEdges, teamId) => {
                    const trail = svgTrail[k][teamId];
                    const trailIndex = teamsUsingEdge.indexOf(teamId);
                    const used = trailIndex >= 0;
                    const offset = (trailIndex - (teamsUsingEdge.length - 1) / 2) * 3;
                    trail.setAttribute('x1', a.x - dy / length * offset);
                    trail.setAttribute('y1', a.y + dx / length * offset);
                    trail.setAttribute('x2', N[e.b].x - dy / length * offset);
                    trail.setAttribute('y2', N[e.b].y + dx / length * offset);
                    trail.setAttribute('stroke', TEAMS[teamId].c);
                    trail.style.display = used ? 'inline' : 'none';
                });
            });

            N.forEach((n, i) => {
                const gr = svgN[i], ho = heads.indexOf(i);
                gr.setAttribute('class', 'node' + (C.includes(i) ? ' cand' : ''));
                const [r2, , b, tx] = gr.children;
                r2.style.display = ho >= 0 ? 'block' : 'none';
                if (ho >= 0) r2.style.stroke = TEAMS[ho].c;
                b.style.fill = n.owner >= 0 ? TEAMS[n.owner].c : '';
                tx.style.fill = n.owner >= 0 ? '#07101f' : '';
                TEAMS.forEach((team, teamId) => {
                    gr.children[4 + teamId].style.display = visitedByTeam[teamId].has(i) ? 'block' : 'none';
                });

                if (n.t == 'c') { tx.textContent = 'LÕI'; }
                else if (n.t == 's') { tx.textContent = 'T' + (n.owner + 1); }
                else { tx.textContent = i; }
            });

            if (over) {
                $('#turn').innerHTML = 'KẾT THÚC VÁN CHƠI';
                $('#students-list').innerHTML = '<div style="text-align:center; padding: 20px;">Ván chơi đã kết thúc. Hãy bấm Kết thúc để xem bảng xếp hạng và quản lý lớp.</div>';
            } else {
                $('#turn').innerHTML = `Lượt: <b style="color:${TEAMS[turn].c}">${TEAMS[turn].n}</b> ➔ Thầy chọn HS trước khi đi!`;
                renderStudents();
            }

            $('#teams').innerHTML = TEAMS.map((t, i) => {
                return `<div class="tm${i == turn && !over ? ' on' : ''}" style="--c:${t.c}">
                    <b>${t.n}</b>
                    <span>Chiếm: ${owned[i].size} ô</span>
                    <button class="btn bad" style="padding:5px 7px; margin-top:6px; font-size:.75rem"
                        onclick="punishTeam(${i})" ${owned[i].size <= 1 || over || busy ? 'disabled' : ''}>⚠ Phạt lùi 1 node</button>
                </div>`
            }).join('');
            focusTurn();
        }

        window.punishTeam = function (teamId) {
            if (over || busy || teamId < 0 || teamId >= numT) return;

            const previousHeadIndex = paths[teamId].lastIndexOf(heads[teamId]) - 1;
            if (previousHeadIndex < 0) return;

            const previousHead = paths[teamId][previousHeadIndex];
            const removedHead = heads[teamId];
            paths[teamId].pop();
            if (N[removedHead].owner === teamId) {
                owned[teamId].delete(removedHead);
                N[removedHead].owner = -1;
            }
            heads[teamId] = previousHead;
            visitedByTeam[teamId] = new Set(paths[teamId]);
            stuck[teamId] = false;

            render();
            saveGameState();
            toast(`${TEAMS[teamId].n} bị phạt lùi về node trước đó.`, 'bad');
        };

        // Render TOÀN BỘ danh sách học sinh
        function renderStudents() {
            $('#st-head-title').textContent = `DANH SÁCH LỚP (${classStudents.length})`;
            $('#students-header').style.color = TEAMS[turn].c;
            $('#students-header').style.borderColor = TEAMS[turn].c;

            const html = classStudents.map((stu, idx) => {
                const cd = cooldowns[stu.id] || 0;
                const isCD = cd > 0;
                const isSelected = selectedStudent === stu.id;
                const tIdx = studentTeamMap[stu.id];
                const teamBadge = (tIdx !== undefined && tIdx >= 0 && tIdx < numT) ? ` <span style="color:${TEAMS[tIdx].c}; font-size:0.85rem">[${TEAMS[tIdx].n}]</span>` : '';

                return `<button class="stu-btn ${isSelected ? 'active' : ''}" data-id="${stu.id}" data-name="${esc(studentDisplayName(stu))}"
                            ${isCD ? 'disabled title="Đang bị cấm lượt"' : ''}
                            >
                        ${idx + 1}. ${esc(studentDisplayName(stu))}${teamBadge} ${isCD ? `<br><small style="color:#ff5c6c">⏳ (Đang cấm ${cd} lượt ở Tổ này)</small>` : ''}
                        </button>`;
            }).join('');
            $('#students-list').innerHTML = html;
            document.querySelectorAll('.stu-btn').forEach(btn => btn.onclick = () => selectStudent(btn.dataset.id));
            filterStudents();
        }

        window.filterStudents = function () {
            const v = $('#search-student').value.toLowerCase();
            document.querySelectorAll('.stu-btn').forEach(btn => {
                const name = btn.getAttribute('data-name').toLowerCase();
                btn.style.display = name.includes(v) ? 'block' : 'none';
            });
        }

        window.selectStudent = function (name) {
            selectedStudent = name;
            renderStudents();
        };

        function nextTurn() {
            selectedStudent = null;
            let retreated = false;
            for (let k = 1; k <= numT; k++) {
                const t = (turn + k) % numT;
                const c = cands(t);

                if (c.length > 0) {
                    stuck[t] = false;
                    turn = t;
                    // GIẢM COOLDOWN khi đến lượt
                    classStudents.forEach(stu => {
                        if (studentTeamMap[stu.id] === t && cooldowns[stu.id] > 0) cooldowns[stu.id]--;
                    });
                    localStorage.setItem('cooldowns_' + currentClassID, JSON.stringify(cooldowns));
                    return;
                }
                if (paths[t].length > 1) {
                    paths[t].pop();
                    heads[t] = paths[t][paths[t].length - 1];
                    retreated = true;
                    if (!stuck[t]) toast(`[Hết đường mới] ${TEAMS[t].n} lùi 1 ô và mất lượt.`, 'bad');
                } else if (!stuck[t]) {
                    toast(`[Hết đường] ${TEAMS[t].n} đã hết nhánh chưa thử; tổ này mất lượt`, 'bad');
                }
                stuck[t] = true;
            }
            if (retreated) {
                nextTurn();
                return;
            }
            over = true; toast('Tất cả đội đều kẹt cứng!', 'bad');
            forceEnd();
        }

        function pick(i) {
            if (over || busy || !cands(turn).includes(i)) return;

            if (!selectedStudent) {
                toast(`Thầy ơi, thầy chưa chọn Tên Học sinh bên cột danh sách!`, 'bad');
                return;
            }

            busy = true; curId = i;
            const t = TEAMS[turn], g = 1 + Math.floor(Math.random() * 3);
            const nm = ['', 'NHẬN ĐỊNH ĐÚNG / SAI', 'PHÂN LOẠI TÌNH HUỐNG', 'VƯỢT TƯỜNG LỬA'];

            // XÁC NHẬN CHỐNG CHỌN NHẦM
            const student = classStudents.find(s => s.id === selectedStudent);
            $('#mHead').innerHTML = `<span style="color:${t.c}">Bạn ${esc(studentDisplayName(student))} đại diện ${t.n} tiến vào Ô số ${i || 'LÕI'}</span><br><small>Thử thách: ${nm[g]}</small>`;
            $('#tw').style.visibility = 'hidden';

            $('#mBody').innerHTML = `<div class="confirm-box">
                <h3 style="margin-top:0; color:#fff">Sẵn sàng nhận câu hỏi?</h3>
                <div style="display:flex; gap:15px; justify-content:center; margin-top:20px;">
                    <button class="btn good" style="font-size:1.2rem; padding: 15px 30px" onclick="confirmChallenge(${i}, ${g})">🚀 Bắt đầu</button>
                    <button class="btn outline" style="font-size:1.2rem; padding: 15px 30px; color:#fff" onclick="cancelChallenge()">↩ Hủy / Chọn lại</button>
                </div>
            </div>`;
            $('#mRes').innerHTML = '';
            $('#modal').classList.add('show');
        }

        window.cancelChallenge = function () {
            $('#modal').classList.remove('show');
            busy = false; // Mở khóa cho chọn lại
        }

        window.confirmChallenge = function (i, g) {
            done = false; stopT();

            // LƯU GÁN TỔ CHO HỌC SINH VĨNH VIỄN
            studentTeamMap[selectedStudent] = turn;
            localStorage.setItem('studentTeamMap_' + currentClassID, JSON.stringify(studentTeamMap));

            $('#tw').style.visibility = 'visible';
            [0, G1, G2, G3][g]();
        }

        /* ===== KẾT QUẢ VÀ LƯU LOG ===== */
        function formatTime(d) {
            const pad = n => n.toString().padStart(2, '0');
            return `${pad(d.getHours())}:${pad(d.getMinutes())} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
        }

        function finish(win, expMsg) {
            if (done) return; done = true; stopT();
            document.querySelectorAll('#mBody button').forEach(b => b.disabled = true);

            // LƯU LOG XUẤT CSV
            if (selectedStudent && currentQData) {
                const student = classStudents.find(s => s.id === selectedStudent);
                gameLog.push({
                    time: formatTime(new Date()),
                    team: TEAMS[turn].n,
                    studentId: selectedStudent,
                    student: studentDisplayName(student),
                    question: currentQData.q || currentQData.s,
                    result: win ? 'ĐÚNG' : 'SAI'
                });

                // PHẠT COOLDOWN 3 LƯỢT CHÍNH TỔ ĐÓ
                cooldowns[selectedStudent] = 3;
                localStorage.setItem('cooldowns_' + currentClassID, JSON.stringify(cooldowns));
            }

            const expHtml = `<div class="exp-box" style="border-left: 5px solid ${win ? '#2fd16a' : '#ff5c6c'}">
                <b style="color:${win ? '#2fd16a' : '#ff5c6c'}; font-size:1.15rem;">${win ? 'CHÍNH XÁC!' : 'CHƯA CHÍNH XÁC / HẾT GIỜ!'}</b><br>
                <div style="margin-top:8px">${expMsg}</div>
            </div>`;

            $('#mRes').innerHTML = expHtml + `<button class="btn outline" id="cont" style="background:#5b8cff; color:#fff">Đã hiểu - Tiếp tục</button>`;
            $('#cont').onclick = () => { $('#modal').classList.remove('show'); resolve(win, curId) };
        }

        function resolve(win, id) {
            const t = turn, T = TEAMS[t];
            if (win) {
                if (id == 0) {
                    over = true; busy = false; N[0].owner = t; render(); saveGameState(); toast(`Chiến thắng! ${T.n} đã chiếm Lõi Máy Chủ!`, 'win');
                    forceEnd(); return;
                }
                const previousOwner = N[id].owner;
                traversedByTeam[t].add(edgeKey(heads[t], id));
                if (previousOwner < 0) {
                    N[id].owner = t;
                    owned[t].add(id);
                }
                heads[t] = id;
                paths[t].push(id);
                visitedByTeam[t].add(id);
                toast(previousOwner < 0
                    ? `[Thành công] ${T.n} chiếm được ô #${id}`
                    : `[Thành công] ${T.n} đi qua ô #${id}; ô vẫn thuộc ${TEAMS[previousOwner].n}`, 'ok');
            } else if (id == 0) { toast(`Lõi Máy Chủ vẫn đứng vững! ${T.n} mất lượt`, 'bad') }
            else toast(`[Thất bại] ${T.n} mất lượt và đứng tại chỗ; ô #${id} vẫn có thể đi tiếp ở lượt sau`, 'bad');
            busy = false; nextTurn(); render(); saveGameState();
        }

        /* ===== MÀN HÌNH KẾT THÚC & KÉO THẢ QUẢN LÝ HỌC SINH ===== */
        function forceEnd() {
            if (!over) { over = true; stopT(); }

            let ranks = TEAMS.map((t, i) => {
                let d = dist(i);
                return { id: i, n: t.n, c: t.c, nodes: owned[i].size, dist: d < 0 ? 9999 : d };
            });

            ranks.sort((a, b) => {
                if (a.dist !== b.dist) return a.dist - b.dist;
                return b.nodes - a.nodes;
            });

            $('#mHead').innerHTML = `<div style="font-size:1.8rem; color:#ffd84d; margin-bottom: 5px">BẢNG XẾP HẠNG & QUẢN LÝ LỚP</div><small>Nắm kéo tên học sinh để điều chỉnh Tổ (Trạng thái tự động lưu)</small>`;
            $('#tw').style.visibility = 'hidden';

            let endHtml = `<div class="rank-list" style="margin-bottom: 15px;">
                ${ranks.map((r, idx) => `
                    <div class="rank-item" style="border-color:${r.c}; padding: 10px 14px;">
                        <b style="color:${r.c}">Hạng ${idx + 1}:${r.n}</b>
                        <span style="font-size:0.9rem">${r.dist === 9999 ? 'Cô lập' : 'Cách đích ' + r.dist + ' bước'} (${r.nodes} ô)</span>
                    </div>
                `).join('')}
            </div>`;

            // KHUNG KÉO THẢ (DRAG & DROP)
            endHtml += `<div class="dd-container">`;

            // Khu vực Chưa phân tổ (ID = -1)
            endHtml += `<div class="dd-zone" ondragover="allowDrop(event)" ondrop="dropStu(event, -1)">
                <h4 style="color:#ff5c6c">Chưa có Tổ</h4>
                <div style="display:flex; gap:5px; margin-bottom: 10px;">
                    <input type="text" id="new-stu-input" placeholder="Tên HS mới..." style="flex:1; width:20px; font-size:0.85rem; padding: 5px; border-radius:4px; outline:none; border:none;">
                    <button class="btn good" style="padding:4px 8px; font-size:0.8rem" onclick="addNewStu()">+</button>
                </div>
                <div id="zone--1" style="min-height:50px; display:flex; flex-direction:column; gap:6px;"></div>
            </div>`;

            // Khu vực các Tổ
            TEAMS.forEach((t, i) => {
                endHtml += `<div class="dd-zone" ondragover="allowDrop(event)" ondrop="dropStu(event, ${i})">
                    <h4 style="color:${t.c}">${t.n}</h4>
                    <div id="zone-${i}" style="min-height:50px; display:flex; flex-direction:column; gap:6px;"></div>
                </div>`;
            });
            endHtml += `</div>`;

            $('#mBody').innerHTML = endHtml;
            $('#mRes').innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top:15px;">
                    <button class="btn good" style="font-size: 1.1rem" onclick="exportCSV()">📊 Xuất danh sách lớp (Excel)</button>
                    <button class="btn yellow" style="font-size: 1.1rem" onclick="$('#modal').classList.remove('show'); init(true);">🔄 Tạo Ván Mới (Xóa bản đồ)</button>
                </div>`;
            $('#modal').classList.add('show');

            renderDD(); // Vẽ các nút kéo thả
            render();
            saveGameState();
        }

        // HÀM KÉO THẢ & GÁN TỔ
        window.renderDD = function () {
            for (let i = -1; i < numT; i++) {
                let z = document.getElementById('zone-' + i);
                if (z) z.innerHTML = '';
            }
            classStudents.forEach(stu => {
                let t = studentTeamMap[stu.id];
                if (t === undefined || t === null || t < 0 || t >= numT) t = -1; // -1 là chưa có tổ
                let z = document.getElementById('zone-' + t);
                if (z) {
                    let d = document.createElement('div');
                    d.className = 'dd-item';
                    d.draggable = true;
                    d.id = 'stu-' + Math.random().toString(36).substring(7);
                    d.textContent = studentDisplayName(stu);
                    d.ondragstart = (e) => { e.dataTransfer.setData('text/plain', stu.id); };
                    z.appendChild(d);
                }
            });
        };

        window.allowDrop = function (e) { e.preventDefault(); };

        window.dropStu = function (e, teamId) {
            e.preventDefault();
            let studentId = e.dataTransfer.getData('text/plain');
            if (studentId) {
                if (teamId === -1) {
                    delete studentTeamMap[studentId];
                } else {
                    studentTeamMap[studentId] = teamId;
                }
                localStorage.setItem('studentTeamMap_' + currentClassID, JSON.stringify(studentTeamMap));
                // ĐÃ XÓA ALERT ĐỂ KHÔNG BỊ PHIỀN KHI KÉO THẢ
                renderDD();
                if (!over) renderStudents();
            }
        };

        window.addNewStu = function () {
            let input = document.getElementById('new-stu-input');
            let name = input.value.trim();
            if (name) {

                // Lưu vào localstorage để nhớ vĩnh viễn HS bổ sung
                const extraStr = localStorage.getItem('extra_students_' + currentClassID);
                let extras = extraStr ? JSON.parse(extraStr) : [];
                extras.push({ name: name, teamIdx: -1 });
                localStorage.setItem('extra_students_' + currentClassID, JSON.stringify(extras));
                classStudents.push({ id: `hs-${classStudents.length + 1}`, name });

                input.value = '';
                renderDD();
                if (!over) renderStudents();
            } else {
                toast("Tên học sinh không được để trống!", "bad");
            }
        };

        // XUẤT CSV THEO DẠNG DANH SÁCH LỚP (1 HÀNG / HS)
        window.exportCSV = function () {
            let csvContent = "\uFEFFSTT,Mã học sinh,Họ tên,Tổ,Số lượt ĐÚNG,Số lượt SAI,Chi tiết câu hỏi\n";

            const stats = new Map();
            classStudents.forEach(stu => {
                let tIdx = studentTeamMap[stu.id];
                let tName = (tIdx >= 0 && tIdx < numT) ? TEAMS[tIdx].n : 'Chưa phân tổ';
                stats.set(stu.id, { team: tName, correct: 0, wrong: 0, details: [] });
            });

            const unmatchedLegacy = new Map();
            gameLog.forEach(row => {
                const matches = classStudents.filter(stu => stu.name === row.student);
                const student = row.studentId
                    ? classStudents.find(stu => stu.id === row.studentId)
                    : matches.length === 1 ? matches[0] : null;
                const stat = student ? stats.get(student.id) : null;
                const target = stat || (() => {
                    const key = row.student || 'Không rõ';
                    if (!unmatchedLegacy.has(key)) unmatchedLegacy.set(key, { team: row.team, correct: 0, wrong: 0, details: [] });
                    return unmatchedLegacy.get(key);
                })();

                if (row.result === 'ĐÚNG') target.correct++;
                else target.wrong++;

                target.details.push(`[${row.result}] ${row.question}`);
            });

            // Sắp xếp theo Tổ -> Tên
            let sortedStudents = classStudents.slice().sort((a, b) => {
                let tA = studentTeamMap[a.id] ?? 99;
                let tB = studentTeamMap[b.id] ?? 99;
                if (tA !== tB) return tA - tB;
                return a.name.localeCompare(b.name);
            });

            const csvEscape = value => `"${String(value).replace(/"/g, '""')}"`;
            sortedStudents.forEach((stu, index) => {
                let s = stats.get(stu.id);
                let detailStr = s.details.join(' | ');
                const studentNumber = Number(stu.id.slice(3));
                const studentCode = `HS${String(studentNumber).padStart(3, '0')}`;
                csvContent += `${index + 1},${studentCode},${csvEscape(studentDisplayName(stu))},${csvEscape(s.team)},${s.correct},${s.wrong},${csvEscape(detailStr)}\n`;
            });
            let exportIndex = sortedStudents.length;
            unmatchedLegacy.forEach((s, name) => {
                csvContent += `${++exportIndex},,${csvEscape(`${name} (dữ liệu cũ không phân biệt được)`)},${csvEscape(s.team)},${s.correct},${s.wrong},${csvEscape(s.details.join(' | '))}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `${exportFileBase(currentClassID)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.clearLocalData = function () {
            if (confirm("Xác nhận xóa trắng dữ liệu lớp " + currentClassID.replace('_', '/') + " (Bao gồm Bản đồ đang lưu, Danh sách tổ, Điểm số)?")) {
                localStorage.removeItem('gameState_' + currentClassID);
                localStorage.removeItem('gameLog_' + currentClassID);
                localStorage.removeItem('cooldowns_' + currentClassID);
                localStorage.removeItem('studentTeamMap_' + currentClassID);
                localStorage.removeItem('extra_students_' + currentClassID);
                cooldowns = {};
                studentTeamMap = {};
                gameLog = [];
                alert("Đã xóa! Trò chơi quay về trạng thái rỗng hoàn toàn.");
                location.reload();
            }
        }

        /* TIMER, TOAST VÀ DATA MINI GAMES */
        function startT(sec, cb) {
            stopT(); const t0 = Date.now();
            tm = setInterval(() => {
                const r = 1 - (Date.now() - t0) / (sec * 1000);
                $('#tb').style.width = Math.max(0, r * 100) + '\%'; $('#tl').textContent = Math.ceil(Math.max(0, r * sec)) + 's';
                if (r <= 0) { stopT(); cb() }
            }, 100);
        }
        function stopT() { clearInterval(tm) }
        function toast(m, c) { const d = document.createElement('div'); d.className = 'toast ' + (c || ''); d.textContent = m; $('#toasts').appendChild(d); setTimeout(() => d.remove(), 4200) }

        let currentQData = null;
        function G1() {
            currentQData = draw('tf', TF);
            $('#mBody').innerHTML = `<p class="q big">${currentQData.q}</p>
        <div class="tf-grid">
            <button class="btn" onclick="ch1(true, this)">ĐÚNG</button>
            <button class="btn" onclick="ch1(false, this)">SAI</button>
        </div>`;
            window.ch1 = (ans, btnNode) => {
                if (done) return;
                const isOk = (ans === currentQData.a);
                btnNode.classList.add(isOk ? 'good' : 'bad');
                finish(isOk, currentQData.exp);
            };
            startT(30, () => finish(false, currentQData.exp));
        }
        function G2() {
            currentQData = draw('sit', SIT);
            const o = sh([[currentQData.g, true], [currentQData.b, false]]);
            $('#mBody').innerHTML = `<div class="chat">TÌNH HUỐNG:<br>${currentQData.s}</div><p class="q">Em xử lý thế nào?</p>
                <div class="ans2">${o.map((x, k) => `<button class="btn" onclick="ch2(${x[1]},${k}, this)">${'AB'[k]}.${x[0]}</button>`).join('')}</div>`;
            window.ch2 = (isOk, k, btnNode) => {
                if (done) return;
                btnNode.classList.add(isOk ? 'good' : 'bad');
                if (!isOk) {
                    const btns = document.querySelectorAll('.ans2 button');
                    o.forEach((ans, idx) => { if (ans[1]) btns[idx].classList.add('good'); });
                }
                finish(isOk, currentQData.w);
            };
            startT(45, () => finish(false, currentQData.w));
        }

        function G3() {
            currentQData = draw('qz', QZ);
            const o = sh(currentQData.a.map((t, i) => [t, i === 0]));
            $('#mBody').innerHTML = `<p class="q big">${currentQData.q}</p>
                <div class="ans4">${o.map((x, k) => `<button class="btn" onclick="ch3(${x[1]},${k}, this)">${'ABCD'[k]}.${x[0]}</button>`).join('')}</div>`;
            window.ch3 = (isOk, k, btnNode) => {
                if (done) return;
                btnNode.classList.add(isOk ? 'good' : 'bad');
                if (!isOk) {
                    const btns = document.querySelectorAll('.ans4 button');
                    o.forEach((ans, idx) => { if (ans[1]) btns[idx].classList.add('good'); });
                }
                finish(isOk, currentQData.exp);
            };
            startT(45, () => finish(false, currentQData.exp));
        }
    </script>
</body>
