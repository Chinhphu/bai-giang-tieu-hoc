<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mạng Nhện An Toàn - An toàn thông tin trên mạng (Tin học 4)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap');

        :root {
            --tc: #2fa8ff
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #060c1d;
            color: #e8f1ff;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 18px;
            overflow: hidden
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 18px;
            height: 68px
        }

        header h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 900;
            color: #7dffd4;
            text-shadow: 0 0 12px #19e6a5
        }

        #turn {
            font-weight: 800;
            font-size: 1.15rem;
            padding: 8px 18px;
            border-radius: 30px;
            border: 3px solid var(--tc);
            background: #0d1a3a;
            box-shadow: 0 0 18px var(--tc)
        }

        main {
            display: grid;
            grid-template-columns: 1fr 270px;
            gap: 14px;
            padding: 0 14px 14px;
            height: calc(100vh - 68px)
        }

        #wrap {
            border: 2px solid #1d3a7a;
            border-radius: 18px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #10224d, #060c1d 75%);
            background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px), radial-gradient(circle at 50% 50%, #10224d, #060c1d 75%);
            background-size: 40px 40px, 40px 40px, 100% 100%
        }

        svg {
            width: 100%;
            height: 100%;
            display: block
        }

        .edge {
            stroke: #2f56b3;
            stroke-width: 2;
            opacity: .85;
            transition: all .7s
        }

        .edge.own {
            stroke-width: 5;
            opacity: 1
        }

        .edge.cut {
            opacity: 0;
            stroke: #ff3b5c;
            stroke-width: 8
        }

        .node .b {
            fill: #0e1b3a;
            stroke: #5b8cff;
            stroke-width: 3;
            filter: url(#gl);
            transition: fill .4s
        }

        .node text {
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
            fill: #cfe0ff;
            font-weight: 900
        }

        .node .r1,
        .node .r2 {
            fill: none;
            display: none
        }

        .node .r1 {
            stroke: var(--tc);
            stroke-width: 4;
            transform-box: fill-box;
            transform-origin: center
        }

        .node .r2 {
            stroke-width: 3;
            stroke-dasharray: 6 5
        }

        .node.cand {
            cursor: pointer
        }

        .node.cand .r1 {
            display: block;
            animation: pl 1s infinite
        }

        .node.cand:hover .b {
            stroke: #fff
        }

        .node.dead .b {
            fill: #000 !important;
            stroke: #555;
            filter: none
        }

        .node.dead text {
            fill: #ff4d6a !important
        }

        @keyframes pl {
            50% {
                transform: scale(1.3);
                opacity: .3
            }
        }

        .clabel {
            fill: #7dffd4;
            font-weight: 900;
            font-size: 15px;
            text-anchor: middle
        }

        aside {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: auto
        }

        .tm {
            border: 3px solid var(--c);
            border-radius: 16px;
            padding: 10px 14px;
            background: #0d1a3a;
            display: grid;
            gap: 2px;
            opacity: .75
        }

        .tm.on {
            opacity: 1;
            box-shadow: 0 0 20px var(--c);
            background: #14265a
        }

        .tm b {
            color: var(--c);
            font-size: 1.2rem
        }

        .tm span,
        .tm em {
            font-size: .9rem;
            font-style: normal
        }

        .btn {
            border: 0;
            border-radius: 14px;
            padding: 12px 18px;
            font: inherit;
            font-weight: 800;
            color: #fff;
            background: #7357d9;
            box-shadow: 0 5px 0 #4b399e;
            cursor: pointer;
            transition: transform .12s
        }

        .btn:hover:enabled {
            transform: translateY(-2px)
        }

        .btn:active:enabled {
            transform: translateY(4px);
            box-shadow: none
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed
        }

        .btn.red {
            background: #ff5c6c;
            box-shadow: 0 5px 0 #b83a47
        }

        .btn.orange {
            background: #ff914d;
            box-shadow: 0 5px 0 #c96029
        }

        .btn.teal {
            background: #19b7a5;
            box-shadow: 0 5px 0 #087c70
        }

        .btn.good {
            background: #2fa84a !important
        }

        .btn.bad {
            background: #c0392b !important
        }

        #modal {
            position: fixed;
            inset: 0;
            background: #030814e0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 14px
        }

        #modal.show {
            display: flex
        }

        .mbox {
            width: min(920px, 96vw);
            max-height: 96vh;
            overflow: auto;
            background: #0d1a3a;
            border: 3px solid #5b8cff;
            border-radius: 22px;
            padding: 22px 26px;
            box-shadow: 0 0 40px #2f56b3;
            animation: in .3s
        }

        @keyframes in {
            from {
                transform: scale(.9);
                opacity: 0
            }
        }

        #mHead {
            font-size: 1.4rem;
            font-weight: 900;
            text-align: center;
            line-height: 1.3
        }

        #mHead small {
            color: #7dffd4;
            font-size: 1rem
        }

        #tw {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0
        }

        .tbar {
            flex: 1;
            height: 14px;
            background: #1b2c5c;
            border-radius: 10px;
            overflow: hidden
        }

        #tb {
            display: block;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff5c6c, #ffd84d, #19e6a5)
        }

        #tl {
            font-weight: 900;
            min-width: 40px
        }

        .q {
            text-align: center;
            font-weight: 700;
            margin: 8px 0 14px
        }

        .q.big {
            font-size: 1.5rem;
            font-weight: 900
        }

        .pops {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px
        }

        .pop {
            background: #fff6c9;
            color: #17233c;
            border: 4px solid #ffd84d;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            display: grid;
            gap: 8px;
            transition: all .4s
        }

        .pop.gone {
            opacity: .12;
            transform: scale(.85)
        }

        .pi {
            font-size: 3rem
        }

        .pt {
            font-weight: 800;
            min-height: 3.2em
        }

        .pn {
            font-weight: 900;
            color: #ff5c6c
        }

        .chat {
            background: #16295e;
            border-left: 6px solid #ff5c6c;
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1.3rem;
            font-weight: 700;
            margin: 6px 0 10px
        }

        .ans2,
        .ans4 {
            display: grid;
            gap: 12px
        }

        .ans2 {
            grid-template-columns: 1fr 1fr
        }

        .ans4 {
            grid-template-columns: 1fr 1fr
        }

        .ans2 .btn,
        .ans4 .btn {
            text-align: left;
            font-size: 1.1rem;
            padding: 16px
        }

        .res {
            margin-top: 14px;
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: 800
        }

        .res.ok {
            background: #12452a;
            border: 3px solid #2fd16a
        }

        .res.no {
            background: #4a1520;
            border: 3px solid #ff5c6c
        }

        #mRes {
            text-align: center
        }

        #mRes .btn {
            margin-top: 14px
        }

        #toasts {
            position: fixed;
            top: 76px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            gap: 8px;
            z-index: 99;
            width: min(640px, 94vw)
        }

        .toast {
            padding: 12px 20px;
            border-radius: 14px;
            font-weight: 900;
            text-align: center;
            background: #16295e;
            border: 3px solid #5b8cff;
            animation: in .3s;
            box-shadow: 0 8px 24px #0008
        }

        .toast.ok {
            border-color: #2fd16a
        }

        .toast.bad {
            border-color: #ff5c6c;
            background: #3a1220
        }

        .toast.win {
            border-color: #ffd84d;
            background: #4a3d0a;
            font-size: 1.3rem
        }

        .win {
            font-size: 4rem;
            text-align: center;
            animation: bn .8s infinite alternate
        }

        @keyframes bn {
            to {
                transform: translateY(-12px)
            }
        }

        @media(max-width:900px) {
            main {
                grid-template-columns: 1fr;
                height: auto
            }

            body {
                overflow: auto
            }

            #wrap {
                height: 60vh
            }

            .pops {
                grid-template-columns: 1fr
            }

            .ans2,
            .ans4 {
                grid-template-columns: 1fr
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important
            }
        }
    </style>
</head>

<body>

    <script>
        const $ = s => document.querySelector(s), sh = a => [...a].sort(() => Math.random() - .5), NS = 'http://www.w3.org/2000/svg';
        const TEAMS = [{ n: 'Đội Xanh', c: '#2fa8ff' }, { n: 'Đội Đỏ', c: '#ff4d6a' }, { n: 'Đội Vàng', c: '#ffd84d' }, { n: 'Đội Tím', c: '#b184ff' }];

        /* ===== NGÂN HÀNG CÂU HỎI (cuối mỗi mục: 1 = lừa đảo / đáp án đúng luôn ở vị trí đầu) ===== */
        const POP = [
            [['🎁', 'Trúng thưởng iPhone! Bấm vào để nhận', 1], ['📐', 'Phần mềm học Toán lớp 4', 0], ['💎', 'Nhận kim cương miễn phí – nhập mật khẩu', 1]],
            [['📚', 'Thư viện sách thiếu nhi', 0], ['🎰', 'Quay số nhận 10 triệu ngay!', 1], ['⚠️', 'Máy bạn nhiễm virus! Tải ngay phần mềm này', 1]],

            [['🧪', 'Video thí nghiệm khoa học vui', 0], ['💰', 'Kiếm tiền nhanh, không cần đi học', 1], ['🎁', 'Bấm nhận thẻ nạp game miễn phí', 1]]
        ];
        const SIT = [
            { s: 'Một người lạ nhắn tin chê bai em ngốc nghếch.', g: 'Chặn & báo người lớn', b: 'Trả lời lại cãi nhau', w: 'Đó là bắt nạt trên mạng. Hãy chặn và báo người lớn.' },
            { s: 'Trang web hiện: "Nhập số điện thoại và mật khẩu để nhận iPhone miễn phí".', g: 'Tắt trang & báo người lớn', b: 'Nhập thông tin để nhận quà', w: 'Đây là lừa đảo, kẻ gian muốn lấy thông tin của em.' },

            { s: 'Tin nhắn: "Cho mình mật khẩu game, mình tặng kim cương".', g: 'Không đưa mật khẩu & báo người lớn', b: 'Đưa mật khẩu cho bạn', w: 'Đưa mật khẩu sẽ bị mất tài khoản.' },
            { s: 'Nhóm chat đăng ảnh xấu của em để chế giễu.', g: 'Chặn, giữ bằng chứng & báo thầy cô', b: 'Đăng ảnh xấu của bạn để trả đũa', w: 'Không trả đũa, hãy nhờ thầy cô và bố mẹ giúp đỡ.' },
            { s: 'Em mải xem video giải trí đến khuya, chưa làm bài tập.', g: 'Tắt máy, làm bài rồi mới giải trí', b: 'Xem tiếp cho hết', w: 'Xem web vô bổ quá lâu là lãng phí thời gian.' }
        ];
        const QZ = [
            { q: 'Truy cập web không phù hợp sẽ gây ra điều gì?', a: ['Suy nghĩ lệch lạc, mất thời gian, có thể bị lừa đảo', 'Học giỏi hơn', 'Máy tính chạy nhanh hơn', 'Không có tác hại gì'] },
            { q: 'Mật khẩu tài khoản nên được xử lý thế nào?', a: ['Giữ bí mật, không chia sẻ cho người lạ', 'Cho bạn mới quen biết', 'Đăng lên mạng xã hội', 'Đặt là 123456 cho dễ nhớ'] },
            { q: 'Mã độc có thể gây ra điều gì cho máy tính?', a: ['Làm hỏng máy, đánh cắp thông tin', 'Làm máy đẹp hơn', 'Tăng dung lượng ổ cứng', 'Giúp máy chạy nhanh hơn'] },
            { q: 'Gặp thông tin làm em sợ hãi trên mạng, em nên làm gì đầu tiên?', a: ['Tắt trang và báo người lớn', 'Xem tiếp cho hết', 'Gửi cho bạn bè xem', 'Tự tìm hiểu thêm'] },
            { q: 'Dấu hiệu của quảng cáo lừa đảo là gì?', a: ['Hứa tặng quà, tiền, kim cương miễn phí', 'Có nội dung bài học', 'Có hình ảnh đẹp', 'Có tên trường học'] },
            { q: 'Tường lửa (Firewall) giúp gì cho máy tính?', a: ['Ngăn chặn truy cập nguy hiểm vào máy', 'Làm mát máy tính', 'In tài liệu nhanh hơn', 'Phát nhạc to hơn'] },
            { q: 'Thông tin nào KHÔNG nên đưa cho người lạ trên mạng?', a: ['Địa chỉ nhà, số điện thoại, mật khẩu', 'Tên bài hát em thích', 'Tên con vật em thích', 'Môn học em thích'] },
            { q: 'Bị người khác nhắn tin chê bai, đe dọa trên mạng gọi là gì?', a: ['Bắt nạt trên mạng', 'Trò chơi vui', 'Học trực tuyến', 'Tặng quà'] },
            { q: 'Gặp rắc rối trên Internet, em nên kể với ai?', a: ['Bố mẹ hoặc thầy cô giáo', 'Người lạ trên mạng', 'Không kể với ai', 'Người đã nhắn tin dọa nạt'] },
            { q: 'Cách dùng Internet an toàn là gì?', a: ['Vào web phù hợp lứa tuổi, có người lớn đồng hành', 'Bấm vào mọi đường link', 'Chơi game mọi lúc', 'Kết bạn với mọi người lạ'] },
            { q: 'Nhận đường link lạ từ người không quen, em nên làm gì?', a: ['Không bấm vào', 'Bấm vào xem có gì vui', 'Gửi cho bạn bè xem', 'Nhờ bạn bấm thử'] }
        ];
        const decks = {};
        function draw(k, a) { if (!decks[k] || !decks[k].length) decks[k] = sh(a); return decks[k].pop() }

        /* ===== SINH ĐỒ THỊ ===== */
        function build() {
            const P = [{ x: 500, y: 320, t: 'c' }];
            [[70, 70], [930, 70], [70, 570], [930, 570]].forEach(s => P.push({ x: s[0], y: s[1], t: 's' }));
            for (let k = 0; P.length < 31 && k < 3000; k++) {
                const x = 60 + Math.random() * 880, y = 50 + Math.random() * 540;
                if (P.every(p => Math.hypot(p.x - x, p.y - y) > (p.t == 'n' ? 90 : 115))) P.push({ x, y, t: 'n' });
            }
            const S = new Set();
            P.forEach((p, i) => P.map((q, j) => [j, Math.hypot(p.x - q.x, p.y - q.y)]).filter(o => o[0] != i).sort((a, b) => a[1] - b[1]).slice(0, i ? 3 : 6).forEach(o => S.add(Math.min(i, o[0]) + '-' + Math.max(i, o[0]))));
            return { P, E: [...S].map(s => s.split('-').map(Number)) };
        }
        function valid(g) { // BFS: nối liền, 4 góc cách tâm 3-6 bước và chênh nhau ≤1
            const n = g.P.length, adj = Array.from({ length: n }, () => []);
            g.E.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a) });
            const d = Array(n).fill(-1); d[0] = 0; const q = [0];
            while (q.length) { const i = q.shift(); adj[i].forEach(j => { if (d[j] < 0) { d[j] = d[i] + 1; q.push(j) } }) }
            if (d.some(x => x < 0)) return false;
            const s = [1, 2, 3, 4].map(i => d[i]);
            return Math.min(...s) >= 3 && Math.max(...s) <= 6 && Math.max(...s) - Math.min(...s) <= 1 && [1, 2, 3, 4].every(i => adj[i].length >= 3);
        }
        function gen() { let g; for (let t = 0; t < 500; t++) { g = build(); if (valid(g)) return g } return g }

        /* ===== TRẠNG THÁI ===== */
        let N, E, heads, owned, turn, over, busy, stuck, svgN, svgE, tm, done, curId;
        const R = n => n.t == 'c' ? 42 : n.t == 's' ? 26 : 18;
        function mk(t, a, p) { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e }
        const nb = i => E.filter(e => e.alive && (e.a == i || e.b == i)).map(e => e.a == i ? e.b : e.a);
        function nbrs(arr) { const s = new Set(); arr.forEach(i => nb(i).forEach(j => { if (!N[j].dead && (N[j].owner < 0 || j == 0)) s.add(j) })); return [...s] }
        function cands(t) { let r = nbrs([heads[t]]); if (!r.length) r = nbrs([...owned[t]]); return r } // hết đường thì mở rộng từ các node đã chiếm
        function dist(t) { // BFS đường ngắn nhất còn lại tới Lõi
            const q = [[heads[t], 0]], seen = new Set([heads[t]]);
            while (q.length) {
                const [i, d] = q.shift(); if (i == 0) return d;
                nb(i).forEach(j => { if (!seen.has(j) && !N[j].dead && (N[j].owner < 0 || N[j].owner == t)) { seen.add(j); q.push([j, d + 1]) } })
            }
            return -1;
        }

        function init() {
            stopT(); $('#modal').classList.remove('show');
            const g = gen();
            N = g.P.map((p, i) => ({ x: p.x, y: p.y, t: p.t, owner: p.t == 's' ? i - 1 : -1, dead: false }));
            E = g.E.map(([a, b]) => ({ a, b, alive: true }));
            heads = [1, 2, 3, 4]; owned = [0, 1, 2, 3].map(i => new Set([i + 1]));
            over = false; busy = false; stuck = [false, false, false, false]; turn = 3;
            const s = $('#g');
            s.innerHTML = '<defs><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
            svgE = E.map(e => mk('line', { class: 'edge', x1: N[e.a].x, y1: N[e.a].y, x2: N[e.b].x, y2: N[e.b].y }, s));
            svgN = N.map((n, i) => {
                const g = mk('g', { class: 'node' }, s), r = R(n);
                mk('circle', { class: 'r2', cx: n.x, cy: n.y, r: r + 11 }, g);
                mk('circle', { class: 'r1', cx: n.x, cy: n.y, r: r + 8 }, g);
                mk('circle', { class: 'b', cx: n.x, cy: n.y, r }, g);
                mk('text', { x: n.x, y: n.y, 'font-size': n.t == 'c' ? 34 : n.t == 's' ? 22 : 15 }, g);
                if (n.t == 'c') mk('text', { class: 'clabel', x: n.x, y: n.y + 66 }, g).textContent = 'LÕI MÁY CHỦ';
                g.onclick = () => pick(i);
                return g;
            });
            nextTurn(); render();
            if (!over) toast('🚀 Bắt đầu! Các đội hãy tiến vào Lõi Máy Chủ ở trung tâm.', 'ok');
        }

        function render() {
            const C = over ? [] : cands(turn);
            document.documentElement.style.setProperty('--tc', TEAMS[turn].c);
            E.forEach((e, k) => {
                const a = N[e.a], own = e.alive && a.owner >= 0 && a.owner == N[e.b].owner;
                svgE[k].setAttribute('class', 'edge' + (e.alive ? '' : ' cut') + (own ? ' own' : ''));
                svgE[k].style.stroke = own ? TEAMS[a.owner].c : '';
            });
            N.forEach((n, i) => {
                const g = svgN[i], ho = heads.indexOf(i);
                g.setAttribute('class', 'node' + (n.dead ? ' dead' : '') + (C.includes(i) ? ' cand' : ''));
                const [r2, , b, tx] = g.children;
                r2.style.display = ho >= 0 && !n.dead ? 'block' : 'none';
                if (ho >= 0) r2.style.stroke = TEAMS[ho].c;
                b.style.fill = n.owner >= 0 && !n.dead ? TEAMS[n.owner].c : '';
                tx.style.fill = n.owner >= 0 && !n.dead ? '#07101f' : '';
                tx.textContent = n.dead ? '✖' : n.t == 'c' ? '🗄️' : n.t == 's' ? '🖥️' : n.owner >= 0 ? '✔' : '?';
            });
            $('#turn').innerHTML = over ? '🏁 Kết thúc ván chơi' : `Lượt: <b style="color:${TEAMS[turn].c}">${TEAMS[turn].n}</b> – chọn 1 node đang nhấp nháy`;
            $('#teams').innerHTML = TEAMS.map((t, i) => {
                const d = dist(i);
                return `<div class="tm${i == turn && !over ? ' on' : ''}" style="--c:${t.c}"><b>${t.n}</b><span>🖥️ Đã chiếm: ${owned[i].size} node</span><em>${d < 0 ? '🚫 Bị cô lập' : '🎯 Còn khoảng ' + d + ' bước tới Lõi'}</em></div>`
            }).join('');
        }

        function nextTurn() {
            for (let k = 1; k <= 4; k++) {
                const t = (turn + k) % 4;
                if (cands(t).length) { stuck[t] = false; turn = t; return }
                if (!stuck[t]) { stuck[t] = true; toast(`🚫 ${TEAMS[t].n} bị cô lập, mất lượt`, 'bad') }
            }
            over = true; toast('🌐 Mạng bị tê liệt! Không đội nào đi tiếp được.', 'bad');
            showMsg('🌐', 'Mạng bị tê liệt', 'Không còn đường nào tới Lõi Máy Chủ.');
        }

        function pick(i) {
            if (over || busy || !cands(turn).includes(i)) return;
            busy = true; curId = i;
            const t = TEAMS[turn], g = 1 + Math.floor(Math.random() * 3);
            const nm = ['', '🚫 ĐẬP POP-UP LỪA ĐẢO', '🛡️ PHÂN LOẠI THÔNG TIN', '🔥 KÍCH HOẠT TƯỜNG LỬA'];
            done = false; stopT();
            $('#mHead').innerHTML = `<span style="color:${t.c}">${t.n}</span> tiến vào ${i ? 'Node #' + i : 'LÕI MÁY CHỦ'}<br><small>${nm[g]}</small>`;
            $('#mRes').innerHTML = ''; $('#tw').style.visibility = 'visible';
            $('#modal').classList.add('show');
            [0, G1, G2, G3][g]();
        }

        /* ===== TIMER ===== */
        function startT(sec, cb) {
            stopT(); const t0 = Date.now();
            tm = setInterval(() => {
                const r = 1 - (Date.now() - t0) / (sec * 1000);
                $('#tb').style.width = Math.max(0, r * 100) + '%'; $('#tl').textContent = Math.ceil(Math.max(0, r * sec)) + 's';
                if (r <= 0) { stopT(); cb() }
            }, 100);
        }
        function stopT() { clearInterval(tm) }

        /* ===== KẾT QUẢ THỬ THÁCH ===== */
        function finish(win, msg) {
            if (done) return; done = true; stopT();
            document.querySelectorAll('#mBody button').forEach(b => b.disabled = true);
            $('#mRes').innerHTML = `<div class="res ${win ? 'ok' : 'no'}">${win ? '✅ THÀNH CÔNG!' : '❌ THẤT BẠI!'} ${msg}</div><button class="btn teal" id="cont">Tiếp tục ➔</button>`;
            $('#cont').onclick = () => { $('#modal').classList.remove('show'); resolve(win, curId) };
        }
        function resolve(win, id) {
            const t = turn, T = TEAMS[t];
            if (win) {
                if (id == 0) {
                    over = true; busy = false; N[0].owner = t; render(); toast(`🏆 ${T.n} đã về đích – Lõi Máy Chủ!`, 'win');
                    showMsg('🏆', `${T.n} chiến thắng!`, 'Đã chinh phục Lõi Máy Chủ và giữ mạng an toàn!', true); return
                }
                N[id].owner = t; heads[t] = id; owned[t].add(id);
                toast(`✅ ${T.n} chiếm được Node #${id}`, 'ok');
            } else if (id == 0) { toast(`🛡️ Lõi Máy Chủ vẫn đứng vững! ${T.n} mất lượt`, 'bad') }
            else {
                N[id].dead = true; E.forEach(e => { if (e.a == id || e.b == id) e.alive = false });
                toast(`💀 Node #${id} thành DEAD NODE! Các đường nối bị đứt`, 'bad')
            }
            busy = false; nextTurn(); render();
        }
        function showMsg(icon, title, text, win) {
            $('#mHead').innerHTML = title; $('#tw').style.visibility = 'hidden';
            $('#mBody').innerHTML = `<div class="${win ? 'win' : 'q big'}" style="font-size:4rem">${icon}</div><p class="q big">${text}</p>`;
            $('#mRes').innerHTML = '<button class="btn orange" onclick="init()">🔄 Chơi ván mới</button>';
            $('#modal').classList.add('show');
        }
        function toast(m, c) { const d = document.createElement('div'); d.className = 'toast ' + (c || ''); d.textContent = m; $('#toasts').appendChild(d); setTimeout(() => d.remove(), 4200) }

        /* ===== 3 MINI-GAME ===== */
        function G1() {
            const set = sh(draw('pop', POP)); let n = 0;
            $('#mBody').innerHTML = `<p class="q">Đội chọn đập biển nào để KHÔNG dính mã độc? Hãy bấm <b>Xóa</b> theo đội hô!</p><div class="pops">${set.map((p, k) => `<div class="pop" id="p${k}"><div class="pi">${p[0]}</div><div class="pt">${p[1]}</div><div class="pn">Biển ${k + 1}</div><button class="btn red" onclick="del(${k})">🗑️ Xóa</button></div>`).join('')}</div>`;
            window.del = k => {
                if (done) return;
                $('#p' + k).classList.add('gone'); $('#p' + k + ' button').disabled = true;
                if (!set[k][2]) return finish(false, 'Biển đó là nội dung an toàn nhưng đã bị xóa mất!');
                if (++n == 2) finish(true, 'Đã xóa 2 quảng cáo lừa đảo và giữ lại nội dung an toàn. Quảng cáo "quà miễn phí" thường chứa mã độc!');
            };
            startT(15, () => finish(false, 'Hết 15 giây! Mã độc đã lây vào máy.'));
        }
        function G2() {
            const s = draw('sit', SIT), o = sh([[s.g, 1], [s.b, 0]]);
            $('#mBody').innerHTML = `<div class="chat">💬 ${s.s}</div><p class="q">Thảo luận 10 giây rồi chốt đáp án!</p><div class="ans2">${o.map((x, k) => `<button class="btn ${k ? 'orange' : 'teal'}" onclick="ch2(${x[1]})">${'AB'[k]}. ${x[0]}</button>`).join('')}</div>`;
            window.ch2 = w => finish(!!w, s.w);
            startT(10, () => finish(false, 'Hết giờ thảo luận! ' + s.w));
        }
        function G3() {
            const q = draw('qz', QZ), o = sh(q.a.map((t, i) => [t, i == 0]));
            $('#mBody').innerHTML = `<p class="q big">${q.q}</p><div class="ans4">${o.map((x, k) => `<button class="btn" onclick="ch3(${x[1]},${k})">${'ABCD'[k]}. ${x[0]}</button>`).join('')}</div>`;
            window.ch3 = (ok, k) => { if (done) return; document.querySelectorAll('.ans4 button')[k].classList.add(ok ? 'good' : 'bad'); finish(ok, ok ? 'Đáp án đúng!' : 'Đáp án đúng là: ' + q.a[0]) };
            $('#tw').style.visibility = 'hidden';
        }

        init();
    </script>
</body>

</html>
